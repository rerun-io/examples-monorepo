# COLMAP main (4.3.0.dev0, pinned after FlexGlue #4908..#4969) + pycolmap with CASPAR (COLMAP's GPU bundle adjuster)
# and two extra Caspar adapters: OPENCV_FISHEYE (RoboCap's Kannala-Brandt rigs) and fixed-calibration FULL_OPENCV
# (8-coefficient OpenCV rigs such as MSD). FlexGlue (dense sparse-to-dense matcher, ONNX) is upstream code, unpatched.
#
# Why from source: every distributed COLMAP binary ships CASPAR_ENABLED=OFF, and FlexGlue is not in a release yet.
# Upstream CASPAR handles PINHOLE and SIMPLE_RADIAL only (colmap main, 2026-11-15; OPENCV is colmap#4611,
# THIN_PRISM_FISHEYE colmap#4657, both open), so RoboCap's fisheye rig and MSD's 8-coefficient rig each need an adapter.
#
# The patches (patches/, applied in list order to the pinned upstream clone):
#   add-caspar-adapters.patch                hand-written, 4 files: `OpenCVFisheyeAdapter` and `FullOpenCVAdapter` in
#       caspar_model_adapter.h, their dispatch in bundle_adjustment_caspar.cc, their residuals and the SumStore
#       padding-thread fix in Symforce-Caspar/caspar_generate.py, two FAQ lines. FULL_OPENCV: fixed intrinsics and
#       fixed sensor_from_rig only (twelve parameters do not fit a tunable calib in Caspar's shared memory, the
#       pattern of upstream PR #4657).
#   add-caspar-adapters-generated-f32.patch  Symforce 0.12.0 output: 266 new fp32 kernels (224 fisheye, 42
#       FULL_OPENCV) plus the 4 regenerated aggregates (solver.{h,cc}, caspar_mappings.{h,cu}). Not hand-editable.
#   add-database-transaction-rollback.patch  hand-written hook, 4 files: `DatabaseTransaction::Rollback` (SQLite
#       ROLLBACK TRANSACTION) and pycolmap's `with DatabaseTransaction(db):` rolling back when the block raises.
#       Upstream commits on an exception, so colsfm's chunk writes (matches + verified geometries) could not be
#       all-or-nothing, and a delete-based repair would bring back COLMAP's VACUUM.
#   caspar-pcg-beta-recurrence.patch        hand-written, 2 files: Symforce 0.12's PCG
#       computed beta as rho_k / rho_0 (its solver template never refreshes alpha_numerator), losing conjugacy from
#       the third iteration on. BetaFromNumDenom now keeps rho_k as the next divisor.
#   caspar-reduced-camera-system.patch       hand-written, 9 files (its span helpers rendered from the generated layout by
#       tools/caspar_rcs_helpers.py): an option-gated
#       reduced camera system (off by default; colsfm turns it on): points eliminated inside the PCG
#       (implicit Schur product from the generated matvec and Point normalize kernels, back-substitution after it),
#       PCG stopped on the Ceres/rootba Q criterion (reduced_pcg_eta 0.1, reduced_pcg_iter_max 500), guarded against
#       exact convergence and breakdown, parameters validated. Camera buffer spans come from the generated layout.
#       Without both patches CASPAR stopped short of its least-squares minimum (KITTI 06: 1,184 mm Sim(3) ATE alone,
#       776 mm only after a Ceres polish; with them 816 mm alone). Details: patches/PROVENANCE.md.
#   caspar-diag-exit-no-convergence.patch    hand-written, 1 file: CONVERGED_DIAG_EXIT (LM damping past its limit after
#       uphill steps) is reported as NO_CONVERGENCE instead of CONVERGENCE.
#   caspar-rig-refine.patch                  hand-written, 5 files: refine_sensor_from_rig on CASPAR. One tunable
#       SensorFromRig node per model and 40 rig factors in caspar_generate.py (calib merged / focal+extra / fixed x pose
#       x point for SIMPLE_RADIAL, PINHOLE, OPENCV_FISHEYE; fixed calib for FULL_OPENCV), the adapter's rig bookkeeping
#       (Ceres' rules for which sensor_from_rig is variable), the C++ test. Four-node factors drop a 4 B shared sum
#       buffer to fit 48 KB (AddSumDirect).
#   caspar-rig-refine-generated-f32.patch    Symforce 0.12.0 output: 424 rig kernels and the 4 aggregates (solver.{h,cc}
#       with the reduced-camera-system edits re-applied, span helpers re-rendered by tools/caspar_rcs_helpers.py).
# How the patches were made, with the generator command and versions: patches/PROVENANCE.md.
# This is the one recipe whose patch is larger than "a hook": the adapter is C++ inside COLMAP's Caspar backend,
# so it cannot live in a Python package (recipes/README.md "Patch or package" names the exception). The generated
# CUDA travels in the patch because conda-forge has no symforce. Source of all eight patches: one commit per patch on
# a local colmap branch, cut by tools/cut_patches.sh (branch, commits and generator: patches/PROVENANCE.md). Drop an
# adapter when upstream CASPAR gains its model.
#
# Two-step build: pycolmap's pyproject builds only the bindings (`cmake.source-dir = "python/"`) and links a
# separately installed libcolmap, and CASPAR_ENABLED lives in libcolmap. So libcolmap is built and installed first.
#
# Arch: SASS for every GPU of its platform, no PTX. linux-64 = RTX 3060 (sm_86) + RTX 4090 (sm_89) + RTX 5090 (sm_120),
# linux-aarch64 = DGX Spark GB10 (sm_121). COLMAP refuses "native"/"all" while CASPAR is on (cmake/FindDependencies.cmake),
# and Caspar's generated CMakeLists honours an explicit CMAKE_CUDA_ARCHITECTURES, so no patch is needed for it. `cuda_archs`
# is the CMake list (quoted where a shell reads it: `;` ends a command); `cuda_arch_tag` is its build-string form (CEP 26:
# a build string has at most 64 characters and no `-`).
context:
  # main 2026-11-15, after FlexGlue's #4969. The patches apply to this revision only; SHA256SUMS proves it.
  colmap_rev: 137f21680c79d3f2fffbb1d11deb367162aa6f83
  cuda_archs: ${{ "121" if target_platform == "linux-aarch64" else "86;89;120" }}
  cuda_arch_tag: ${{ "121" if target_platform == "linux-aarch64" else "86_89_120" }}

package:
  name: colmap-src
  version: "4.3.0.dev0"

source:
  git: https://github.com/colmap/colmap.git
  rev: ${{ colmap_rev }}
  patches:
    - patches/add-caspar-adapters.patch
    - patches/add-caspar-adapters-generated-f32.patch
    - patches/add-database-transaction-rollback.patch
    - patches/caspar-pcg-beta-recurrence.patch
    - patches/caspar-reduced-camera-system.patch
    - patches/caspar-diag-exit-no-convergence.patch
    - patches/caspar-rig-refine.patch
    - patches/caspar-rig-refine-generated-f32.patch

build:
  # Bump with every patch or build-script edit: the build string hash does not follow them (recipes/README.md).
  number: 6
  string: main137f216_caspar_fisheye_fullopencv_rig_cu130_sm${{ cuda_arch_tag }}_py312_${{ build_number }}
  script:
    # Step 0: prove the patches landed byte for byte before the long CUDA compile. A fuzzy applier can skip an
    # already-applied hunk with a warning and exit 0; a skipped hunk in solver.cc would compile and solve wrong.
    # SHA256SUMS lists every file the patches touch, new files included, so no per-patch grep is needed.
    - sha256sum --quiet -c "$RECIPE_DIR/patches/SHA256SUMS"
    # conda's onnxruntime-cpp nests its headers under include/onnxruntime/core/session/; COLMAP includes them flat.
    - export CPATH="$PREFIX/include/onnxruntime/core/session${CPATH:+:$CPATH}"
    # Step 1: libcolmap with CASPAR. FETCH_ONNX=OFF: the fetched prebuilt onnxruntime is CUDA 12. FETCH_FAISS and
    # FETCH_POSELIB OFF: use the host's conda libfaiss (cuda) and poselib, as conda-forge's colmap does, instead of
    # compiling both again inside this build.
    - >-
      cmake -S . -B build_colmap -GNinja
      -DCMAKE_BUILD_TYPE=Release
      -DCMAKE_INSTALL_PREFIX=$PREFIX
      -DCMAKE_PREFIX_PATH=$PREFIX
      -DCUDA_ENABLED=ON
      -DCASPAR_ENABLED=ON
      -DGUI_ENABLED=OFF
      -DTESTS_ENABLED=OFF
      -DFETCH_ONNX=OFF
      -DFETCH_FAISS=OFF
      -DFETCH_POSELIB=OFF
      -DFETCH_BOOST=OFF
      "-DCMAKE_CUDA_ARCHITECTURES=${{ cuda_archs }}"
    - cmake --build build_colmap --parallel ${{ CPU_COUNT }}
    - cmake --install build_colmap
    # Step 2: the bindings against that libcolmap. scikit-build-core defaults to one job without this.
    - export CMAKE_PREFIX_PATH="$PREFIX:${CMAKE_PREFIX_PATH:-}"
    - export CMAKE_BUILD_PARALLEL_LEVEL=${{ CPU_COUNT }}
    - export CMAKE_ARGS="-DCASPAR_ENABLED=ON -DCMAKE_CUDA_ARCHITECTURES=${{ cuda_archs }} -DGENERATE_STUBS=ON -DFETCH_ONNX=OFF -DFETCH_FAISS=OFF -DFETCH_POSELIB=OFF -DFETCH_BOOST=OFF -DCMAKE_PREFIX_PATH=$PREFIX"
    - python -m pip install . -vv --no-build-isolation --no-deps
    # Step 3: the adapter reached the extension module (0 hits in a stock build). pixi-build does not run `tests:`.
    - grep -aq OpenCVFisheyeAdapter "$PREFIX"/lib/python3.12/site-packages/pycolmap/_core*.so
    - grep -aq FullOpenCVAdapter "$PREFIX"/lib/python3.12/site-packages/pycolmap/_core*.so
    # The stubs reached the package (pyrefly reads them; GENERATE_STUBS installs them under pycolmap/_core/).
    - test -f "$PREFIX"/lib/python3.12/site-packages/pycolmap/_core/__init__.pyi
    # FlexGlue is compiled only with ONNX on (COLMAP_ONNX_ENABLED); its default model URI is the marker.
    - grep -rlaq flexglue_descriptor.onnx "$PREFIX"/lib/libcolmap* "$PREFIX"/lib/python3.12/site-packages/pycolmap/

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    # One toolkit version: an unpinned cuda-nvcc takes a newer toolkit than the 13.0 headers.
    - cuda-nvcc 13.0.*
    - cuda-version 13.0.*
    - cmake
    - ninja
    - make
    - git
    - libgomp
    - patchelf
    # pycolmap's generate_stubs.sh post-processes the stubs with perl and formats them with ruff.
    - perl
    - ruff
  host:
    - python 3.12.*
    - pip
    - scikit-build-core
    # Type stubs for the compiled pycolmap._core (GENERATE_STUBS): without them every pycolmap attribute is unknown to
    # pyrefly, which is what colsfm's baseline of ~1,300 `missing-attribute` entries was.
    - pybind11-stubgen 3.*
    - pybind11 >=3.0,<4
    - numpy
    # COLMAP's C++ dependencies, as conda-forge's colmap 4.2.0 cuda_130 build has them, minus Qt (GUI off). The
    # versioned ones match that build, so this package co-solves with pyceres 2.6 (eigen 5, gflags 2.3) and the rest.
    - libboost-devel 1.90.*
    - eigen 5.*
    - ceres-solver
    - poselib
    - cgal-cpp
    - sqlite
    - flann
    - glog
    - gflags 2.3.*
    - freeimage
    - metis 5.1.0.*
    - gmp
    - lz4-c 1.10.*
    - libfaiss * *_cuda
    - libopenimageio
    # Hold libopenimageio's own dependencies at what the workspace's cuda130 torch stack resolves on both platforms
    # (torchvision 0.28 / pytorch 2.12: giflib 5.2, ffmpeg 8, abseil 20260526, protobuf 7.35, OpenEXR 3.4). The newest
    # libopenimageio builds would export giflib 6.1 / ffmpeg 9 pins that cannot co-install with it.
    - giflib 5.2.*
    - ffmpeg 8.*
    - libabseil 20260526.*
    - libprotobuf 7.35.*
    - openexr 3.4.*
    - imath 3.2.2.*
    # OpenImageIOConfig.cmake find_dependency(fmt)s.
    - fmt 12.1.*
    - onnxruntime-cpp * *_cuda130
    # FindDependencies.cmake still needs OpenGL with GUI_ENABLED=OFF.
    - libgl-devel
    - libopengl-devel
    - libglx-devel
    - libegl-devel
    - glew
    - cuda-version 13.0.*
    - cuda-cudart-dev
    - libcurand-dev
    - libcublas-dev
    - libcusparse-dev
    - libcusolver-dev
  run:
    - python 3.12.*
    - numpy
    - libopenimageio
    - libfaiss
    - ceres-solver
    - poselib
    - onnxruntime-cpp * *_cuda130
  run_constraints:
    # SASS for sm_86 + sm_89 + sm_120 (linux-64) or sm_121 (linux-aarch64), no PTX for other GPUs.
    - __cuda >=13.0

tests:
  - script:
      - python -c "import pycolmap; assert pycolmap.has_cuda"
      - python -c "import pathlib, pycolmap; p = pathlib.Path(pycolmap.__file__).parent; assert any(b'OpenCVFisheyeAdapter' in f.read_bytes() for f in p.glob('_core*.so'))"
      - python -c "import pathlib, pycolmap; p = pathlib.Path(pycolmap.__file__).parent; assert any(b'FullOpenCVAdapter' in f.read_bytes() for f in p.glob('_core*.so'))"

about:
  homepage: https://colmap.github.io/
  repository: https://github.com/colmap/colmap
  license: BSD-3-Clause
  license_file: LICENSE
  summary: COLMAP + pycolmap main 137f2168 with CASPAR GPU bundle adjustment, OPENCV_FISHEYE + fixed-calibration FULL_OPENCV Caspar adapters and sensor_from_rig refinement, CUDA 13.
