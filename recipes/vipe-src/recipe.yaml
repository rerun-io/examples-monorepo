# NVIDIA ViPE (nv-tlabs/vipe) at the first commit that carries MetricTrail (vipe/metrictrail); the newest
# release, v1.2.0, predates it. Pure Python, for the workspace's conda-forge torch 2.12 (cuda130).
#
# Nothing is compiled (MetricTrail's import graph, `pipeline=metrictrail`):
#   - ViPE's CUDA extension vipe_ext is not built. Patch 0007 makes `vipe.ext` import packages/vipe-mojo's
#     `vipe_mojo`, which the consuming feature supplies (editable PyPI path package, like lietorch-mojo): the four ops
#     MetricTrail calls (droid_net_ext.corr_index_forward / altcorr_index_forward, slam_ext.ba_extended /
#     frame_distance) are Mojo; every other vipe_ext op raises NotImplementedError naming it. build.sh deletes csrc and
#     vipe/ext/specs.py.
#   - MetricTrail's DPVO is packages/dpvo's `dpvo.metric` (MetricDPVO), not ViPE's vendored copy: build.sh deletes
#     vipe/metrictrail/{dpvo,csrc,dpvo_ext,dpvo_ext_loader.py,dpvo_scatter.py,build.py} and copies the re-export shims
#     of dpvo_shim/ into vipe/metrictrail/dpvo, so slam.py imports them unchanged. The consuming feature supplies
#     `dpvo` (editable PyPI path package) with its Mojo kernels.
#   - Deleted, not built: the optional stereo runner and its own DPVO copy (vipe/metrictrail/{stereo,
#     dpvo_stereo_ext}); nothing outside it imports it.
# Reuse instead of ViPE's in-tree copies (phase-0 parity proofs in the MetricTrail port notes):
#   - DPVO: packages/dpvo (above); the lockstep proof against ViPE's copy is in the dpvo-metric-core ladder.
#   - lietorch: ViPE's vipe/ext/lietorch re-exports the external `lietorch_mojo` module (patch 0001), and so does
#     the shim vipe/metrictrail/dpvo/lietorch; this package does NOT depend on lietorch. The consuming feature
#     supplies lietorch-mojo.
#   - DINOv3 (DINO-DPVO's frozen ViT-S/16): the `dinov3` package from recipes/dinov3-src (patch 0002, a run
#     dependency). ViPE's in-tree DINOv3 (vipe/priors/depth/dap/dino.py) stays: the DAP panorama prior uses it.
#   - MoGe-2 (`moge2-l`): packages/monoprior's MoGe-2; build.sh deletes ViPE's vendored vipe/priors/depth/moge2.
#     Patch 0003 builds monopriors' MoGeModel for ViPE's own `MogeModel` (checkpoint Ruicheng/moge-2-vitl @ 39c4d5e).
#     monopriors is a PyPI path package, so the consuming feature supplies it (editable), like lietorch-mojo.
#   - MetricTrail's shipped prior (moge-2-vitl-normal through monopriors' TensorRT engine, forward cache, normals)
#     lives in packages/metrictrail (metrictrail.moge2); patch 0004 is only the two hooks it plugs into.
package:
  name: vipe-src
  version: "1.2.0.ead2e00"

source:
  # GitHub archive of ead2e008bc055310121736a49ff306bba50d10dc (rattler-build create-patch needs a url source).
  url: https://github.com/nv-tlabs/vipe/archive/ead2e008bc055310121736a49ff306bba50d10dc.tar.gz
  sha256: c312cbf6f25576aa85aa81e3df9615e024cfa79f3a278c08e908035af86a5ad6
  patches:
    # ViPE's vendored lietorch (vipe/ext/lietorch) re-exports lietorch_mojo; no lietorch_ext build. The deleted
    # vendored files are removed by build.sh, not by the patch (the DPVO copies go with the whole DPVO tree).
    - patches/0001-lietorch-external-provider.patch
    # make_vipe_dinov3_backbone builds dinov3.hub.backbones.dinov3_vits16 (bit-identical patch tokens).
    - patches/0002-dinov3-from-dinov3-src.patch
    # ViPE's `moge2-l` loads monopriors' MoGe v2 (bit-identical on 48 frames, fp16 and fp32) from the pinned
    # checkpoint; runtime_record records torch SDPA for its DINOv2.
    - patches/0003-moge2-from-monopriors.patch
    # Hooks only (recipes/README.md, "Patch or package"): make_metrictrail_depth_model tries the DEPTH_PROVIDERS
    # registry first (packages/metrictrail registers its MoGe-2 normal provider there), and fuse_point_cloud calls an
    # optional on_points(index, rows, cols, world) before each frame's points enter the voxel accumulator.
    - patches/0004-depth-provider-and-fusion-hooks.patch
    # The DINO-fused patchifier takes packages/dpvo's patchify keywords (gradient_bias, centroid_valid) and hands
    # its centroid validity to the base forward, which does the masked draw; its copy of the vendored base forward
    # (_masked_base_forward) is deleted, so the patch is mostly removed lines.
    - patches/0005-dino-patchifier-dpvo-keywords.patch
    # SharedK calibration's depth on keep: a keyframe gets its MoGe-2 forward once the frontend keeps it (pool: 353 -> 164
    # forwards; K and the TUM / 7-Scenes / KITTI ATE within single-seed noise).
    - patches/0006-calibration-depth-on-keep.patch
    # vipe.ext imports vipe_mojo (packages/vipe-mojo) instead of vipe_ext or its JIT build; setup.py builds no
    # extension (no torch import, no CUDAExtension). Removed lines only, plus the import.
    - patches/0007-kernels-from-vipe-mojo.patch

build:
  # Bump with every patch or build.sh change: the build string hash does not follow the recipe content, and the
  # shared rattler package cache would otherwise hand an older build to the next install.
  number: 7
  script:
    file: build.sh

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools >=77
    - wheel
  # What `vipe.metrictrail.pipeline`, `vipe.pipeline.processors` and the `vipe` CLI (vipe.cli.main) import at module
  # load (upstream pyproject, minus what MetricTrail never reaches: gtsam (vipe_long), ray). transformers (Grounding
  # DINO's BERT, used only with dynamic masks) comes from the consuming workspace. PyPI-only: python-pycg
  # (vipe.utils.geometry / visualization) comes from the consuming feature's pypi-dependencies.
  run:
    - python 3.12.*
    # MetricTrail runs on the GPU: never resolve a CPU pytorch.
    - pytorch >=2.12,<2.13 cuda*
    - cuda-version >=13.0,<14
    # MetricTrail's frozen DINOv3 (patch 0002). Sibling recipe: the consuming feature lists it too.
    - dinov3-src
    - torchvision
    - numpy
    - omegaconf
    - hydra-core
    - pydantic >=2,<3
    - einops
    - py-opencv <5
    - scipy
    - pillow
    - imageio
    - imageio-ffmpeg
    - matplotlib
    - tqdm
    - huggingface_hub
    - safetensors
    - kornia
    # Track Anything's AOT/SAM (vipe.pipeline.processors) and the CLI's `vipe visualize` (vipe.cli.main).
    - timm
    - viser
    - click
    - gdown
    - rerun-sdk
    # Upstream pins OpenEXR<3.3.0 for the classic OpenEXR.InputFile/OutputFile + Imath API. conda-forge's <3.3
    # (1.3.9) needs openexr 3.3, which conflicts with libopencv 4.13 (openexr 3.4). 3.4 keeps the classic API:
    # ViPE's depth-zip write/read pattern (vipe/utils/io.py) round-trips fp16 depth exactly.
    - openexr-python >=3.4,<3.5
    # yacs: slam.py's DPVO config is a yacs CfgNode (vipe/metrictrail/dpvo_deps.py, the shim's config.py). numba:
    # packages/dpvo's proximity loop edges (reduce_edges). dpvo itself is not a run dependency: it comes from the
    # consuming feature (an editable PyPI path package, like lietorch-mojo and monopriors).
    - yacs
    - numba

about:
  homepage: https://github.com/nv-tlabs/vipe
  license: Apache-2.0
  license_file: LICENSE
  summary: NVIDIA ViPE + MetricTrail (source at ead2e00), import name `vipe`; kernels from packages/vipe-mojo, DPVO from packages/dpvo
