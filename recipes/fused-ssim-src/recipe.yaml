# fused-ssim (rahul-goel/fused-ssim) at a7c48d6, the fully fused differentiable SSIM (11x11 Gaussian, sigma 1.5) that
# gsplat-style 3DGS trainers use, built for sm_120 (RTX 5090) and sm_121 (DGX Spark) against the workspace's
# conda-forge torch 2.12 (cuda130). There is no conda-forge or PyPI build; upstream's setup.py compiles the
# extension with torch's cpp_extension. TRiGS's reconstruction loss (trigs.core.losses) uses it when importable.
package:
  name: fused-ssim-src
  version: "1.0.0.a7c48d6"

source:
  url: https://github.com/rahul-goel/fused-ssim/archive/a7c48d6dd7ac6dc39a7958c7c4452e0b10418f38.tar.gz
  sha256: 604860a0e344a156fdfac4f195fca25217564e4f2584068f981bcf1abdbf8aa6

build:
  number: 0
  script:
    file: build.sh

requirements:
  build:
    - cuda-compiler 13.0.*
    - cuda-version 13.0.*
    - ninja
  host:
    - python 3.12.*
    - pip
    - setuptools
    - wheel
    - cuda-version 13.0.*
    - pytorch-gpu 2.12.*
    - cuda-cudart-dev
    - cuda-driver-dev
    - cuda-cccl
    - cuda-nvrtc-dev
    - libcublas-dev
    - libcusparse-dev
    - libcusolver-dev
    - libcurand-dev
  run:
    - python 3.12.*
    - pytorch >=2.12,<2.13
    - cuda-version >=13.0,<14

about:
  homepage: https://github.com/rahul-goel/fused-ssim
  summary: fused-ssim (a7c48d6) fused SSIM CUDA kernels for sm_120 and sm_121
