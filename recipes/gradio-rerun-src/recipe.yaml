# gradio-rerun (rerun-io/gradio-rerun-viewer at its 0.44.0 tag, edaf177, the source of the PyPI 0.44.0 wheel; main's
# squashed "Release 0.44.0 (#79)", 6f162a7, differs only in its 0.45.0a1 version strings) with its embedded viewer
# swapped for OUR web viewer: packages/gsplat-rust-renderer's crates/gsplat-viewer-web (the stock re_viewer WebHandle
# plus the compute splat renderer and the Animated SOG / TRiGS motion passes, portable no-subgroups kernels included),
# built for wasm32 from this repository at the same commit. The one patch swaps the frontend dependency
# @rerun-io/web-viewer 0.44.0 for the directory build.sh fills with that build (package.json + pnpm-lock.yaml); the
# package shell (index.js, typings) is the stock npm tarball's, as gsplat-web-build lays it out. Nothing is vendored.
#
# Consumed by the fdanyone-rerun envs only (the PyPI wheel in [feature.common] stays for the other apps; the fdanyone
# envs do not compose it). Cold build on the 5090 box: about 14 min (cargo 12.5 min, wasm-opt 49 s) and
# 11 GB of scratch under .pixi/bld; pixi rebuilds it whenever one of the gsplat source files listed below changes.
context:
  commit: edaf177d8e223ace1ee7b686acc5e3011b61b326

package:
  name: gradio-rerun-src
  version: "0.44.0.edaf177"

source:
  - url: https://github.com/rerun-io/gradio-rerun-viewer/archive/${{ commit }}.tar.gz
    sha256: 38836b24a97c6008618735e6ac5c0ac1fd3526a2d67e82fa9946a9519434fc66
    target_directory: gradio-rerun-viewer
    patches:
      - patches/0001-web-viewer-gsplat-build.patch
  # Only what the web build reads, one path source each: pixi fingerprints every file under a path source (the
  # rattler-build filter does not narrow that), so the whole package directory would rebuild this on every ruff cache,
  # __pycache__ or cargo target/ write. The root Cargo.toml carries the workspace the three crates inherit from.
  - path: ../../packages/gsplat-rust-renderer/Cargo.toml
    target_directory: gsplat-rust-renderer
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/patches
    target_directory: gsplat-rust-renderer/patches
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/crates/gsplat-core
    target_directory: gsplat-rust-renderer/crates/gsplat-core
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/crates/gsplat-viewer
    target_directory: gsplat-rust-renderer/crates/gsplat-viewer
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/crates/gsplat-viewer-web/src
    target_directory: gsplat-rust-renderer/crates/gsplat-viewer-web/src
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/crates/gsplat-viewer-web/Cargo.toml
    target_directory: gsplat-rust-renderer/crates/gsplat-viewer-web
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/crates/gsplat-viewer-web/Cargo.lock
    target_directory: gsplat-rust-renderer/crates/gsplat-viewer-web
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/gsplat_rust_renderer/__init__.py
    target_directory: gsplat-rust-renderer/gsplat_rust_renderer
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/gsplat_rust_renderer/apis/__init__.py
    target_directory: gsplat-rust-renderer/gsplat_rust_renderer/apis
    use_gitignore: false
  - path: ../../packages/gsplat-rust-renderer/gsplat_rust_renderer/apis/build_web_viewer.py
    target_directory: gsplat-rust-renderer/gsplat_rust_renderer/apis
    use_gitignore: false
  # gsplat-viewer depends on the canonical viewer's extension contract crate, which inherits from that workspace's root.
  - path: ../../packages/canonical-viewer/rust/Cargo.toml
    target_directory: canonical-viewer/rust
    use_gitignore: false
  - path: ../../packages/canonical-viewer/rust/crates/extension
    target_directory: canonical-viewer/rust/crates/extension
    use_gitignore: false
  # The stock @rerun-io/web-viewer 0.44.0 package: the shell around our re_viewer.js / re_viewer_bg.wasm.
  - url: https://registry.npmjs.org/@rerun-io/web-viewer/-/web-viewer-0.44.0.tgz
    sha256: 2a4802e337c3c1eb7b6d7df5687723b927f52cfeb996a3b3fde0e0355c1ea558
    target_directory: web-viewer-npm

build:
  # Bump with every patch or build script change (the build string hash does not follow the recipe content).
  number: 0
  noarch: python
  script:
    file: build.sh

requirements:
  build:
    # The gsplat-web toolchain ([feature.gsplat-rust-renderer] + [feature.gsplat-web]).
    - rust 1.98.*
    - rust-std-wasm32-unknown-unknown 1.98.1.*
    - wasm-bindgen-cli ==0.2.129
    - binaryen
    - clang
    - git
    # The gradio-rerun frontend (upstream: Node 22, pnpm 10.17.1).
    - nodejs 22.*
    - pnpm 10.*
  host:
    - python 3.12.*
    - pip
    # upstream's [build-system] (hatchling and two plugins); gradio cc build packages without isolation (build.sh).
    - hatchling
    - hatch-fancy-pypi-readme >=24.1.0
    - hatch-requirements-txt
    - python-build
    # gradio cc build imports gradio_rerun (which imports gradio and rerun).
    - gradio ==6.32.0
    - rerun-sdk ==0.44.0
  run:
    - python >=3.10
    - gradio >=6.0.0
    - rerun-sdk ==0.44.0

tests:
  - python:
      imports:
        - gradio_rerun
      pip_check: false

about:
  homepage: https://github.com/rerun-io/gradio-rerun-viewer
  summary: gradio-rerun 0.44.0 (edaf177) with the custom gsplat web viewer (packages/gsplat-rust-renderer) as its embedded viewer
