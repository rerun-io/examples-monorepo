# MEMFOF multi-frame optical flow (msu-video-group/memfof @ a51de9f, the commit Open4DGS's prep/SETUP.md pins),
# installed as the `memfof` package without pip. Pure PyTorch; inference imports torch, torchvision, einops and
# huggingface_hub (PyTorchModelHubMixin). model_lit.py and datasets.py (lightning, h5py: training only) ship but
# `memfof/__init__.py` does not import them. No patches: Open4DGS passes backbone_weights=None
# (recipes/open4dgs-core-src patch 0001), so construction downloads nothing.
package:
  name: memfof-src
  version: "1.0.3.a51de9f"

source:
  url: https://github.com/msu-video-group/memfof/archive/a51de9fc59c6fe20ba08e079372c7b583d58a712.tar.gz
  sha256: 2bfe97038eec8464196984897a8d2713a46c0fb46fff935a62aa03e5bcd8d78b

build:
  number: 0
  noarch: python
  script:
    # pixi-build reuses the host prefix between rebuilds: clear the target or cp nests a second copy.
    - rm -rf "$SP_DIR/memfof"
    - mkdir -p "$SP_DIR"
    - cp -r memfof "$SP_DIR/memfof"

requirements:
  host:
    - python 3.12.*
  run:
    - python >=3.11

about:
  homepage: https://github.com/msu-video-group/memfof
  license_file: LICENSE
  summary: MEMFOF optical flow (a51de9f), import name `memfof`
