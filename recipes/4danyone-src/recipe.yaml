# Ant Research 4DAnyone (ant-research/4DAnyone) inference source at main 6dcf626 (2026-10-14), installed under its
# upstream import name `fdanyone` (with its vendored DiffSynth Wan 2.2 and pytorch3d_compat). Pure Python.
#
# packages/fdanyone-rerun owns everything we add: the tyro CLIs, the Rerun recording and layouts, the Gradio app,
# the asset tasks. Upstream's GUI (`fdanyone/space`) and nerfstudio export ship unused.
package:
  name: 4danyone-src
  version: "0.1.0.6dcf626"

source:
  url: https://github.com/ant-research/4DAnyone/archive/6dcf626d74bd95c42792f86b1d55e3841075c10c.tar.gz
  sha256: 22fc1abc652e9c198a5a7e791e7b438602d996e8a81fddb422f138db788b8ca2
  patches:
    # Packaging fix: validate_gvhmr reads the commit from <root>/REVISION when the GVHMR tree is not a git checkout
    # (recipes/gvhmr-src installs a tree, not a clone).
    - patches/0001-gvhmr-revision-file.patch
    # Hook only: denoise_group runs fdanyone.model.denoise.STEP_HOOKS with the step's x_0 estimate and the group's
    # target view indices, which the single-GPU target loop now passes. packages/fdanyone-rerun decodes previews there.
    - patches/0002-denoise-step-hook.patch

build:
  # Bump with every patch or script change: the build string hash does not follow the recipe content.
  number: 0
  noarch: python
  script:
    # pixi-build reuses the host prefix between rebuilds: clear the target or cp nests a second copy.
    - rm -rf "$SP_DIR/fdanyone"
    - mkdir -p "$SP_DIR"
    - cp -r fdanyone "$SP_DIR/fdanyone"
    - find "$SP_DIR/fdanyone" -name __pycache__ -prune -exec rm -rf {} +
    - test -f "$SP_DIR/fdanyone/model/denoise.py"
    - grep -q STEP_HOOKS "$SP_DIR/fdanyone/model/denoise.py"

requirements:
  host:
    - python >=3.11
  # Run deps follow the mast3r/asmk convention: python only. Import-time needs (torch, torchvision, numpy, av,
  # einops, safetensors, transformers, huggingface_hub, hydra, ...) come from the consuming feature
  # ([feature.fdanyone-rerun]), with GVHMR from the sibling recipe gvhmr-src.
  run:
    - python >=3.11

about:
  homepage: https://github.com/ant-research/4DAnyone
  license: Apache-2.0
  license_file: LICENSE
  summary: 4DAnyone inference source (6dcf626) as fdanyone
