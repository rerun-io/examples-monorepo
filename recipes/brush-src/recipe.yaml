# Pinned Brush source for Cargo's local dependency overrides.
# The observer patch exposes existing train-step/refinement statistics and timings;
# it leaves training math and renderer code unchanged.
package:
  name: brush-src
  version: "1.0.0"

source:
  git: https://github.com/ArthurBrussee/brush.git
  rev: 1388f74c6fe0236f68ee4915564bf00e9d2e3747
  patches:
    - patches/brush-1388f74c-process-observer.patch

build:
  number: 0
  noarch: generic
  script:
    - rm -rf "$PREFIX/share/brush-src"
    - mkdir -p "$PREFIX/share/brush-src"
    # Rattler build scripts and logs are generated beside the checkout, not source.
    - tar --exclude=build_env.sh --exclude=conda_build.* --exclude=.source_info.json --exclude=.ok --exclude=.git --exclude=apps --exclude=.github --exclude=.zed -cf - . | tar -xf - -C "$PREFIX/share/brush-src"
