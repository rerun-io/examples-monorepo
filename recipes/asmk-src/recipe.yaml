# rattler-build recipe for asmk
# Builds the ASMK image retrieval library, pure Python: its Cython extension asmk.hamming is
# replaced by packages/asmk-rs (`asmk_rs`, Rust), which the consuming feature installs.
package:
  name: asmk-src
  version: "0.1.0"

source:
  git: https://github.com/jenicek/asmk.git
  rev: 2a96d9c03a841dffdfddabc699a20512dcd09363
  # Patches are applied to the cloned source before the build script runs.
  # See each .patch file for detailed comments on what it changes and why.
  patches:
    - patches/add-pyproject-toml.patch
    - patches/hamming-from-asmk-rs.patch

build:
  number: 0
  noarch: python
  script:
    - python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools
  run:
    - python 3.12.*
