# cuda13: PyPI gsplat (== the pinned git rev 970dd84, which IS v1.5.3) instead of
# the git source. pixi's `no-build-isolation` applies to a named PyPI dep but not
# a git dep, so the git build compiled in an isolated env against a PyPI cu128
