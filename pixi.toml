[feature.pyvrs-viewer-demo.tasks.pyvrs-viewer-vrs-to-rrd-quest]
cmd = "python tools/demos/vrs_to_rrd.py --vrs-path data/hot3d_quest.vrs --rr-config.save data/hot3d_quest.rrd"
depends-on = ["_pyvrs-viewer-download-hot3d-quest-vrs"]
cwd = "packages/pyvrs-viewer"
description = "Convert Hot3D Quest VRS to .rrd (2 mono cameras)"

[feature.pyvrs-viewer-demo.tasks.pyvrs-viewer-vrs-to-rrd-aria]
cmd = "python tools/demos/vrs_to_rrd.py --vrs-path data/hot3d_aria.vrs --rr-config.save data/hot3d_aria.rrd"
depends-on = ["_pyvrs-viewer-download-hot3d-aria-vrs"]
cwd = "packages/pyvrs-viewer"
description = "Convert Hot3D Aria VRS to .rrd (cameras + IMU + sensors)"

[feature.pyvrs-viewer-demo.tasks.pyvrs-viewer-benchmark]
