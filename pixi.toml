# posekit
# ═══════════════════════════════════════════════════════════════════════════
[feature.posekit]
platforms = ["linux-64", "linux-aarch64"]

[feature.posekit.dependencies]
# posekit.models imports EgoHand (`egohand`, `egohand_inference`) and DINOv3 (`dinov3`) at import
# time and the Sapiens2 role imports `sapiens2_lite`; every feature that installs posekit installs
# their pinned recipes (recipes/egohand-src, recipes/dinov3-src, recipes/sapiens2-src).
# egohand-src's run dependency on dinov3-src only solves when the env lists it too.
egohand-src = { path = "recipes/egohand-src" }
dinov3-src = { path = "recipes/dinov3-src" }
sapiens2-src = { path = "recipes/sapiens2-src" }
python = "3.12.*"
torchcodec = "*"
tyro = ">=0.9.1,<0.10"

[feature.posekit.pypi-dependencies]
posekit = { path = "packages/posekit", editable = true }
trtkit = { path = "packages/trtkit", editable = true }
sam2 = { path = "packages/sam2-streaming", editable = true }
onnx = "*"
onnxscript = "*"

# EgoHand keeps its inference dependencies outside the base posekit lane; its upstream source
# installs with posekit (recipes/egohand-src, see feature.posekit).
[feature.posekit-egohand]
platforms = ["linux-64", "linux-aarch64"]

[feature.posekit-egohand.dependencies]
hydra-core = "*"
python-dateutil = "<3"
anyio = "<4.15"

[feature.posekit-egohand.pypi-dependencies]
warp-lang = "==1.11.1"

# WiLoR (YOLO hand detector + ViT/RefineNet/MANO) dependencies, outside the base posekit lane.
[feature.posekit-wilor]
platforms = ["linux-64", "linux-aarch64"]

[feature.posekit-wilor.dependencies]
scikit-image = "*"

[feature.posekit-wilor.pypi-dependencies]
ultralytics = "==8.4.52"
roma = "*"
timm = "*"

# These four existing Transformers wrappers have decorated .to() stubs that
# pyrefly misbinds as unbound methods in this isolated dependency solve.
[feature.posekit-egohand.activation.env]
PYREFLY_EXTRA_ARGS = "--baseline ${PIXI_PROJECT_ROOT}/packages/posekit/egohand-pyrefly-baseline.json"

# SAM 3D Body model dependencies, outside the base posekit lane. Its upstream source
# (`sam_3d_body`) installs from the pinned pixi-build recipe in recipes/sam-3d-body-src.
[feature.posekit-sam3d-body]
platforms = ["linux-64", "linux-aarch64"]

[feature.posekit-sam3d-body.dependencies]
sam-3d-body-src = { path = "recipes/sam-3d-body-src" }
# SAM 3D Body builds its DINOv3 backbone from the pinned `dinov3` package; sam-3d-body-src's run
# dependency on that sibling only solves when the env lists it too.
dinov3-src = { path = "recipes/dinov3-src" }
# Upstream's package __init__ imports its image loader, which imports braceexpand.
braceexpand = "*"
yacs = "*"
omegaconf = "*"

[feature.posekit-sam3d-body.pypi-dependencies]
roma = "*"
# GPU crop kernels and the shared Torch/Warp CUDA graph owner.
warp-lang = "==1.11.*"

# SAM 3D Body apps (Gradio, CLI, multi-view demos, benchmark): MoGe-2 FOV through monopriors and
# Open3D TSDF fusion. Only the posekit-body envs carry them; the role itself needs posekit-sam3d-body.
[feature.posekit-body]
platforms = ["linux-64"]

[feature.posekit-body.dependencies]
# The posekit-egohand holds: s3fs needs python-dateutil <3, AnyIO <4.15 keeps typing_extensions.
python-dateutil = "<3"
anyio = "<4.15"
# SAM2-streaming (the posekit feature) passes version_base="1.2", which Hydra 1.4 rejects; this solve picked 1.4.0rc1.
hydra-core = "<1.4"
tomlkit = "==0.12.0"
audioop-lts = "*"
pydub = "*"
open3d = ">=0.19.0,<0.20"
h5py = ">=3.11"
fsspec = ">=2025.3,<=2026.2.0"

[feature.posekit-body.pypi-dependencies]
monopriors = { path = "packages/monoprior", editable = true }
sam3 = { path = "packages/sam3", editable = true }
timm = ">=0.9"
natsort = ">=8.4"
datasets = ">=2.20"
kernels = ">=0.11.3"

[feature.posekit-body.activation.env]
PACKAGE_DIR = "packages/posekit"
# The same four Transformers .to() stub false positives as posekit-egohand; the WiLoR and EgoHand lanes
# are not installed here (see [feature.posekit.activation.env]).
PYREFLY_EXTRA_ARGS = "--baseline ${PIXI_PROJECT_ROOT}/packages/posekit/egohand-pyrefly-baseline.json --project-excludes=src/posekit/models/wilor.py --project-excludes=src/posekit/models/wilor_net/*.py --project-excludes=src/posekit/models/egohand_capture.py --project-excludes=src/posekit/models/egohand_cuda_crops.py --project-excludes=src/posekit/models/egohand_mhr.py --project-excludes=src/posekit/models/egohand_soma.py --project-excludes=src/posekit/models/egohand_tensor.py"

[feature.posekit-body.tasks.posekit-body-download-examples]
