    "cuda",
    "exo-calib",
], solve-group = "exo-calib", no-default-feature = true }
exo-calib-dev = { features = [
    "catalog-common",
    "rerun-prerelease",
    "cuda",
    "exo-calib",
    "dev",
], solve-group = "exo-calib", no-default-feature = true }
monoprior = { features = [
    "common",
    "cuda",
    "monoprior",
], solve-group = "monoprior", no-default-feature = true }
monoprior-dev = { features = [
    "common",
    "cuda",
