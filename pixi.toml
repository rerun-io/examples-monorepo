# ═══════════════════════════════════════════════════════════════════════════
# live-rerun
# Realtime, zero-transcode logging of a sensor's hardware-encoded H.264/H.265
# stream straight into Rerun VideoStream. Backend #1 is DepthAI/OAK. Runs on
# linux-64, linux-aarch64 and osx-arm64 (rerun-sdk + simplecv come from common).
# ═══════════════════════════════════════════════════════════════════════════
[feature.live-rerun]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.live-rerun.dependencies]
python = "3.12.*"
tyro = ">=0.9.1,<0.10"

[feature.live-rerun.pypi-dependencies]
live-rerun = { path = "packages/live-rerun", editable = true }
# DepthAI 2.x is required for this OAK unit (3.x fails to open it). PyPI-only;
# cp312 wheels exist for macosx_11_0_arm64, manylinux_2_17_x86_64 and aarch64.
depthai = "==2.27.0.0"

[feature.live-rerun.activation.env]
PACKAGE_DIR = "packages/live-rerun"
PYREFLY_TARGET = "."
# depthai is a compiled module with an incomplete stub (only the 1-arg
# getOutputQueue overload); baseline the resulting false positives.
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.live-rerun-demo.tasks.live-rerun-oak]
cmd = "python tools/apps/oak_live_rerun.py"
cwd = "packages/live-rerun"
description = "Stream an OAK camera's encoded H.265/H.264 to Rerun (pass --rr-config.save out.rrd for live+save)"

# ═══════════════════════════════════════════════════════════════════════════
# mast3r-slam
# ═══════════════════════════════════════════════════════════════════════════
[feature.mast3r-slam]
channels = [
    "https://prefix.dev/ai-demos",
    "https://conda.modular.com/max-nightly/",
    "conda-forge",
]
platforms = ["linux-64"]

[feature.mast3r-slam.dependencies]
python = "3.11.*"
torchcodec = "*"
eigen = ">=3.4.0,<4"
ffmpeg = ">=7.1.0"
open3d = ">=0.19.0,<0.20"
# cuda13/torch-2.12 forces mkl 2026 (libmkl_intel_lp64.so.3), but conda-forge's
# faiss 1.10.0 mkl builds still link .so.2 → ImportError under mkl 2026. There is
# no cuda13 faiss mkl build. Fix: route this env's whole BLAS stack through
# OpenBLAS — `libblas *openblas` selects pytorch's cuda130_generic build (GPU
# kernels identical to the mkl build; only the CPU BLAS backend differs) and the
# faiss cpu_openblas build, so mkl is dropped entirely (nomkl) and the soname
# clash disappears.
libblas = { version = "*", build = "*openblas" }
faiss = { version = "*", build = "*openblas*" }
scikit-learn = "*"
matplotlib = "*"
trimesh = "*"
mojo = "*"

[feature.mast3r-slam.target.linux-64.dependencies]
lietorch = ">=0.3.0"
mast3r = { path = "packages/mast3r" }
asmk = { path = "packages/asmk" }

[feature.mast3r-slam.pypi-dependencies]
# mast3r-slam is the only pypi editable install remaining.
# lietorch is a prebuilt package from ai-demos channel.
# mast3r and asmk are pixi-build workspace packages.
mast3r-slam = { path = "packages/mast3r-slam", editable = true }
einops = ">=0.8.0"
evo = "*"
natsort = ">=8.4"
pykdtree = "*"
roma = "*"
pyaml = "*"

[feature.mast3r-slam.activation.env]
PACKAGE_DIR = "packages/mast3r-slam"

# NOTE: mast3r-slam-mojo-build env removed. The mojo compiler is available
# directly in the mast3r-slam feature (mojo = "*" + max-nightly channel).
# Installing mojo separately (not via the modular metapackage) avoids pulling
# in max-pipelines → uvicorn → starlette==1.0 which conflicts with gradio.
# See docs/customoplibrary-migration-plan.md for the full package hierarchy.

# ── Build tasks (CUDA extensions compiled via setuptools, no pip) ────────
[feature.mast3r-slam.tasks._mast3r-slam-build-cuda-kernels]
cmd = "python setup.py build_ext --inplace"
cwd = "packages/mast3r-slam"
description = "Build mast3r-slam CUDA backend kernels"
inputs = [
    "packages/mast3r-slam/setup.py",
    "packages/mast3r-slam/mast3r_slam/backend/src/*.cpp",
    "packages/mast3r-slam/mast3r_slam/backend/src/*.cu",
    "packages/mast3r-slam/mast3r_slam/backend/include/*.h",
]
outputs = ["packages/mast3r-slam/mast3r_slam/_backends*.so"]

# ── Mojo kernel build ──────────────────────────────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-build-mojo-kernels]
cmd = "cd packages/mast3r-slam && mojo build --emit shared-lib -o mast3r_slam_mojo_backends.so mast3r_slam/backend/mojo/mast3r_slam_mojo_backends.mojo"
description = "Build mast3r-slam Mojo backend kernels"
inputs = ["packages/mast3r-slam/mast3r_slam/backend/mojo/*.mojo"]
outputs = ["packages/mast3r-slam/mast3r_slam_mojo_backends*.so"]

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-download-checkpoints]
cmd = """
hf download pablovela5620/mast3r-slam \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_codebook.pkl \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_trainingfree.pth \
    --repo-type model --local-dir checkpoints/
"""
cwd = "packages/mast3r-slam"
description = "Download MASt3R-SLAM model checkpoints"
outputs = [
    "packages/mast3r-slam/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth",
]

[feature.mast3r-slam.tasks._mast3r-slam-download-example-data]
cmd = "hf download pablovela5620/mast3r-slam-example-data normal-apt-tour.mp4 livingroom-tour.mp4 --repo-type dataset --local-dir data/"
cwd = "packages/mast3r-slam"
outputs = [
    "packages/mast3r-slam/data/normal-apt-tour.mp4",
    "packages/mast3r-slam/data/livingroom-tour.mp4",
]
description = "Download example video data"

# ── Test baseline task ──────────────────────────────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-generate-test-baseline]
cmd = """python tools/mast3r_slam_inference.py \
  --dataset data/normal-apt-tour.mp4 --img-size 224 \
  --config config/test.yaml --max-frames 30 --no-viz \
  --rr-config.save tests/fixtures/baseline_30frames.rrd"""
depends-on = [
    "_mast3r-slam-build-cuda-kernels",
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Generate baseline .rrd for regression tests (30 frames, deterministic)"
outputs = ["packages/mast3r-slam/tests/fixtures/baseline_30frames.rrd"]

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.mast3r-slam.tasks.mast3r-slam-example-quick]
cmd = "python tools/mast3r_slam_inference.py --dataset data/normal-apt-tour.mp4 --img-size 224 --config config/fast.yaml --max-frames 100"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM on first 100 frames (fast config, ~2 min)"

[feature.mast3r-slam.tasks.mast3r-slam-example-fast]
cmd = "python tools/mast3r_slam_inference.py --dataset data/normal-apt-tour.mp4 --img-size 224 --config config/fast.yaml"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM inference (fast config, 224px, full video)"

[feature.mast3r-slam.tasks.mast3r-slam-example-base]
cmd = "python tools/mast3r_slam_inference.py --dataset data/normal-apt-tour.mp4 --img-size 512 --config config/base.yaml"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM inference (base config, 512px)"

[feature.mast3r-slam.tasks.mast3r-slam-app]
cmd = "python tools/gradio-app.py"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Launch MASt3R-SLAM Gradio web UI"

# ═══════════════════════════════════════════════════════════════════════════
# gsplat-rust-renderer
# ═══════════════════════════════════════════════════════════════════════════
# osx-arm64 extends beyond the workspace platforms (see `common` for the
# pattern): the env solves/installs on macOS for the viewer + PLY-loading
# flows. brush training on macOS is future work — the ai-demos `brush`
# conda package below is linux-64-only.
[feature.gsplat-rust-renderer]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.gsplat-rust-renderer.dependencies]
python = "3.12.*"
rust = "1.93.*"
clang = "*"
cmake = "*"
pkg-config = "*"
numpy = "*"
jaxtyping = "<0.3"
typing_extensions = ">=4.1.0,<4.13.0"
av = "*"
py-opencv = "*"
huggingface_hub = "*"
hf-transfer = "*"
tyro = ">=0.9.1,<0.10"
pyserde = ">=0.31.2,<0.32"
# CPU-only PyTorch for lpips metrics (no CUDA requirement).
pytorch-cpu = ">=2.8.0"
torchvision = "*"

[feature.gsplat-rust-renderer.target.linux-64.dependencies]
# libudev (devel): was needed by the old local-rerun-checkout viewer, whose
# re_viewer pulled re_gamepad/gilrs (gilrs links libudev). The shipped build now
# uses published Rerun 0.33, which does not pull gilrs — currently unused, kept
# as a harmless leaf to avoid a workspace re-solve; drop when the lock is next regenerated.
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"
brush = "==0.3.0"

# Same viewer build deps for aarch64 (DGX Spark). brush is linux-64-only on
# conda-forge and only needed for the benchmark comparisons, so it is
# deliberately absent here.
[feature.gsplat-rust-renderer.target.linux-aarch64.dependencies]
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"

[feature.gsplat-rust-renderer.pypi-dependencies]
gsplat-rust-renderer = { path = "packages/gsplat-rust-renderer", editable = true }
lpips = ">=0.1.4,<1"
plyfile = ">=1.1,<2"
rerun-sdk = "==0.34.1"
simplecv = { path = "packages/simplecv", editable = true }

[feature.gsplat-rust-renderer.activation.env]
PACKAGE_DIR = "packages/gsplat-rust-renderer"
# Make pixi's pkg-config files (libudev.pc) visible to cargo builds.
PKG_CONFIG_PATH = "${CONDA_PREFIX}/lib/pkgconfig"

# ── Download tasks ───────────────────────────────────────────────────────
# nerfbaselines test data (replaces the old pablovela5620 HF mirrors):
#   - datasets:  nerfbaselines/nerfbaselines-data, file blender/<scene>.zip
#     (nerf-synthetic <scene>/transforms_*.json + <scene>/{train,test,val}/*.png)
#   - pretrained: nerfbaselines/nerfbaselines (model), 3dgs-mcmc/blender/<scene>.zip
#     (INRIA-layout checkpoint/point_cloud/iteration_30000/point_cloud.ply + renders)
# hf download fetches the zip; extraction is stdlib zipfile via the package's
# nerfbaselines.extract_zip helper (idempotence-guarded so re-runs are no-ops).
[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-download-nerfbaselines-data-lego]
cmd = "python -m gsplat_rust_renderer.nerfbaselines data lego"
cwd = "packages/gsplat-rust-renderer"
description = "Download + extract the nerfbaselines lego dataset (nerf-synthetic layout)"

[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-download-nerfbaselines-data-hotdog]
