[feature.posekit.activation.env]
PACKAGE_DIR = "packages/posekit"
PYREFLY_TARGET = "src/posekit tests tools"
# Each posekit env typechecks only the modules whose imports it installs, so the check never leans on
# another env's site-packages. Three lanes: SAM 3D Body (sam_3d_body, open3d, warp: posekit-sam3d-body +
# posekit-body), WiLoR (roma, skimage, timm, ultralytics: posekit-wilor) and EgoHand on SOMA (soma, warp:
# soma-runtime + posekit-egohand). The base lane excludes all three; posekit-body and posekit-hands come
# before posekit in their envs (the first feature's value wins) and exclude only what they lack.
# `--project-excludes=<glob>`: with a space the task shell would expand the glob into files to check.
PYREFLY_EXTRA_ARGS = "--project-excludes=src/posekit/models/sam3d_body*.py --project-excludes=src/posekit/body_rerun.py --project-excludes=src/posekit/apis/body3d_mv_video.py --project-excludes=tests/test_body_fast_*.py --project-excludes=src/posekit/models/wilor.py --project-excludes=src/posekit/models/wilor_net/*.py --project-excludes=src/posekit/models/egohand_capture.py --project-excludes=src/posekit/models/egohand_cuda_crops.py --project-excludes=src/posekit/models/egohand_mhr.py --project-excludes=src/posekit/models/egohand_soma.py --project-excludes=src/posekit/models/egohand_tensor.py"

