    "_gsplat-rust-renderer-download-nerfbaselines-data-ficus",
    "_gsplat-rust-renderer-download-nerfbaselines-data-materials",
    "_gsplat-rust-renderer-download-nerfbaselines-data-mic",
    "_gsplat-rust-renderer-download-nerfbaselines-data-ship",
    "_gsplat-rust-renderer-download-nerfbaselines-pretrained-lego",
    "_gsplat-rust-renderer-download-nerfbaselines-pretrained-hotdog",
    "_gsplat-rust-renderer-download-nerfbaselines-pretrained-chair",
