tyro = ">=0.9.1,<0.10"
# No CUDA-13 pycolmap on conda-forge yet: its cuda* builds pin cuda-version <13
# (hard conflict), and the PyPI wheel core-dumps in feature extraction. The
# conda cpu_* build links the env's own libs and passes all tests — the only
# cost is GPU SIFT. Switch back to build = "cuda*" once the conda-forge cuda130
# migration reaches colmap/pycolmap (or build them in ai-demos if GPU SIFT is
# needed sooner).
