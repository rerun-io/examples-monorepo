# ═══════════════════════════════════════════════════════════════════════════
# dataforge
# ═══════════════════════════════════════════════════════════════════════════
# Explicit platforms required — see AGENTS.md "Platforms & lockfile".
[feature.dataforge]
platforms = ["linux-64", "linux-aarch64"]

[feature.dataforge.dependencies]
python = "3.12.*"
# Gen-HumanEgo's millimetre depth PNGs: Up-filter encode and decode in Rust (packages/depth-png).
depth-png = { path = "packages/depth-png" }
tyro = ">=0.9.1,<0.10"
# transports.http_fetch streams and resumes LaMAria's Apache-served files with it.
requests = "*"
# CPU torch only satisfies simplecv's module-load import.
pytorch-cpu = ">=2.8.0"
# 7zz: the only extractor that reads MSD's Info-ZIP multi-volume archives
# (<seq>.z01/.z02/.zip), which Python's zipfile refuses outright.
7zip = ">=24.09"
# The AV1 encoder every image-sequence dataset goes through. conda-forge's build
# carries av1_nvenc, so the default resolve_ffmpeg() works without DATAFORGE_FFMPEG.
# 9.x builds link the env's libjxl; the 8.1 build-number pin other features carry
# does not apply (9.0's build numbers restarted below it and would exclude it).
ffmpeg = ">=9.0.1"
# libturbojpeg for PyTurboJPEG (pypi), which dlopens it from the env.
libjpeg-turbo = ">=3.0.0,<4"

[feature.dataforge.pypi-dependencies]
dataforge = { path = "packages/dataforge", editable = true }
# Decodes the JPEG bytes of VRS image records straight to YUV planes (HOT3D);
# loads the conda libjpeg-turbo's libturbojpeg.
PyTurboJPEG = ">=2.0.0,<3"
# SMPL skinning for the EPFL body_mesh layer, through simplecv's SmplxLayerTorch
# (same pin as [feature.simplecv] and [feature.lamp]).
smplx = ">=0.1.28"

[feature.dataforge.activation.env]
PACKAGE_DIR = "packages/dataforge"
# tests/conftest.py holds the shared fixtures and read-back helpers, and test
# modules import them by module name the way pytest puts them on sys.path;
# pyrefly needs the same directory on its search path to resolve that import.
PYREFLY_EXTRA_ARGS = "--search-path tests"
# huggingface_hub reads its transfer knobs once, at import, so hf_fetch cannot turn
# this on from inside the call; it has to be in the environment dataforge launches with.
HF_XET_HIGH_PERFORMANCE = "1"

[feature.dataforge.tasks.dataforge-download]
cmd = "python tools/apps/download.py"
cwd = "packages/dataforge"
description = "Fetch (or verify, for local corpora) a dataset's raw tree"

[feature.dataforge.tasks.dataforge-convert]
cmd = "python tools/apps/convert.py"
cwd = "packages/dataforge"
description = "Convert discovered sequences into their layer rrds (--sequence, --force)"

[feature.dataforge.tasks.dataforge-register]
cmd = "python tools/apps/register.py"
cwd = "packages/dataforge"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Register every layer's rrds into a local Rerun catalog"

[feature.dataforge.tasks.dataforge-swap-layer]
cmd = "python tools/apps/swap_layer.py"
cwd = "packages/dataforge"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Swap one catalog layer in idle-gated batches with exact segment IDs and SKIP"

[feature.dataforge.tasks.dataforge-publish-blueprints]
cmd = "python tools/apps/publish_blueprints.py"
cwd = "packages/dataforge"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Register fresh device assets and default and segment-table blueprints of an existing dataset, retiring older blueprints"

[feature.dataforge.tasks.dataforge-robocap-calibration]
cmd = "python tools/robocap_calibration.py"
cwd = "packages/dataforge"
description = "Backfill factory calibration and applied timing metadata on legacy RoboCap sessions"

[feature.dataforge.tasks.dataforge-view]
cmd = "python tools/apps/view.py"
cwd = "packages/dataforge"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Open one converted recording — every layer of it — in the viewer (--rr-config.headless in a bare shell)"

[feature.dataforge.tasks.robocap-live-display]
cmd = "python tools/apps/robocap_live_display.py"
cwd = "packages/dataforge"
description = "Prepare DataForge's calibrated RoboCap scene and live blueprint for the Rust recorder"

[feature.dataforge.tasks.dataforge-serve]
# One open fd per registered rrd; the default 1024 overflows fast (see arkitscenes-download-serve).
cmd = "bash -c 'ulimit -n 524288 && exec rerun server --port 51235'"
cwd = "packages/dataforge"
description = "Start the local in-memory Rerun catalog on :51235 (own shell; keep running to register/view)"

# agent-traces — one Claude or Codex session per recording, without torch.
[feature.agent-traces]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.agent-traces.dependencies]
python = "3.12.*"
pyserde = "*"
orjson = "*"
tomli-w = "*"
tyro = ">=0.9.1,<0.10"
# pin-bump: hold — this torch-free lane restates `common`'s exact pin; see AGENTS.md.
rerun-sdk = { version = "==0.42.0", channel = "https://prefix.dev/conda-forge" } # pin-bump: hold
pandas = ">=2"

[feature.agent-traces.pypi-dependencies]
datafusion = "==54.0.0"  # rerun-sdk[catalog]; PyPI, see [feature.common.pypi-dependencies]
agent-traces = { path = "packages/agent-traces", editable = true }

[feature.agent-traces.pypi-options]
index-url = "https://pypi.org/simple"
prerelease-mode = "allow"

[feature.agent-traces.activation.env]
PACKAGE_DIR = "packages/agent-traces"

[feature.agent-traces.tasks.agent-traces-convert-all]
cmd = "python tools/apps/convert_all.py"
cwd = "packages/agent-traces"

[feature.agent-traces.tasks.agent-traces-convert]
cmd = "python tools/apps/convert.py"
cwd = "packages/agent-traces"

[feature.agent-traces.tasks.agent-traces-register]
cmd = "python tools/apps/register.py"
cwd = "packages/agent-traces"

# ═══════════════════════════════════════════════════════════════════════════
# handfit
# ═══════════════════════════════════════════════════════════════════════════
# The native (Rust) hand-pose fit and its pyo3 binding; handtrack's fit_backend="native" and robocap-live use it.
[feature.handfit]
# The native hand-pose fit must build where the tracker runs: x86 workstations, the RoboCap cap (linux-aarch64) and the Mac mini.
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.handfit.dependencies]
python = "3.12.*"
# conda-forge `rust` ships cargo/rustc and sets the linker; same pin as slam-rs.
rust = "1.98.*"
numpy = "*"
tyro = ">=0.9.1,<0.10"
jaxtyping = "*"

[feature.handfit.pypi-dependencies]
handfit = { path = "packages/handfit", editable = true }

[feature.handfit.activation.env]
PACKAGE_DIR = "packages/handfit"
PYREFLY_TARGET = "handfit tools tests"
# cargo names the cdylib per platform; one variable instead of a second build task (as slam-rs's CORE_CDYLIB).
HANDFIT_CDYLIB = "lib_core.so"

[feature.handfit.target.osx-arm64.activation.env]
HANDFIT_CDYLIB = "lib_core.dylib"

[feature.handfit.tasks.handfit-build]
cmd = "cargo build --release -p handfit-py && cp target/release/$HANDFIT_CDYLIB handfit/_core.so"
cwd = "packages/handfit"
inputs = [
    "packages/handfit/Cargo.toml",
    "packages/handfit/Cargo.lock",
    "packages/handfit/crates/*/Cargo.toml",
    "packages/handfit/crates/*/build.rs",
    "packages/handfit/crates/*/src/**",
    "packages/kornia-staging/Cargo.{toml,lock}",
    "packages/kornia-staging/crates/*/{Cargo.toml,build.rs}",
    "packages/kornia-staging/crates/*/src/**",
]
outputs = ["packages/handfit/handfit/_core.so"]
description = "Build the native hand-pose fit and install handfit._core in place"

[feature.handfit.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "tests", "tests-integration", "handfit-cargo-test"]

# Both handfit and handtrack load handfit._core; rebuild before every Python test lane.
[feature.handfit.tasks.tests]
cmd = "cd $PACKAGE_DIR && pytest -q"
depends-on = ["handfit-build"]

[feature.handfit.tasks.tests-integration]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["handfit-build"]

[feature.handfit.tasks.tests-golden]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m golden \"$@\" || test $? -eq 5' _"
depends-on = ["handfit-build"]

[feature.handfit.tasks.handfit-cargo-test]
cmd = "cargo test --release --workspace"
cwd = "packages/handfit"
description = "Run the Rust unit tests of the native fit"

[feature.handfit-codegen]
# SymForce turns the symbolic residuals into Rust (committed under crates/handfit/src/generated/); only the generator needs it.
# Linux only: SymForce's macOS wheel needs macOS 14 and pixi's osx-arm64 lane assumes 13; the generated code is committed anyway.
platforms = ["linux-64", "linux-aarch64"]

[feature.handfit-codegen.pypi-dependencies]
symforce = "==0.12.0"

[feature.handfit-codegen.tasks.handfit-codegen]
cmd = "python tools/codegen.py"
cwd = "packages/handfit"
description = "Regenerate the SymForce residual/Jacobian Rust code"

# ═══════════════════════════════════════════════════════════════════════════
# handtrack
# ═══════════════════════════════════════════════════════════════════════════
# MEgATrack's hand tracker (DetNet-F, KeyNet-F, the LM pose fit, the tracker), trained on
# UmeTrack + SHOW3D streamed from the local Rerun catalog. linux-64 only: NVDEC decode
# through torchcodec, like zipdepth-catalog. Explicit platforms — see AGENTS.md.
[feature.handtrack]
platforms = ["linux-64"]

[feature.handtrack.dependencies]
python = "3.12.*"
tyro = ">=0.9.1,<0.10"
einops = ">=0.8.0,<0.9"
# simplecv's catalog video helpers decode the segment's AV1 packets on NVDEC.
av = ">=18"
torchcodec = "*"
# ffmpeg <902 links libjxl 0.11 and dlopen-fails beside the env's 0.12.
ffmpeg = { version = ">=8.1", build-number = ">=902" }
# torch.cuda.utilization() backend for the data-vs-GPU training instrumentation.
nvidia-ml-py = "*"

[feature.handtrack.pypi-dependencies]
handtrack = { path = "packages/handtrack", editable = true }
dataforge = { path = "packages/dataforge", editable = true }

[feature.handtrack.activation.env]
PACKAGE_DIR = "packages/handtrack"
PYREFLY_TARGET = "handtrack"

# ═══════════════════════════════════════════════════════════════════════════
# robocap-live
# ═══════════════════════════════════════════════════════════════════════════
# The RoboCap hands catalog layer: robocap-live's Rust hand pipeline (DetNet and KeyNet on ONNX Runtime, the perspective
# KeyNet crops, the ROBUST tracker on handfit, the UmeTrack mesh and the hands-layer writer) as the pyo3 module
# robocap_live._core, fed one catalog segment at a time by robocap_live.catalog_segment. The cap binary needs none of this:
# it builds in `robocap-cross` (packages/robocap-live/scripts/build-arm.sh). The env composes `cuda` for onnxruntime-gpu,
# whose libonnxruntime.so the core loads at run time (CUDA execution provider, or the CPU one), and the cuDNN/cuBLAS libraries
# that provider opens. Explicit platforms — see AGENTS.md.
[feature.robocap-live]
platforms = ["linux-64", "linux-aarch64"]

[feature.robocap-live.dependencies]
python = "3.12.*"
# conda-forge `rust` ships cargo/rustc and the host C compiler the capture shim's build.rs needs; same pin as slam-rs.
rust = "1.98.*"
tyro = ">=0.9.1,<0.10"

# The Vulkan loader robocap-live ships beside its cap binary: the caps' firmware has the Mali ICD but no system loader
# (only Chromium's private copy), and wgpu dlopens libvulkan.so.1. scripts/stage-vulkan.sh takes it from this locked package.
[feature.robocap-live.target.linux-aarch64.dependencies]
libvulkan-loader = "==1.4.357.0"

[feature.robocap-live.pypi-dependencies]
robocap-live = { path = "packages/robocap-live", editable = true }

[feature.robocap-live.activation.env]
PACKAGE_DIR = "packages/robocap-live"
PYREFLY_TARGET = "robocap_live tools/apps tests"

# cargo never runs during `pixi lock`/`pixi install`: the extension is built here and dropped beside the Python sources
# (the slam-rs-build pattern). robocap-live path-depends on slam-rs, whose shared CubeCL patches kornia-staging-patch-deps
# prepares.
[feature.robocap-live.tasks.robocap-live-build]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "PYO3_BUILD_EXTENSION_MODULE=1 cargo build --release -p robocap-live-py && cp target/release/lib_core.so robocap_live/_core.so.new && mv robocap_live/_core.so.new robocap_live/_core.so"
cwd = "packages/robocap-live"
inputs = [
    "packages/robocap-live/Cargo.toml",
    "packages/robocap-live/Cargo.lock",
    "packages/robocap-live/crates/*/Cargo.toml",
    "packages/robocap-live/crates/*/build.rs",
    "packages/robocap-live/crates/*/src/**",
    "packages/slam-rs/Cargo.toml",
    "packages/slam-rs/Cargo.lock",
    "packages/slam-rs/crates/*/Cargo.toml",
    "packages/slam-rs/crates/*/build.rs",
    "packages/slam-rs/crates/*/src/**",
    "packages/handfit/Cargo.toml",
    "packages/handfit/Cargo.lock",
    "packages/handfit/crates/*/Cargo.toml",
    "packages/handfit/crates/*/build.rs",
    "packages/handfit/crates/*/src/**",
    "packages/kornia-staging/Cargo.{toml,lock}",
    "packages/kornia-staging/crates/*/{Cargo.toml,build.rs}",
    "packages/kornia-staging/crates/*/src/**",
    "packages/kornia-staging/patches/**",
    "packages/kornia-staging/scripts/prepare_patched_deps.py",
    "packages/kornia-staging/target/patch/**",
]
description = "Build the Rust hands-layer core and install robocap_live._core in place"

# The binding's test embeds this environment's Python: libpython from its lib dir, the standard library from its prefix.
[feature.robocap-live.tasks.robocap-live-rust-test]
cmd = "LD_LIBRARY_PATH=$CONDA_PREFIX/lib PYTHONHOME=$CONDA_PREFIX cargo test --locked --offline --workspace -- --nocapture"
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cwd = "packages/robocap-live"
description = "Run native scheduler, layer, SLAM and panel tests"

[feature.robocap-live.tasks.robocap-live-clippy]
cmd = "cargo clippy --locked --workspace --all-targets -- -D warnings"
cwd = "packages/robocap-live"
description = "Lint the Rust capture workspace with warnings denied"

[feature.robocap-live.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "tests", "tests-integration", "robocap-live-rust-test", "robocap-live-clippy"]
description = "Run Python and native author checks for robocap-live"

[feature.robocap-live.tasks.robocap-hands-layer]
cmd = "python tools/apps/hands_layer.py"
cwd = "packages/robocap-live"
depends-on = ["robocap-live-build"]
description = "Track the hands of one robocap catalog segment and register (or replace) its `hands` layer"

[feature.robocap-live.tasks.robocap-live-download-sample]
cmd = "test -e data/robocap-live-sample/capb-s14-445 || (hf download pablovela5620/robocap-live-sample --repo-type dataset --local-dir data/robocap-live-sample && rm -rf data/robocap-live-sample/.unzip && python -m zipfile -e data/robocap-live-sample/robocap-live-clip.zip data/robocap-live-sample/.unzip && mv data/robocap-live-sample/.unzip/capb-s14-445 data/robocap-live-sample/ && rm -rf data/robocap-live-sample/.unzip data/robocap-live-sample/robocap-live-clip.zip)"
cwd = "packages/robocap-live"
description = "Download the 5 s replay clip, the ONNX hand nets and the display asset from Hugging Face"

[feature.robocap-live.tasks.robocap-live-build-host]
cmd = "cargo build --release -p robocap-live --features ort --bin robocap-live"
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cwd = "packages/robocap-live"
description = "Build robocap-live for this host with the ONNX Runtime hand nets"

# The ort feature loads ONNX Runtime at run time: the library of this env's onnxruntime package.
[feature.robocap-live.tasks.robocap-live-demo]
cmd = '''ORT_DYLIB_PATH=$(python -c "import onnxruntime, pathlib; print(next((pathlib.Path(onnxruntime.__file__).parent / 'capi').glob('libonnxruntime.so*')))") LD_LIBRARY_PATH=$CONDA_PREFIX/lib target/release/robocap-live --source replay data/robocap-live-sample/capb-s14-445 --nets ort data/robocap-live-sample/models --display data/robocap-live-sample/robocap-live-display.rrd --save data/robocap-live-demo.rrd && rerun data/robocap-live-demo.rrd'''
cwd = "packages/robocap-live"
depends-on = ["robocap-live-download-sample", "robocap-live-build-host"]
description = "Replay the sample clip through SLAM and hand tracking, save it, and open it in Rerun"

# Python tests import robocap_live._core, so every tier needs the build first; these shadow the dev feature's tasks.
[feature.robocap-live.tasks.tests]
cmd = "pytest -q -ra"
depends-on = ["robocap-live-build"]
cwd = "packages/robocap-live"
description = "Build the core, then run the package unit tests"

[feature.robocap-live.tasks.tests-integration]
cmd = "sh -c 'pytest -q -ra -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["robocap-live-build"]
cwd = "packages/robocap-live"
description = "Build the core, then run the package integration tests"

[feature.robocap-live.tasks.tests-golden]
cmd = "sh -c 'pytest -q -ra -m golden \"$@\" || test $? -eq 5' _"
depends-on = ["robocap-live-build"]
cwd = "packages/robocap-live"
description = "Build the core, then run the package golden reference tests"

# ═══════════════════════════════════════════════════════════════════════════
# depth-png (Rust core + PyO3 module; dataforge takes the conda build)
# ═══════════════════════════════════════════════════════════════════════════
# The Python module depth_png is a pixi-build source package (packages/depth-png/recipe.yaml), consumed as
# `depth-png = { path = "packages/depth-png" }`; its Python tests live with its consumers (packages/dataforge/tests).
# This feature only checks the Rust workspace: rustfmt, clippy with warnings denied, and the core's tests.
[feature.depth-png-rust]
platforms = ["linux-64", "linux-aarch64"]

[feature.depth-png-rust.dependencies]
rust = "1.98.*"
# pyo3's build script needs an interpreter to configure crates/depth-png-py.
python = "3.12.*"

[feature.depth-png-rust.tasks.depth-png-rust-check]
cmd = "cargo fmt --all --check && cargo clippy --locked --workspace --all-targets -- -D warnings && cargo test --locked -p depth-png"
cwd = "packages/depth-png"
description = "rustfmt, clippy and the core crate's tests for packages/depth-png"

# ═══════════════════════════════════════════════════════════════════════════
# kornia-staging
# ═══════════════════════════════════════════════════════════════════════════
[feature.kornia-staging]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.kornia-staging.dependencies]
