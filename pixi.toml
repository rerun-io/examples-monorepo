# ── Download tasks ───────────────────────────────────────────────────────
[feature.pysfm.tasks._pysfm-download-sfm-example]
# One line on purpose: pixi collapses newlines inside cmd into spaces, which turned the
# previous multi-line `python -c` program into a SyntaxError (AGENTS.md gotcha).
cmd = """
test -d data/examples/sfm_reconstruction/Fountain || \
(mkdir -p data/examples/sfm_reconstruction && \
python -c "import urllib.request, zipfile; urllib.request.urlretrieve('https://cvg-data.inf.ethz.ch/local-feature-evaluation-schoenberger2017/Strecha-Fountain.zip', '/tmp/fountain.zip'); zipfile.ZipFile('/tmp/fountain.zip').extractall('data/examples/sfm_reconstruction')")
"""
cwd = "packages/pysfm"
description = "Download Fountain example dataset for SfM"

[feature.pysfm.tasks._pysfm-download-unknown-rig]
