cwd = "packages/kornia-staging"
description = "Test portable GPU operations on the host device"

[feature.kornia-staging.tasks.kornia-staging-fmt-check]
cmd = "cargo fmt --all -- --check"
cwd = "packages/kornia-staging"
description = "Check Rust formatting"

[feature.kornia-staging.tasks.kornia-staging-clippy]
depends-on = ["kornia-staging-patch-deps"]
cmd = "cargo clippy --locked --workspace --exclude kornia-staging-gpu --all-targets --all-features -- -D warnings && cargo clippy --locked --workspace --exclude kornia-staging-gpu --all-targets --no-default-features -- -D warnings"
cwd = "packages/kornia-staging"
description = "Check all Rust targets with warnings denied"

[feature.kornia-staging.tasks.kornia-staging-test]
depends-on = ["kornia-staging-patch-deps"]
cmd = "cargo test --locked --workspace --exclude kornia-staging-gpu --all-features && cargo test --locked --workspace --exclude kornia-staging-gpu --no-default-features"
cwd = "packages/kornia-staging"
description = "Run Rust workspace tests and doctests"

[feature.kornia-staging.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "kornia-staging-fmt-check", "kornia-staging-clippy", "kornia-staging-test", "kornia-staging-patch-test", "kornia-staging-patch-integration"]
description = "Run the Rust author checks for staged Kornia code"

# ═══════════════════════════════════════════════════════════════════════════
# metrictrail — NVIDIA MetricTrail (ViPE @ ead2e00, recipes/vipe-src) + our benchmark/eval/catalog code
# ═══════════════════════════════════════════════════════════════════════════
# vipe-src is pure Python: ViPE's CUDA extension vipe_ext is not built, `vipe.ext` imports packages/vipe-mojo's
# `vipe_mojo` (recipes/vipe-src patch 0007; see recipes/vipe-src/recipe.yaml).
# MetricTrail's DPVO is packages/dpvo's `dpvo.metric` (MetricDPVO): vipe-src deletes ViPE's vendored copy and installs
# re-export shims at vipe.metrictrail.dpvo. This feature supplies dpvo and vipe-mojo (editable); every task that tracks
# depends on their Mojo builds (`dpvo-mojo-build`, `vipe-mojo-build`).
# Reuse: DINOv3 from recipes/dinov3-src, MoGe-2 from packages/monoprior (monopriors), lietorch from lietorch-mojo:
# ViPE's lietorch re-exports `lietorch_mojo` (recipes/vipe-src patch 0001); the environments compose the
# `lietorch-mojo` feature (like dpvo), and every task that imports lietorch depends on `lietorch-mojo-build`.
[feature.metrictrail]
# linux-aarch64: the DGX Spark (GB10).
platforms = ["linux-64", "linux-aarch64"]

[feature.metrictrail.dependencies]
python = "3.12.*"
vipe-src = { path = "recipes/vipe-src" }
# vipe-src's run dependency (patch 0002: MetricTrail's frozen DINOv3 ViT-S/16); a sibling recipe solves only when listed.
dinov3-src = { path = "recipes/dinov3-src" }
tyro = ">=0.9.1,<0.10"
# Video input decodes on NVDEC (metrictrail.gpu_video, simplecv TorchCodecVideoReader) instead of ViPE's OpenCV stream.
# ffmpeg <902 links libjxl 0.11 and dlopen-fails beside 0.12 (as in the dpvo feature).
torchcodec = "*"
ffmpeg = { version = ">=8.1", build-number = ">=902" }
# The default surface: a sparse colour TSDF (Rust, rayon) fused from every tracked frame, marching-cubes mesh.
tsdf-rs = { path = "packages/tsdf-rs" }
# Depth persists as millimetre PNG EncodedDepthImages (pass_<k>.rrd, run outputs, catalog layers).
depth-png = { path = "packages/depth-png" }

[feature.metrictrail.pypi-dependencies]
metrictrail = { path = "packages/metrictrail", editable = true }
# MetricTrail's DPVO (dpvo.metric) behind vipe-src's vipe.metrictrail.dpvo shims; its kernels: `dpvo-mojo-build`.
dpvo = { path = "packages/dpvo", editable = true }

# ViPE's DROID/SLAM kernels in Mojo: `vipe.ext` imports vipe_mojo (recipes/vipe-src patch 0007); `vipe-mojo-build`.
vipe-mojo = { path = "packages/vipe-mojo", editable = true }
# ViPE's `moge2-l` prior is monopriors' MoGe-2 (recipes/vipe-src patch 0003); metrictrail.moge2 runs monopriors' MoGe-2 on
# the moge-2-vitl-normal checkpoint. Its DINOv2 always uses torch SDPA, so no xformers.
monopriors = { path = "packages/monoprior", editable = true }
# MoGe-2 (moge-2-vitl-normal) runs as monopriors' TensorRT engine (metrictrail.moge2): its TRT lane, like [feature.monoprior].
# tensorrt-cu13 itself comes from the cuda feature.
trtkit = { path = "packages/trtkit", editable = true }
# monopriors' metadata requires sam3; resolve it to the workspace package like the other monopriors consumers
sam3 = { path = "packages/sam3", editable = true }
# vipe.utils.geometry / visualization import pycg (Isometry, Quaternion, image); not on conda-forge.
python-pycg = "==1.0.3"
# metrictrail.catalog.blueprint publishes MetricTrail's layouts through dataforge's VslamLabDataset catalog-blueprint hook.
dataforge = { path = "packages/dataforge", editable = true }

[feature.metrictrail.activation.env]
PACKAGE_DIR = "packages/metrictrail"
PYREFLY_TARGET = "metrictrail tools tests"
# Weights on the NAS SSD tier (MANIFEST.md beside them); ViPE's explicit-file overrides, so a run never downloads.
VIPE_METRICTRAIL_DPVO_CHECKPOINT = "/mnt/nas/ssd-8tb/metrictrail/weights/metrictrail/dino_dpvo.pth"
VIPE_DINOV3_VITS16_CHECKPOINT = "/mnt/nas/ssd-8tb/metrictrail/weights/dinov3/dinov3_vits16_pretrain_lvd1689m-08c60483.pth"
VIPE_MOGE2_CHECKPOINT = "/mnt/nas/ssd-8tb/metrictrail/weights/moge2/moge-2-vitl/model.pt"
TORCH_HOME = "/mnt/nas/ssd-8tb/metrictrail/weights/torch_home"

# dpvo.mojo_backend (packages/dpvo's kernels in Mojo), as [feature.dpvo.tasks.dpvo-mojo-build].
[feature.metrictrail.tasks.dpvo-mojo-build]
cmd = "mojo build --emit shared-lib -I ../lietorch-mojo/lietorch_mojo/mojo -I dpvo/mojo_backend/mojo -o dpvo/mojo_backend/_dpvo_mojo.so dpvo/mojo_backend/mojo/_dpvo_mojo.mojo"
cwd = "packages/dpvo"
description = "Build the Mojo kernels of dpvo.mojo_backend (CPU + GPU kernels for the local GPU)"
inputs = ["packages/dpvo/dpvo/mojo_backend/mojo/*.mojo", "packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/dpvo/dpvo/mojo_backend/_dpvo_mojo.so"]

# ViPE's DROID/SLAM kernels in Mojo (packages/vipe-mojo, import vipe_mojo), the port of ViPE's vipe_ext; `vipe.ext`
# imports it. Built against lietorch-mojo's runtimes like dpvo's Mojo backend.
[feature.metrictrail.tasks.vipe-mojo-build]
cmd = "mojo build --emit shared-lib -I ../lietorch-mojo/lietorch_mojo/mojo -I vipe_mojo/mojo -o vipe_mojo/_vipe_mojo.so vipe_mojo/mojo/_vipe_mojo.mojo"
cwd = "packages/vipe-mojo"
description = "Build the Mojo kernels of vipe_mojo (CPU + GPU kernels for the local GPU)"
inputs = ["packages/vipe-mojo/vipe_mojo/mojo/*.mojo", "packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/vipe-mojo/vipe_mojo/_vipe_mojo.so"]

[feature.metrictrail.tasks.vipe-mojo-tests]
cmd = "sh -c 'pytest -q -m \"integration or not integration\" \"$@\"' _"
depends-on = ["lietorch-mojo-build", "vipe-mojo-build"]
cwd = "packages/vipe-mojo"
description = "Build and test vipe_mojo against the frozen vipe_ext references (CPU always, CUDA when present)"

[feature.metrictrail.tasks.metrictrail-run]
cmd = "python tools/run.py"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build", "vipe-mojo-build"]
cwd = "packages/metrictrail"
description = "Run MetricTrail (ViPE pipeline=metrictrail) on a video, frame directory or VSLAM-LAB sequence and log it to Rerun (needs the GPU); pass --input --benchmark --output --rr-config.save"

[feature.metrictrail.tasks.metrictrail-log-run]
cmd = "python tools/log_run.py"
cwd = "packages/metrictrail"
description = "Log a finished MetricTrail output directory (ours or upstream's) to Rerun with the default blueprint; no GPU"

[feature.metrictrail.tasks.metrictrail-eval]
cmd = "python tools/vslamlab_eval.py"
cwd = "packages/metrictrail"
description = "Score MetricTrail runs (one dir per seed) under the paper protocol and VSLAM-LAB's own evaluation (subprocess, private evo HOME)"

[feature.metrictrail.tasks.metrictrail-catalog-layer]
cmd = "python tools/catalog_layer.py"
cwd = "packages/metrictrail"
description = "Write (and with --catalog-url/--dataset register) the MetricTrail catalog layer of one run on a VSLAM-LAB segment; never overwrites a layer file"

# The Gradio app's example clips: dpvo-app's H.264 MP4s without B-frames (NVDEC decodes them).
[feature.metrictrail.tasks._download-metrictrail-data]
cmd = "hf download pablovela5620/dpvo-example-data --repo-type dataset --include 'movies/*.mp4' --local-dir data/"
cwd = "packages/metrictrail"
outputs = ["packages/metrictrail/data/movies/IMG_0493.mp4"]
description = "Download the example video clips of the MetricTrail app"

[feature.metrictrail.tasks._download-metrictrail-iphone-data]
cmd = "hf download pablovela5620/dpvo-example-data iphone/pool.mp4 --repo-type dataset --local-dir data/"
cwd = "packages/metrictrail"
outputs = ["packages/metrictrail/data/iphone/pool.mp4"]
description = "Download the iPhone example video of the MetricTrail app"

[feature.metrictrail.tasks.metrictrail-app]
cmd = "python tools/gradio_app.py"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build", "vipe-mojo-build", "_download-metrictrail-data", "_download-metrictrail-iphone-data"]
cwd = "packages/metrictrail"
description = "Launch the MetricTrail Gradio app: upload a video, watch the run stream into an embedded Rerun viewer (needs the GPU)"

# metrictrail.capture imports packages/dpvo, which imports lietorch_mojo's Mojo extension; this shadows the dev
# feature's task.
[feature.metrictrail.tasks.tests]
cmd = "pytest -q"
depends-on = ["lietorch-mojo-build"]
cwd = "packages/metrictrail"
description = "Build the lietorch-mojo extension, then run the package unit tests"

# The full-pipeline integration test imports lietorch_mojo's Mojo extension and the dpvo and vipe Mojo kernels; this
# shadows the dev feature's task.
[feature.metrictrail.tasks.tests-integration]
cmd = "sh -c 'pytest -q -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build", "vipe-mojo-build"]
cwd = "packages/metrictrail"
description = "Build the lietorch-mojo extension and the DPVO and ViPE kernels, then run the package integration tests"

