# ═══════════════════════════════════════════════════════════════════════════
# robocap-slam
# ═══════════════════════════════════════════════════════════════════════════
# Explicit platforms: libcublas can never solve on osx-arm64; omitting the list
# would abort every workspace lock write (see AGENTS.md "Platforms & lockfile").
[feature.robocap-slam]
platforms = ["linux-64", "linux-aarch64"]

[feature.robocap-slam.dependencies]
python = "3.12.*"
pyyaml = "*"
cuda-version = "13.*"
libcublas = "*"
libcusolver = "*"
libstdcxx-ng = ">=14.2"
pyarrow = ">=20.0.0,<21"
# CPU torch only satisfies simplecv's module-load import; cuVSLAM brings its
# own cu13 wheel and never executes torch.
