description = "Step 3: register the 42 RRDs into the mamma_iphones catalog (base+props layers, names/properties from gate.json, default blueprint); needs mamma-iphones-serve running"

# ═══════════════════════════════════════════════════════════════════════════
# mvs — multiview stereo depth + live meshing
# ═══════════════════════════════════════════════════════════════════════════
[feature.mvs]
platforms = ["linux-64-cuda13", "linux-aarch64-cuda13"]

[feature.mvs.dependencies]
# The catalog depth layer's millimetre PNGs (packages/depth-png).
depth-png = { path = "packages/depth-png" }
# The live mesh: predicted depth fused into a sparse colour TSDF, marching-cubes mesh (packages/tsdf-rs).
tsdf-rs = { path = "packages/tsdf-rs" }
python = "3.12.*"
einops = ">=0.8,<0.9"
kornia = ">=0.8,<0.9"
timm = ">=1.0,<2"
tyro = "*"
# NVDEC decode of catalog AV1 samples (cuda130 builds exist; torch pin comes from `cuda`).
torchcodec = ">=0.14,<0.15"

[feature.mvs.pypi-dependencies]
mvs = { path = "packages/mvs", editable = true }
trtkit = { path = "packages/trtkit", editable = true }

[feature.mvs.activation.env]
PACKAGE_DIR = "packages/mvs"

[feature.mvs.tasks.mvs-live-mesh]
cmd = "python tools/apps/live_mesh.py"
cwd = "packages/mvs"
depends-on = ["mvs-download-depth-model"]
description = "Fuse the depth model's predictions over catalog segments into a TSDF mesh, logged as it grows"

[feature.mvs.tasks.mvs-download-depth-model]
cmd = "hf download pablovela5620/mvs-depth depth_model_dot.onnx --local-dir data/models"
cwd = "packages/mvs"
description = "Download the ONNX multiview depth model"

[feature.mvs.tasks.mvs-catalog-depth]
cmd = "python tools/demos/catalog_depth.py"
cwd = "packages/mvs"
depends-on = ["mvs-download-depth-model"]
description = "Predict metric depth for catalog segments and log it to Rerun"


# ─── arkitscenes-download (ARKitScenes → layered Rerun recordings) ──────────
# linux-64 only: the video transcode prefers av1_nvenc with a libsvtav1 CPU fallback.
[feature.arkitscenes-download]
platforms = ["linux-64"]

[feature.arkitscenes-download.dependencies]
python = "3.12.*"
# Depth PNG encode/decode (Up filter, Rust): packages/depth-png.
depth-png = { path = "packages/depth-png" }
ffmpeg = ">=8.1"
imagecodecs = ">=2024.9.22"
trimesh = "*"
pillow = "*"
curl = "*"
rich = "*"

[feature.arkitscenes-download.pypi-dependencies]
arkitscenes-download = { path = "packages/arkitscenes-download", editable = true }
tyro = ">=0.9,<1"
modal = ">=1.0"

[feature.arkitscenes-download.activation.env]
PACKAGE_DIR = "packages/arkitscenes-download"
# Modal's decorated-function stubs (ParamSpec) and the container-only boto3
# import are unavoidable false positives; baseline them.
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.arkitscenes-download.tasks.arkitscenes-download-sample]
cmd = "python tools/apps/download.py --download-dir data --num-random 5 --seed 42 --no-include-point-clouds"
cwd = "packages/arkitscenes-download"
description = "Download a 5-sequence ARKitScenes sample (mov + depth + calibration, no point clouds)"

[feature.arkitscenes-download.tasks.arkitscenes-download-ingest]
cmd = "python tools/apps/ingest_batch.py --workers 2"
cwd = "packages/arkitscenes-download"
depends-on = ["arkitscenes-download-sample"]
description = "Ingest every downloaded sequence into layered .rrd files under data/rrd/"

[feature.arkitscenes-download.tasks.arkitscenes-download-ca1m]
cmd = "python tools/apps/ca1m_ingest.py"
cwd = "packages/arkitscenes-download"
description = "Ingest CA-1M laser GT into stackable gt_poses and gt_depth layer RRDs"

[feature.arkitscenes-download.tasks.arkitscenes-download-gt-subdataset]
cmd = "python tools/apps/make_gt_subdataset.py"
cwd = "packages/arkitscenes-download"
description = "Create the GT-clean sub-dataset (laser GT present, bounded interior gaps) on the local catalog"

[feature.arkitscenes-download.tasks.arkitscenes-download-serve]
# Rerun keeps one handle open per registered RRD. One full corpus has
# 5015 segments * 8 layers = 40120 RRDs, so 65536 cannot hold two corpora.
cmd = "bash -c 'ulimit -n 524288 && exec rerun server --port 51235'"
cwd = "packages/arkitscenes-download"
description = "Serve a Rerun catalog for registered ARKitScenes recordings"

[feature.arkitscenes-download.tasks.arkitscenes-download-register]
cmd = "python tools/apps/register_catalog.py --rrd-dir data/rrd"
cwd = "packages/arkitscenes-download"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Register ingested layer .rrds into the catalog on :51235"

[feature.arkitscenes-download.tasks.arkitscenes-download-view]
cmd = "rerun rerun+http://127.0.0.1:51235"
cwd = "packages/arkitscenes-download"
description = "Open the native Rerun viewer on the local catalog"

# ═══════════════════════════════════════════════════════════════════════════
# gauss-surf — GausSurf splat pipeline over ARKitScenes catalog segments
# ═══════════════════════════════════════════════════════════════════════════
# Signals/catalog lane: reads the segment through the 0.38 prerelease
# dataloader, derives frame selection / normals / ultrawide depth, writes
# layer RRDs back. Explicit platforms required — see AGENTS.md.
[feature.gauss-surf]
platforms = ["linux-64", "linux-aarch64"]

[feature.gauss-surf.dependencies]
# arkitscenes_download and the depth PNG writers here use depth_png (packages/depth-png).
depth-png = { path = "packages/depth-png" }
# Pinned to match the pyrefly site-package-path registration (python3.12).
python = "3.12.*"
# Open3D RaycastingScene renders ultrawide depth from the PromptDA TSDF mesh.
open3d = ">=0.19.0,<0.20"
imagecodecs = ">=2024.9.22"
# arkitscenes_download.ingest imports these at package load.
trimesh = "*"
pillow = "*"
av = ">=18"
# simplecv's SegmentNvdecDecoder decodes the segment's AV1 packets on NVDEC.
torchcodec = "*"
# ffmpeg <902 links libjxl 0.11 and dlopen-fails beside the env's 0.12.
ffmpeg = { version = ">=8.1", build-number = ">=902" }
einops = "*"
# gsplat 1.6.0 (upstream v1.6.0 commit c3d59bbb, not on PyPI) prebuilt on the ai-demos channel
# for cuda 13.0 / torch 2.12 / py312, linux-64 and linux-aarch64: no source build at install,
# and `pixi lock` no longer needs torch present (the git pin forced no-build-isolation).
gsplat = "==1.6.0"
# Direct gsplat seed initialization uses sklearn's three-neighbor search.
scikit-learn = "*"
# Direct holdout evaluation computes SSIM through torchmetrics.
torchmetrics = "*"

[feature.gauss-surf.pypi-dependencies]
gauss-surf = { path = "packages/gauss-surf", editable = true }
arkitscenes-download = { path = "packages/arkitscenes-download", editable = true }
monopriors = { path = "packages/monoprior", editable = true }
trtkit = { path = "packages/trtkit", editable = true }
plyfile = ">=1.1,<2"

[feature.gauss-surf.pypi-options.dependency-overrides]
# Resolve monopriors' sam3>=0.1.0 requirement to the repository implementation.
sam3 = { path = "packages/sam3", editable = true }

[feature.gauss-surf.activation.env]
PACKAGE_DIR = "packages/gauss-surf"
PYREFLY_TARGET = "src/gauss_surf/apis src/gauss_surf/train_gsplat src/gauss_surf/catalog.py src/gauss_surf/frame_selection.py src/gauss_surf/gaussurf_geometry.py src/gauss_surf/gaussurf_losses.py src/gauss_surf/gsplat_schedule.py src/gauss_surf/normals_encoding.py src/gauss_surf/render_io.py src/gauss_surf/uw_geometry.py src/gauss_surf/__init__.py tools"
# The pinned gsplat fork accepts extra_signals, but another workspace gsplat
# install wins Pyrefly's global site-package resolution and lacks those kwargs.
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.gauss-surf.tasks.gauss-surf-serve]
cmd = "bash -c 'ulimit -n 524288 && exec rerun server --port 51236'"
cwd = "packages/gauss-surf"
description = "Serve the dedicated gauss-surf development catalog on :51236"

[feature.gauss-surf.tasks.gauss-surf-frame-selection]
cmd = "python tools/apps/frame_selection.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Score and register the frame-selection layer for one ARKitScenes segment"

[feature.gauss-surf.tasks.gauss-surf-moge-normals]
cmd = "python tools/apps/moge_normals.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Infer and register MoGe v2 normals for chosen ARKitScenes wide frames"

[feature.gauss-surf.tasks.gauss-surf-ultrawide-signals]
cmd = "python tools/apps/ultrawide_signals.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Rectify chosen ultrawide frames and register mesh depth plus MoGe normal layers"

[feature.gauss-surf.tasks.gauss-surf-ultrawide-depth-batch]
cmd = "python tools/apps/ultrawide_depth_batch.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Write the depth-only ultrawide_depth layer RRDs for one shard of the corpus"

[feature.gauss-surf.tasks.gauss-surf-register-segment]
cmd = "python tools/apps/register_segment.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Reseed one ARKitScenes segment and the v2 blueprints on the development catalog"

[feature.gauss-surf.tasks.gauss-surf-train-gsplat]
cmd = "python tools/apps/train_gsplat.py"
cwd = "packages/gauss-surf"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Train the direct gsplat recipe and fused-publish all three splat layers"

[tasks.gauss-surf-segment-pipeline]
args = ["video_id", "dataset_name", "timestamp"]
depends-on = [
    { task = "gauss-surf-frame-selection", environment = "gauss-surf", args = ["--video-id", "{{ video_id }}", "--dataset-name", "{{ dataset_name }}"] },
    { task = "gauss-surf-moge-normals", environment = "gauss-surf", args = ["--video-id", "{{ video_id }}", "--dataset-name", "{{ dataset_name }}"] },
    { task = "gauss-surf-ultrawide-signals", environment = "gauss-surf", args = ["--video-id", "{{ video_id }}", "--dataset-name", "{{ dataset_name }}"] },
    { task = "gauss-surf-train-gsplat", environment = "gauss-surf", args = ["--video-id", "{{ video_id }}", "--dataset-name", "{{ dataset_name }}", "--timestamp", "{{ timestamp }}"] },
]
description = "Run signal preparation, two-call gsplat training, and fused in-process publication"

# ════════════════════════════════════════════════════════════════════════════
# pose-app — unified SAM3 + 2D pose Gradio playground
# ════════════════════════════════════════════════════════════════════════════
[feature.pose-app]
