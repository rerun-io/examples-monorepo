[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-download-tandt]
cmd = """
test -d data/tandt || \
(mkdir -p data && \
wget -q --show-progress -O data/tandt_db.zip https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/datasets/input/tandt_db.zip && \
unzip -q data/tandt_db.zip -d data && \
rm data/tandt_db.zip)
"""
cwd = "packages/gsplat-rust-renderer"
outputs = ["packages/gsplat-rust-renderer/data/tandt/"]
description = "Download Tanks & Temples + Deep Blending datasets from INRIA"

# ── Brush training tasks ─────────────────────────────────────────────────
[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-install-brush-mac]
cmd = "test -x data/tools/brush-v0.3.0/brush_app || (mkdir -p data/tools/brush-v0.3.0 && curl -fL https://github.com/ArthurBrussee/brush/releases/download/v0.3.0/brush-app-aarch64-apple-darwin.tar.xz -o data/tools/brush-v0.3.0.tar.xz && echo '65b2631398c839be3c1d4d7160fe2326389dec87830aac0710985e6690a1048c  data/tools/brush-v0.3.0.tar.xz' | shasum -a 256 -c - && tar -xJf data/tools/brush-v0.3.0.tar.xz --strip-components=1 -C data/tools/brush-v0.3.0 && rm data/tools/brush-v0.3.0.tar.xz)"
cwd = "packages/gsplat-rust-renderer"
outputs = ["packages/gsplat-rust-renderer/data/tools/brush-v0.3.0/brush_app"]
description = "Install the checksummed official Brush v0.3.0 Apple Silicon binary project-locally"

[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-build-brush-metrics-mac]
cmd = "test -x data/tools/brush-v0.3.0-metrics/brush_app || (rm -rf data/tools/brush-v0.3.0-metrics-src data/tools/brush-v0.3.0-metrics-target && git clone --depth 1 --branch v0.3.0 https://github.com/ArthurBrussee/brush.git data/tools/brush-v0.3.0-metrics-src && git -C data/tools/brush-v0.3.0-metrics-src rev-parse HEAD | grep -qx 3edecbb2fe79d3e2c87eeab85b15e0b1dd10d486 && git -C data/tools/brush-v0.3.0-metrics-src apply ../../../patches/brush-v0.3.0-cli-loss.patch && CARGO_TARGET_DIR=data/tools/brush-v0.3.0-metrics-target cargo build --release --locked --manifest-path data/tools/brush-v0.3.0-metrics-src/Cargo.toml --package brush-app --bin brush_app && mkdir -p data/tools/brush-v0.3.0-metrics && cp data/tools/brush-v0.3.0-metrics-target/release/brush_app data/tools/brush-v0.3.0-metrics/brush_app && rm -rf data/tools/brush-v0.3.0-metrics-src data/tools/brush-v0.3.0-metrics-target)"
cwd = "packages/gsplat-rust-renderer"
outputs = ["packages/gsplat-rust-renderer/data/tools/brush-v0.3.0-metrics/brush_app"]
description = "Build pinned Brush v0.3.0 locally with pure-CLI loss output (macOS Metal; embedded Rerun remains disabled)"

[feature.gsplat-rust-renderer.tasks.gsplat-rust-renderer-brush-train-lego-mac]
cmd = "data/tools/brush-v0.3.0/brush_app data/nerfbaselines/data/lego --total-steps 7000 --export-every 50 --export-path data/brush-runs/lego"
depends-on = ["_gsplat-rust-renderer-install-brush-mac", "_gsplat-rust-renderer-download-nerfbaselines-data-lego"]
cwd = "packages/gsplat-rust-renderer"
description = "Train Lego with Brush as a pure trainer and export PLY every 50 iterations (macOS Metal)"

[feature.gsplat-rust-renderer.tasks.gsplat-rust-renderer-brush-replay-lego]
cmd = "zsh -c 'rm -rf data/brush-runs/lego && mkdir -p data/brush-runs/lego || exit 1; (RUST_LOG=brush_cli=info,brush_process::train_stream=info data/tools/brush-v0.3.0-metrics/brush_app data/nerfbaselines/data/lego --total-steps 7000 --export-every 50 --export-path data/brush-runs/lego --eval-every 500 --eval-save-to-disk > data/brush-runs/lego/brush.log 2>&1; trainer_status=$?; echo $trainer_status > data/brush-runs/lego/trainer.exit; exit $trainer_status) & trainer_pid=$!; trap \"kill $trainer_pid 2>/dev/null || true\" EXIT; python tools/visualize_brush_training.py --rr-config.application-id brush-training-replay --rr-config.save data/brush-runs/lego/training.rrd --rr-config.headless --scene-dir data/nerfbaselines/data/lego --export-dir data/brush-runs/lego --brush-log data/brush-runs/lego/brush.log --trainer-done-file data/brush-runs/lego/trainer.exit --total-iters 7000 --step-stride 50 --snapshot-stride 20 --sh-mode final --spin-speed 0.2 --eval-views-logged 4 --delete-processed-plys --delete-processed-eval-dirs; replay_status=$?; if test $replay_status -ne 0; then kill $trainer_pid 2>/dev/null || true; wait $trainer_pid 2>/dev/null || true; exit $replay_status; fi; wait $trainer_pid; trainer_status=$?; test $trainer_status -eq 0 && grep -qx 0 data/brush-runs/lego/trainer.exit'"
depends-on = ["_gsplat-rust-renderer-build-brush-metrics-mac", "_gsplat-rust-renderer-download-nerfbaselines-data-lego"]
cwd = "packages/gsplat-rust-renderer"
description = "Train Lego for 7k steps while Rerun 0.34.1 replays Brush eval pairs, metrics, cameras, and eight retained snapshots"

[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-build-viewer]
cmd = "cargo build --release --bin gsplat-rust-renderer"
cwd = "packages/gsplat-rust-renderer"
outputs = ["packages/gsplat-rust-renderer/target/release/gsplat-rust-renderer"]
