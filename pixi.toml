# zipdepth — training / eval / export for ZipDepth; the network is vendored in
# monopriors (monopriors.third_party.zipdepth). Explicit platforms required —
# see AGENTS.md "Platforms & lockfile".
# ═══════════════════════════════════════════════════════════════════════════
[feature.zipdepth]
platforms = ["linux-64", "linux-aarch64"]

[feature.zipdepth.dependencies]
python = "3.12.*"
tyro = ">=0.9.1,<0.10"
matplotlib = ">=3.8.3"
pyyaml = ">=6.0"
tensorboard = ">=2.16.0"
# dataset.py decodes JPEGs with PyTurboJPEG (pypi) on top of the conda libjpeg-turbo
libjpeg-turbo = ">=3.0.0,<4"
# apis/smoke_data.py writes its uint16 inverse-depth PNGs with depth_png (packages/depth-png).
depth-png = { path = "packages/depth-png" }

[feature.zipdepth.pypi-dependencies]
zipdepth = { path = "packages/zipdepth", editable = true }
monopriors = { path = "packages/monoprior", editable = true }
trtkit = { path = "packages/trtkit", editable = true }
# monopriors' metadata requires sam3; resolve it to the workspace package like the other monopriors consumers
sam3 = { path = "packages/sam3", editable = true }
# albucore -> simsimd has no conda-forge linux-aarch64 build
albumentations = ">=2.0.0"
pyturbojpeg = ">=2.0.0,<3"

[feature.zipdepth.activation.env]
PACKAGE_DIR = "packages/zipdepth"
# authored code only; the unmodified upstream tree (data/loss/training/evaluation/upstream_cli) is a vendor boundary
PYREFLY_TARGET = "zipdepth/apis zipdepth/catalog zipdepth/__init__.py tests tools"

[feature.zipdepth.tasks.zipdepth-infer-rerun]
cmd = "python tools/infer_rerun.py"
cwd = "packages/zipdepth"
description = "ZipDepth single-image inference visualized in Rerun (2D + 3D); --checkpoint for a trained .pth"

[feature.zipdepth.tasks.zipdepth-train-smoke]
cmd = "python tools/train_smoke.py"
cwd = "packages/zipdepth"
description = "Smoke: self-distilled example data -> train -> resume -> torchrun -> checkpoints load through monopriors ZipDepthPredictor"

[feature.zipdepth.tasks.zipdepth-export-prompted-trt]
cmd = "python tools/export_prompted_trt.py"
cwd = "packages/zipdepth"
description = "Export, build, parity-check, and benchmark static-batch fp16 ZipDepth-PromptDA ONNX/TensorRT"

# Catalog training lane: chosen-frame PromptDA pseudo-labels from the local Rerun catalog.
# linux-64 only: NVDEC decode via torchcodec, mirroring prompt-da-stream.
[feature.zipdepth-catalog]
platforms = ["linux-64"]

[feature.zipdepth-catalog.dependencies]
# arkitscenes_download.ingest imports these at package load.
imagecodecs = ">=2024.9.22"
depth-png = { path = "packages/depth-png" }
trimesh = "*"
pillow = "*"
av = ">=18"
# simplecv's open_segment_decoder decodes the segment's AV1 packets on NVDEC.
torchcodec = "*"
# ffmpeg <902 links libjxl 0.11 and dlopen-fails beside the env's 0.12.
ffmpeg = { version = ">=8.1", build-number = ">=902" }
# torch.cuda.utilization() backend for the IO-vs-GPU training instrumentation.
nvidia-ml-py = "*"

[feature.zipdepth-catalog.pypi-dependencies]
arkitscenes-download = { path = "packages/arkitscenes-download", editable = true }

[feature.zipdepth-catalog.tasks.zipdepth-catalog-throughput]
cmd = "python tools/catalog_throughput.py"
cwd = "packages/zipdepth"
description = "Measure catalog->batch throughput (frames/s, per-stage ms) over warm promptda segments"

[feature.zipdepth-catalog.tasks.zipdepth-train-catalog]
cmd = "python tools/train_catalog.py"
cwd = "packages/zipdepth"
description = "Fine-tune ZipDepth on chosen-frame PromptDA pseudo-labels streamed from the local Rerun catalog"

[feature.zipdepth-catalog.tasks.zipdepth-catalog-train-smoke]
cmd = "python tools/train_catalog_smoke.py"
cwd = "packages/zipdepth"
description = "Smoke: 2 catalog segments -> short fine-tune -> resume -> torchrun -> checkpoint loads through ZipDepthPredictor"

[feature.zipdepth-catalog.tasks.zipdepth-eval-catalog]
cmd = "python tools/eval_catalog.py"
cwd = "packages/zipdepth"
description = "Unaligned metric AbsRel/delta1/MAE vs held-out PromptDA labels, with separately named aligned diagnostics"

[feature.zipdepth-catalog.tasks.zipdepth-infer-segment-rerun]
