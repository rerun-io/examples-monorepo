# ═══════════════════════════════════════════════════════════════════════════
# robocap-slam
# ═══════════════════════════════════════════════════════════════════════════
# Explicit platforms: CUDA-only deps (libcublas) can never solve on osx-arm64;
# without this list the feature inherits osx-arm64 from `common` (pixi >= 0.71)
# and every lock write in the workspace aborts on the unsolvable demand.
[feature.robocap-slam]
platforms = ["linux-64", "linux-aarch64"]

[feature.robocap-slam.dependencies]
python = "3.12.*"
pyyaml = "*"
cuda-version = "13.*"
libcublas = "*"
libcusolver = "*"
libstdcxx-ng = ">=14.2"
pyarrow = ">=20.0.0,<21"
# robocap tracks with cuVSLAM (its own cu13 wheel) and never executes torch, but the
# shared `simplecv` lib (from [feature.common]) imports torch at module load in
# simplecv/video_io.py. robocap uses the cv2-based VideoReader, so CPU torch is enough
# to satisfy the import — robocap stays on CPU torch because the shared `cuda`
# feature (now cuda 13.0) is linux-64 only and robocap also targets aarch64.
pytorch-cpu = ">=2.8.0"

[feature.robocap-slam.pypi-dependencies]
robocap-slam = { path = "packages/robocap-slam", editable = true }
tyro = ">=0.9,<1"

[feature.robocap-slam.target.linux-64.pypi-dependencies]
cuvslam = { url = "https://github.com/nvidia-isaac/cuVSLAM/releases/download/v15.0.0/cuvslam-15.0.0%2Bcu13-cp312-abi3-manylinux_2_39_x86_64.whl" }

[feature.robocap-slam.target.linux-aarch64.pypi-dependencies]
cuvslam = { url = "https://github.com/nvidia-isaac/cuVSLAM/releases/download/v15.0.0/cuvslam-15.0.0%2Bcu13-cp312-abi3-manylinux_2_39_aarch64.whl" }

[feature.robocap-slam.activation.env]
PACKAGE_DIR = "packages/robocap-slam"
LD_LIBRARY_PATH = "${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH}"

[feature.robocap-slam.tasks.robocap-slam-download-example]
cmd = """test -d data/robocap/f408193e6447b3b0_session_14 || hf download pablovela5620/robocap-example --repo-type dataset --local-dir data/robocap"""
cwd = "packages/robocap-slam"
outputs = ["packages/robocap-slam/data/robocap/f408193e6447b3b0_session_14"]
description = "Download example Robocap dataset from HuggingFace"

[feature.robocap-slam.tasks.robocap-slam-track]
cmd = "python tools/track_odometry.py"
cwd = "packages/robocap-slam"
depends-on = ["robocap-slam-download-example"]
description = "Run multicamera visual odometry on Robocap data"

[feature.robocap-slam.tasks.robocap-slam-track-slam]
cmd = "python tools/track_slam.py"
cwd = "packages/robocap-slam"
depends-on = ["robocap-slam-download-example"]
description = "Run multicamera visual SLAM on Robocap data"

[feature.robocap-slam.tasks.robocap-slam-track-candidate]
cmd = "python tools/track_odometry.py --rr-config.save /tmp/robocap_cuvslam_15_candidate.rrd --rr-config.headless --no-auto-orient --max-frames 30 --no-log-videos"
cwd = "packages/robocap-slam"
depends-on = ["robocap-slam-download-example"]
description = "Run a bounded Robocap odometry smoke and save the migrated cuVSLAM candidate RRD"

[feature.robocap-slam.tasks.robocap-slam-compare-reference]
cmd = "python tools/compare_rrd_reference.py --reference-rrd /tmp/robocap_cuvslam_0_2_0_baseline.rrd --candidate-rrd /tmp/robocap_cuvslam_15_candidate.rrd --index video_time --max-rows 30 --rtol 0.01 --atol 0.25"
cwd = "packages/robocap-slam"
description = "Compare migrated Robocap pose output against the saved cuVSLAM 0.2.0 baseline"

# ═══════════════════════════════════════════════════════════════════════════
# pysfm
# ═══════════════════════════════════════════════════════════════════════════
[feature.pysfm]
platforms = ["linux-64"]

[feature.pysfm.dependencies]
python = "3.12.*"
tyro = ">=0.9.1,<0.10"
# cuda13: pinned to the conda CPU pycolmap build (cpu_py312) — see THE ISSUE
# and SOLUTIONS below.
#
# THE ISSUE — there is no CUDA-13 pycolmap on conda-forge yet. pycolmap's
# `cuda*` builds pin `cuda-version >=12.9,<13` + `cuda-cudart <13` (for GPU SIFT
# + GPU faiss), a hard conflict with this monorepo's cuda13 stack, so the
# resolver can't use them. Two non-GPU routes were tried:
#   - PyPI wheel `pycolmap==4.0.2` (cp312 manylinux): solves + imports, but
#     CORE-DUMPS in feature extraction (its bundled native libs clash with the
#     conda env's libs). Rejected.
#   - conda `cpu_*` build (this pin): drops every cuda pin and runs feature
#     extraction on CPU. It still wants `libfaiss * *_cuda` (>=1.9,<2), satisfied
#     by the ai-demos `libfaiss 1.10.0 cuda130*_cuda` build; Qt5 (qt-main, from
#     colmap) and Qt6 (qt6-main, from the floated opencv) coexist, so no headless
#     opencv hack is needed. It links against the conda env's own libs, so it
#     does NOT core-dump. All 7 pysfm tests pass. The only cost is GPU SIFT —
#     feature extraction runs on CPU (slower, but functionally complete).
#
# SOLUTIONS to get the GPU build back (none needed for correctness — CPU works):
#   1. Wait for the conda-forge cuda130 migration. It's a dependency cascade:
#      libfaiss + ceres-solver must publish cuda130 builds (both still cuda129 on
#      conda-forge today) -> colmap-feedstock cuda130 -> pycolmap-feedstock
#      cuda130. The global `cuda130.yaml` migrator is live (gated on cuda129);
#      both colmap + pycolmap feedstocks are maintained by Tobias-Fischer.
#      Upstream COLMAP 4.0.4 is already cuda13-ready (arch=all; Blackwell
#      PatchMatch fix PR #4213), so this is a feedstock-rebuild job, not a code
#      change. When that lands, switch this back to `build = "cuda*"`.
#   2. Build colmap + pycolmap cuda13 in the ai-demos channel ourselves (as we
#      did for lietorch + libfaiss cuda130). Works, but colmap is a heavy C++
#      build with a large GPU dep tree — only worth it if GPU SIFT is needed.
pycolmap = { version = "4.0.*", build = "cpu*" }

[feature.pysfm.pypi-dependencies]
pysfm = { path = "packages/pysfm", editable = true }

[feature.pysfm.activation.env]
PACKAGE_DIR = "packages/pysfm"

# ── Download tasks ───────────────────────────────────────────────────────
