[workspace]
authors = ["pablo vela <pablovela5620@gmail.com>"]
channels = ["https://prefix.dev/ai-demos", "https://prefix.dev/conda-forge"]
name = "examples-monorepo"
# Keep Pixi's conda/PyPI name mapping explicit and local so dependency
# overrides remain deterministic when PyPI-only CUDA wheels are selected.
conda-pypi-map = { conda-forge = "conda-pypi-map.json" }
# Keep both workspace platforms so target-specific selectors below remain valid.
# The shared cuda feature spans both; heavier x86-only packages pin their own
# feature to linux-64 (so those envs stay linux-64).
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"
# Dev machines run pixi 0.70.x. (0.71+ works as a tool, but adopting it needs a
# rich-platforms migration — deferred — so don't expect a clean relock on 0.71 yet.)
requires-pixi = ">=0.70"
preview = ["pixi-build"]

# ─── pypi-options (workspace-level) ─────────────────────────────────────────
[pypi-options]
no-build-isolation = ["moge", "gsplat", "dpvo", "sam2"]

[pypi-options.dependency-overrides]
iopath = ">=0.1.10"
fsspec = ">=2025.3,<=2026.2.0"

# ─── common feature (shared loose base deps) ───────────────────────────────
# osx-arm64 is added beyond the workspace platforms so packages that target
# Apple Silicon (e.g. live-rerun) can compose `common`. This is additive: every
# existing `common` env also pulls a linux-only feature (cuda / per-package),
# so the environment platform intersection keeps them linux-only — only envs
# whose every feature lists osx-arm64 actually solve for macOS.
[feature.common]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.common.dependencies]
av = "*"
py-opencv = "*"
numpy = "*"
pyserde = ">=0.31.2,<0.32"
jaxtyping = "<0.3"
typing_extensions = ">=4.1.0,<4.13.0"
hf-transfer = "*"
scipy = "*"
huggingface_hub = "*"
tqdm = "*"
transformers = ">=5.0.0"
jupyterlab = "*"

[feature.common.target.linux-aarch64.dependencies]
xorg-libx11 = "*"
xorg-xorgproto = "*"

# simplecv (pulled in editable below) imports torch unconditionally at module
# load in simplecv/video_io.py. On Linux torch is supplied by the co-composed
# cuda/cpu feature; a common-only macOS env has no other provider. Scope CPU
# torch to osx-arm64 so Linux envs (which use pytorch-gpu) are untouched.
[feature.common.target.osx-arm64.dependencies]
pytorch-cpu = "*"
# rerun-sdk's dataloader extra requires torchvision; PyPI has no torchvision
# wheel matching the conda-pinned torch on macos-13, so conda provides it.
torchvision = "*"

[feature.common.pypi-dependencies]
# Keep catalog queries ambient without pulling the PyTorch dataloader stack
# into common environments that otherwise have no torch dependency.
rerun-sdk = { version = "==0.34.1", extras = ["datafusion"] }
gradio = "==6.13.0"
gradio-rerun = "==0.34.1"
simplecv = { path = "packages/simplecv", editable = true }

# ─── catalog common feature (Rerun catalog prerelease lane) ────────────────
[feature.catalog-common.dependencies]
av = "*"
py-opencv = "*"
numpy = "*"
pyserde = ">=0.31.2,<0.32"
jaxtyping = "<0.3"
typing_extensions = ">=4.1.0,<4.13.0"
hf-transfer = "*"
scipy = "*"
huggingface_hub = "*"
tqdm = "*"
transformers = ">=5.0.0"

[feature.catalog-common.target.linux-aarch64.dependencies]
xorg-libx11 = "*"
xorg-xorgproto = "*"

[feature.catalog-common.pypi-dependencies]
simplecv = { path = "packages/simplecv", editable = true }

# Catalog lane: `common`'s rerun-sdk plus the datafusion/dataloader extras. To test an
# unreleased build, point find-links at build.rerun.io — see the root AGENTS.md
# "Testing Rerun builds".
[feature.rerun-prerelease.pypi-dependencies]
rerun-sdk = { version = "==0.34.1", extras = [
    "datafusion",
    "dataloader",
] }

[feature.rerun-prerelease.pypi-options]
index-url = "https://pypi.org/simple"
prerelease-mode = "allow"


# ─── CUDA 13.0 feature (shared across all GPU envs) ─────────────────────────
# Both linux-64 and linux-aarch64 (DGX Spark / GB10): conda-forge now ships the
# CUDA 13 toolchain + pytorch-gpu for aarch64. An env only actually gains the
# aarch64 platform if its other features also allow it — features that don't pin
# to linux-64 (e.g. wilor-nano, egoexo-forge) inherit aarch64, while the heavy
# x86-only packages (dpvo, mast3r-slam, sam2, moge, …) pin their feature to
# linux-64 and stay there.
[feature.cuda]
platforms = ["linux-64", "linux-aarch64"]

[feature.cuda.system-requirements]
cuda = "13.0"
# CUDA-13 aarch64 index wheels ship as manylinux_2_3x: onnxruntime-gpu is _2_34,
# the TensorRT aarch64 wheels (tensorrt-cu13-libs/bindings) are _2_35. Declare
# glibc 2.35 so both resolve (the Spark runs 2.39). pixi system-requirements can't
# be target-scoped, so this applies to both platforms — but it only *loosens*
# package eligibility (every CUDA-13 host has glibc >= 2.35), so the existing
# linux-64 solutions stay valid and are not re-solved.
libc = { family = "glibc", version = "2.35" }

[feature.cuda.dependencies]
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "13.0.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"
# CUDA Libraries
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
# PyTorch — forces the cuda130/2.12.1 build (explicit beats relying on cuda-version alone)
pytorch-gpu = ">=2.12,<2.13"
torchvision = "*"

# onnxruntime-gpu — same package and SAME version (1.24.0) on both platforms, but
# the source differs, so it is split across two target sections (pixi can't vary
# `index` per platform in one):
#  - linux-64 (x86): Microsoft's ort-cuda-13 feed, pinned to the 1.24.0 release
#    (the feed carries it alongside nightlies). Pinned — not a floating `>=…,<2`
#    floor — so x86 stays in lockstep with aarch64 instead of drifting to 1.27-dev.
#  - linux-aarch64 (DGX Spark / GB10, CUDA 13.0 driver): the Jetson AI Lab
#    sbsa/cu130 wheel — native sm_121 SASS, zero PTX (cuobjdump-verified), so it
#    loads directly on the 13.0 driver. The nightly feed's aarch64 wheels are
#    CUDA-13.1 (PTX ISA 9.1 -> cudaErrorUnsupportedPtxVersion); conda-forge's
#    *_cuda130 has no sm_121 SASS. cp312-only, ORT 1.24.0, sha256 pinned in the
#    lock. Source: NVIDIA Jetson DevRel infra (recipe in dusty-nv/jetson-containers).
# Both live here in the shared cuda feature so every cuda env gets the right wheel
# per platform automatically — no per-feature copy to keep in sync.
[feature.cuda.target.linux-64.pypi-dependencies]
onnxruntime-gpu = { version = "==1.24.0", index = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ort-cuda-13-nightly/pypi/simple/" }

[feature.cuda.target.linux-aarch64.pypi-dependencies]
onnxruntime-gpu = { version = "==1.24.0", index = "https://pypi.jetson-ai-lab.io/sbsa/cu130/+simple/" }

# TensorRT runtime — centralized here so every cuda env shares ONE source (no per-package
# copies to keep in sync). tensorrt-cu13 ==10.13.3.9 from pypi.nvidia.com publishes wheels
# for both linux-64 (manylinux_2_28) and linux-aarch64 (manylinux_2_35), cp310–cp313, so a
# single UNSCOPED entry resolves on every cuda env (incl. the py3.11 ones, dpvo/mast3r-slam).
# tensorrt-cu13-libs has stale metadata requiring `nvidia-cuda-runtime-cu13` (NVIDIA
# deprecated it for cu13 in favor of unsuffixed `nvidia-cuda-runtime`); conda provides the
# real CUDA 13 runtime, so satisfy it with NVIDIA's empty 0.0.0a0 placeholder (no-op).
[feature.cuda.pypi-dependencies]
tensorrt-cu13 = { version = "==10.13.3.9", index = "https://pypi.nvidia.com" }
nvidia-cuda-runtime-cu13 = "==0.0.0a0"
cuda-python = "*"

# GPU runtime libs on LD_LIBRARY_PATH for every cuda env: $CONDA_PREFIX/lib first
# (cuDNN/cuBLAS/cudart from conda — needed by ORT's CUDA & TRT providers), then the pip
# TensorRT wheels' libnvinfer under site-packages/tensorrt_libs. Both py3.11 and py3.12
# site-packages dirs are listed because cuda spans both python versions (e.g. dpvo and
# mast3r-slam are 3.11); the loader silently skips whichever path doesn't exist. Setting
# this key replaces pixi's default, so $CONDA_PREFIX/lib MUST be listed explicitly or
# cuDNN won't resolve.
[feature.cuda.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$CONDA_PREFIX/lib/python3.12/site-packages/tensorrt_libs:$CONDA_PREFIX/lib/python3.11/site-packages/tensorrt_libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

# ─── ide feature (standalone dev env for Zed/IDE tooling) ────────────────────
# Explicit platforms: a feature that omits `platforms` defaults to every
# platform ANY feature references (pixi >= 0.71), so composing with `common`
# would demand an osx-arm64 solve. See AGENTS.md "Platforms & lockfile".
[feature.ide]
platforms = ["linux-64", "linux-aarch64"]

[feature.ide.dependencies]
python = "3.12.*"

# ─── dev feature (shared across all *-dev envs) ─────────────────────────────
# osx-arm64 added so `<pkg>-dev` envs that target Apple Silicon get the dev
# tooling there too. Additive/safe: existing *-dev envs also carry a linux-only
# feature, so the intersection keeps them linux-only.
[feature.dev]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.dev.dependencies]
ruff = "*"
pytest = ">=8.0.0,<9"
beartype = ">=0.22.9"
pyrefly = ">=1.1.0"
hypothesis = "*"
vulture = "*"

[feature.dev.pypi-dependencies]
types-tqdm = "*"

[feature.dev.activation.env]
PIXI_DEV_MODE = "1"
PYREFLY_TARGET = "."
PYREFLY_EXTRA_ARGS = ""

[feature.dev.tasks.lint]
cmd = "cd $PACKAGE_DIR && ruff check ."
description = "Lint the package"

[feature.dev.tasks.typecheck]
cmd = "cd $PACKAGE_DIR && pyrefly check -c ../../pyrefly.toml $PYREFLY_TARGET $PYREFLY_EXTRA_ARGS"
description = "Typecheck the package"

[feature.dev.tasks.deadcode]
cmd = "cd $PACKAGE_DIR && vulture --config pyproject.toml"
description = "Find dead code in the package"

[feature.dev.tasks.tests]
cmd = "cd $PACKAGE_DIR && pytest -q"
description = "Run package tests"

# ═══════════════════════════════════════════════════════════════════════════
# simplecv
# ═══════════════════════════════════════════════════════════════════════════
[feature.simplecv]
platforms = ["linux-64"]

[feature.simplecv.dependencies]
python = "3.12.*"
einops = ">=0.8.0,<0.9"
icecream = ">=2.1.3,<3"
pandas = ">=2.3.3,<2.4"
tyro = ">=0.9.1,<0.10"
open3d = ">=0.19.0,<0.20"
natsort = ">=8.4.0,<9"
libjpeg-turbo = "*"
requests = "*"
torchcodec = "*"
hdf5 = "*"
h5py = ">=3.12.1,<4"
dill = ">=0.3.8,<0.4.1"
datasets = ">=4.0.0"

[feature.simplecv.pypi-dependencies]
jax = ">=0.6.0,<0.7"
jaxopt = ">=0.8.5,<0.9"
lovely-jax = "*"
smplx = ">=0.1.28"
rtmlib = { git = "https://github.com/pablovela5620/rtmlib.git", rev = "98bca2193c39b349034b280803b54c9ee58f7c68" }
wilor-nano = { path = "packages/wilor-nano", editable = true }
timm = "<1.0"
vrs = ">=1.1.0"
PyTurboJPEG = ">=1.7.0"

[feature.simplecv.activation.env]
PACKAGE_DIR = "packages/simplecv"
PYREFLY_TARGET = "simplecv"
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.simplecv.tasks.simplecv-view-polycam-data]
cmd = "python tools/view_polycam.py --polycam-zip-path data/example-room-scan-poly.zip"
depends-on = ["_download-simplecv-example-polycam-data"]
cwd = "packages/simplecv"
description = "View example Polycam data"

[feature.simplecv.tasks.simplecv-view-exoego-data]
cmd = "python tools/view_exoego.py"
depends-on = ["_download-simplecv-hocap-sample"]
cwd = "packages/simplecv"
description = "View example HoCap exo/ego data"

[feature.simplecv.tasks.simplecv-view-torchcodec-multiview]
cmd = "python tools/view_torchcodec_multiview.py"
cwd = "packages/simplecv"
description = "View videos with TorchCodec CUDA multiview decoding"

[feature.simplecv.tasks.simplecv-download-hot3d]
cmd = "python tools/download_hot3d.py"
cwd = "packages/simplecv"
description = "Download HOT3D Aria sequences from CDN URLs"

[feature.simplecv.tasks.simplecv-preprocess-hot3d]
cmd = "python tools/preprocess_hot3d.py"
cwd = "packages/simplecv"
description = "Convert HOT3D VRS files to AV1 MP4 for SimpleCV"

[feature.simplecv.tasks.simplecv-download-aria-gen2-pilot]
cmd = "python tools/download_aria_gen2_pilot.py"
cwd = "packages/simplecv"
description = "Download Aria Gen2 Pilot sequences from CDN URLs"

[feature.simplecv.tasks.simplecv-preprocess-aria-gen2-pilot]
cmd = "python tools/preprocess_aria_gen2_pilot.py"
cwd = "packages/simplecv"
description = "Convert Aria Gen2 Pilot VRS files to AV1 MP4 for SimpleCV"

[feature.simplecv.tasks.simplecv-preprocess-epfl-smart-kitchen]
cmd = "python tools/preprocess_epfl_smart_kitchen.py"
cwd = "packages/simplecv"
description = "Build an AV1-transcoded EPFL-Smart-Kitchen mirror for SimpleCV"

[feature.simplecv.tasks.simplecv-download-mamma]
cmd = "python tools/download_mamma.py"
cwd = "packages/simplecv"
description = "Download one MAMMA sequence per subset (register at mamma.is.tue.mpg.de; set MAMMA_USERNAME/MAMMA_PASSWORD)"

[feature.simplecv.tasks.simplecv-preprocess-mamma]
cmd = "python tools/preprocess_mamma.py"
cwd = "packages/simplecv"
description = "Re-encode downloaded MAMMA yuv444 videos to AV1 yuv420 (videos_av1 mirror)"

[feature.simplecv.tasks.simplecv-catalog-serve]
# Tier 1: just the `rerun server` CLI (an empty in-memory catalog), like hiw-500's serve.
# The high `ulimit -n` is needed because the long-lived server holds one open file handle
# per registered recording (the full 6332-file catalog otherwise hits "Too many open files").
cmd = "bash -c 'ulimit -n 524288 && rerun server --port 9988'"
description = "Serve an empty ExoEgo Forge catalog on :9988 (2-tier; leave running)"

[feature.simplecv.tasks.simplecv-catalog-register]
# Tier 2: register the v1 root into the running catalog. v1 uses the flat
# /world/{exo,ego}/<name> layout, so its default blueprint must too (--layout flat).
cmd = "python tools/catalog_register.py --rrd-root /mnt/8tb/data/exoego-forge-catalog --layout flat"
cwd = "packages/simplecv"
description = "Register the v1 (flat) root into the running catalog"

[feature.simplecv.tasks.simplecv-catalog-register-rig]
# The `-rig` suffix is mandatory: v1 and rig RRDs share recording_ids and would collide under
# the same entry name. Use `--suffix=-rig` (equals form): a value starting with `-` is
# otherwise parsed as another flag. The rig root keeps the default rig layout.
cmd = "python tools/catalog_register.py --rrd-root /mnt/8tb/data/exoego-forge-catalog-rig --suffix=-rig"
cwd = "packages/simplecv"
description = "Register the rig (exoego:v2) root as -rig entries into the running catalog"

[feature.simplecv.tasks._download-simplecv-example-polycam-data]
cmd = "test -e data/example-room-scan-poly.zip || hf download pablovela5620/polycam-example-data example-room-scan-poly.zip --repo-type dataset --local-dir data/"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/example-room-scan-poly.zip"]
description = "Download an example Polycam dataset from Hugging Face"

[feature.simplecv.tasks._download-simplecv-example-easymocap-data]
cmd = "test -e data/412-hand.zip || hf download pablovela5620/easymocap-example-data 412-hand.zip --repo-type dataset --local-dir data/"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/412-hand.zip"]
description = "Download an example EasyMocap dataset from Hugging Face"

[feature.simplecv.tasks._download-simplecv-hocap-sample]
cmd = "test -e data/hocap/sample.zip && test -e data/hocap/sample || (mkdir -p data/hocap/ && hf download pablovela5620/hocap-sample sample.zip --repo-type dataset --local-dir data/hocap/ && python -m zipfile -e data/hocap/sample.zip data/hocap/)"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/hocap/sample.zip", "packages/simplecv/data/hocap/sample"]
description = "Download and extract an example HoCap dataset from Hugging Face"

[feature.simplecv.tasks._download-simplecv-epfl-smart-kitchen-sample]
cmd = "test -e data/epfl-smart-kitchen/sample.zip && test -e data/epfl-smart-kitchen/sample || (mkdir -p data/epfl-smart-kitchen/ && hf download pablovela5620/epfl-smart-kitchen-sample sample.zip --repo-type dataset --local-dir data/epfl-smart-kitchen/ && python -m zipfile -e data/epfl-smart-kitchen/sample.zip data/epfl-smart-kitchen/)"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/epfl-smart-kitchen/sample.zip", "packages/simplecv/data/epfl-smart-kitchen/sample"]
description = "Download and extract an example EPFL-Smart-Kitchen dataset from Hugging Face"

[feature.simplecv.tasks._download-simplecv-assembly101-sample]
cmd = "test -e data/assembly101-sample || hf download pablovela5620/Assembly101-Sample --repo-type dataset --include 'assembly101-sample/**' --local-dir data/"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/assembly101-sample"]
description = "Download an example Assembly101 dataset from Hugging Face"

[feature.simplecv.tasks._download-simplecv-assembly101-720-sample]
cmd = "test -e data/assembly101-720-sample || hf download pablovela5620/Assembly101-Sample --repo-type dataset --include 'assembly101-720-sample/**' --local-dir data/"
cwd = "packages/simplecv"
outputs = ["packages/simplecv/data/assembly101-720-sample"]
description = "Download an example Assembly101 720p dataset from Hugging Face"

# ═══════════════════════════════════════════════════════════════════════════
# monoprior
# ═══════════════════════════════════════════════════════════════════════════
[feature.monoprior]
platforms = ["linux-64"]

[feature.monoprior.dependencies]
python = "3.12.*"
icecream = ">=2.1.3,<2.2"
einops = ">=0.8.0,<0.9"
matplotlib = ">=3.8.3,<3.9"
wandb = ">=0.19.10,<0.20"
pandas = ">=2.3.3,<2.4"
jupyterlab = ">=4.2.0,<4.3"
tyro = ">=0.9.1,<0.10"
open3d = ">=0.19.0,<0.20"
easydict = ">=1.13,<2"
imageio = ">=2.37.0,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
natsort = ">=8.4.0,<9"

[feature.monoprior.pypi-dependencies]
monopriors = { path = "packages/monoprior", editable = true }
sam3 = { path = "packages/sam3", editable = true }
vggt = { git = "https://github.com/pablovela5620/vggt.git", rev = "5ed6ec88a951f27959f73bc72eb4b6dc7a028b0c" }
moge = { git = "https://github.com/microsoft/MoGe.git" }

[feature.monoprior.activation.env]
PACKAGE_DIR = "packages/monoprior"
PYREFLY_TARGET = "monopriors/apis monopriors/data monopriors/gradio_ui monopriors/models monopriors/dc_utils.py monopriors/depth_utils.py monopriors/rr_logging_utils.py monopriors/scale_utils.py monopriors/__init__.py"

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.monoprior.tasks._monoprior-download-single-image]
cmd = "test -d data/examples/single-image || hf download pablovela5620/monoprior-example --include 'single-image/*' --repo-type dataset --local-dir data/examples/"
cwd = "packages/monoprior"

[feature.monoprior.tasks._monoprior-download-multiview]
cmd = "test -f data/examples/multiview/car_landscape_12/IMG_2944.jpg || hf download pablovela5620/monoprior-example --include 'multiview/*' --repo-type dataset --local-dir data/examples/"
cwd = "packages/monoprior"

[feature.monoprior.tasks._monoprior-download-g3t-examples]
cmd = "test -f data/examples/multiview/bench/005.png && test -f data/examples/multiview/stairs/004.png && test -f data/examples/multiview/tree/006.png || (mkdir -p data/examples/multiview && curl -fsSL --retry 3 https://codeload.github.com/g3t-paper/g3t/tar.gz/193ce19574b73f0778a475ee54aadeb848e86b88 -o data/examples/g3t-examples.tar.gz && tar -xzf data/examples/g3t-examples.tar.gz --strip-components=3 -C data/examples/multiview g3t-193ce19574b73f0778a475ee54aadeb848e86b88/examples/g3t && rm -f data/examples/g3t-examples.tar.gz)"
cwd = "packages/monoprior"

[feature.monoprior.tasks.monoprior-download-multiview-examples]
depends-on = ["_monoprior-download-multiview", "_monoprior-download-g3t-examples"]
description = "Download the Monopriors and official G3T multiview examples"

[feature.monoprior.tasks._monoprior-download-video]
cmd = "test -d data/examples/video || hf download pablovela5620/monoprior-example --include 'video/*' --repo-type dataset --local-dir data/examples/"
cwd = "packages/monoprior"

[feature.monoprior.tasks._monoprior-download-polycam]
cmd = "test -d data/examples/polycam || hf download pablovela5620/monoprior-example --include 'polycam/*' --repo-type dataset --local-dir data/examples/"
cwd = "packages/monoprior"

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.monoprior.tasks.monoprior-relative-depth]
cmd = "python tools/demos/relative_depth.py --image-path data/examples/single-image/room.jpg"
depends-on = ["_monoprior-download-single-image"]
cwd = "packages/monoprior"
description = "Run relative depth estimation on example image"

[feature.monoprior.tasks.monoprior-multiview-depth]
cmd = "python tools/demos/multiview_depth.py --image-dir data/examples/multiview/car_landscape_12"
depends-on = ["_monoprior-download-multiview"]
cwd = "packages/monoprior"
description = "Run VGGT or G3T multiview depth on example images"

[feature.monoprior.tasks.monoprior-multiview-calibration]
cmd = "python tools/demos/multiview_calibration.py --image-dir data/examples/multiview/car_landscape_12"
depends-on = ["_monoprior-download-multiview"]
cwd = "packages/monoprior"
description = "Run multiview calibration on example images"

[feature.monoprior.tasks.monoprior-video-depth]
cmd = "python tools/demos/video_depth.py --video-path data/examples/video/davis_rollercoaster.mp4"
depends-on = ["_monoprior-download-video"]
cwd = "packages/monoprior"
description = "Run video depth estimation on example video"

[feature.monoprior.tasks.monoprior-polycam-inference]
