# ═══════════════════════════════════════════════════════════════════════════
# dpvo
# ═══════════════════════════════════════════════════════════════════════════
[feature.dpvo]
channels = ["https://prefix.dev/ai-demos", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[feature.dpvo.dependencies]
python = "3.11.*"
dpretrieval = { path = "packages/dpretrieval" }
eigen = ">=3.4.0,<3.5"
einops = ">=0.8.0,<0.9"
matplotlib = ">=3.8.4,<3.9"
icecream = ">=2.1.3,<2.2"
lietorch = ">=0.3.0"
numba = ">=0.60.0"
plyfile = ">=1.0.3,<1.1"
tyro = ">=0.9.1,<0.10"
ninja = ">=1.13.2,<2"

[feature.dpvo.pypi-dependencies]
dpvo = { path = "packages/dpvo", editable = true }
mini-dust3r = ">=0.1.1,<0.2"
evo = ">=1.28.0"
kornia = ">=0.7.0"
pypose = ">=0.6.0"
yacs = ">=0.1.8"
opencv-python = ">=4.9.0.80"
spaces = ">=0.32.0"

[feature.dpvo.activation.env]
PACKAGE_DIR = "packages/dpvo"

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.dpvo.tasks._download-dpvo-model]
cmd = "hf download pablovela5620/dpvo dpvo.pth --repo-type model --local-dir checkpoints/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/checkpoints/dpvo.pth"]
description = "Download DPVO model checkpoint"

[feature.dpvo.tasks._download-dpvo-data]
cmd = "bash -lc 'hf download pablovela5620/dpvo-example-data movies.zip --repo-type dataset --local-dir . && unzip -o movies.zip -d data/ && rm -f movies.zip && if [ -d data/data/movies ]; then rm -rf data/movies && mv data/data/movies data/movies && rmdir data/data 2>/dev/null || true; fi'"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/movies/IMG_0493.MOV"]
description = "Download DPVO example video data"

[feature.dpvo.tasks._download-dpvo-iphone-data]
cmd = "hf download pablovela5620/dpvo-example-data pool.MOV --repo-type dataset --local-dir data/iphone/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/iphone/pool.MOV"]
description = "Download DPVO iPhone example data"

# ── Build tasks ──────────────────────────────────────────────────────────
[feature.dpvo.tasks._build-dpvo-cuda-kernels]
cmd = "python setup.py build_ext --inplace"
cwd = "packages/dpvo"
description = "Build DPVO CUDA extensions (cuda_corr, cuda_ba)"
inputs = [
    "packages/dpvo/setup.py",
    "packages/dpvo/dpvo/altcorr/*.cpp",
    "packages/dpvo/dpvo/altcorr/*.cu",
    "packages/dpvo/dpvo/fastba/*.cpp",
    "packages/dpvo/dpvo/fastba/*.cu",
]
outputs = [
    "packages/dpvo/dpvo/_cuda_corr*.so",
    "packages/dpvo/dpvo/_cuda_ba*.so",
]

[feature.dpvo.tasks._dpvo-download-orb-vocab]
cmd = "bash -lc 'if [ ! -f ORBvoc.txt ]; then curl -L https://github.com/UZ-SLAMLab/ORB_SLAM3/raw/master/Vocabulary/ORBvoc.txt.tar.gz | tar xz; fi'"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/ORBvoc.txt"]
description = "Download ORB vocabulary for DBoW2 loop closure"

# ── EuRoC evaluation tasks ───────────────────────────────────────────────
[feature.dpvo.tasks._dpvo-download-euroc]
cmd = "python -c \"from dpvo.api.euroc import download_euroc; download_euroc()\""
cwd = "packages/dpvo"
description = "Download EuRoC MH_01-MH_05 sequences (~2GB each)"

[feature.dpvo.tasks.dpvo-eval-euroc]
cmd = "python tools/eval_euroc.py --modes vo slam --stride 2 --trials 1"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_dpvo-download-euroc",
]
cwd = "packages/dpvo"
description = "Evaluate DPV-SLAM on EuRoC MH sequences (VO + SLAM)"

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-demo]
cmd = "python tools/demo.py --imagedir data/movies/IMG_0493.MOV"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_download-dpvo-data",
]
cwd = "packages/dpvo"
description = "Run DPVO demo on example video"

# ── App tasks ────────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-app]
cmd = "python tools/gradio_app.py"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_download-dpvo-data",
    "_download-dpvo-iphone-data",
]
cwd = "packages/dpvo"
description = "Launch DPVO Gradio web UI"

# ─── slam-evals feature (VSLAM-LAB benchmark → Rerun catalog ingester) ──────
[feature.slam-evals]
platforms = ["linux-64", "linux-aarch64"]

[feature.slam-evals.dependencies]
python = "3.10.*"
pyyaml = "*"
pyarrow = ">=20.0.0,<21"
tqdm = "*"
pandas = "*"

[feature.slam-evals.pypi-dependencies]
slam-evals = { path = "packages/slam-evals", editable = true }
tyro = ">=0.9,<1"

[feature.slam-evals.activation.env]
PACKAGE_DIR = "packages/slam-evals"
VSLAM_LAB_BENCHMARK = "/home/pablo/0Dev/work/VSLAM-LAB-Benchmark"

[feature.slam-evals.tasks.slam-evals-ingest]
cmd = "python tools/ingest.py --benchmark-root $VSLAM_LAB_BENCHMARK --out ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Discover + ingest every sequence under $VSLAM_LAB_BENCHMARK into per-layer RRDs"

[feature.slam-evals.tasks.slam-evals-catalog]
cmd = "python tools/catalog.py --rrd-dir ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
