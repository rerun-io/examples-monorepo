# cuda13 torch.
gsplat = { version = "==1.5.3", index = "https://pypi.org/simple" }
accelerate = "*"
plyfile = "*"
timm = "*"
diffusers = "*"
torchsde = "*"
roma = "*"
peft = "*"
omegaconf = "*"

[feature.vistadream.activation.env]
PACKAGE_DIR = "packages/vistadream"
PYREFLY_TARGET = "src/vistadream/api src/vistadream/gradio src/vistadream/resize_utils.py src/vistadream/__init__.py tools"
TORCH_CUDA_ARCH_LIST = "7.5 8.6 8.9 12.0 12.1"
CUDA_HOME = "${CONDA_PREFIX}/targets/x86_64-linux"
CPATH = "${CONDA_PREFIX}/targets/x86_64-linux/include:${CPATH}"
PATH = "${CONDA_PREFIX}/nvvm/bin:${PATH}"

