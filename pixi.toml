[feature.slam-rs.tasks.tests]
cmd = "pytest -q -ra"
depends-on = ["slam-rs-build"]
cwd = "packages/slam-rs"
description = "Build the core, then run the package unit tests"

[feature.slam-rs.tasks.tests-integration]
cmd = "sh -c 'pytest -q -ra -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["slam-rs-build"]
cwd = "packages/slam-rs"
description = "Build the core, then run the package integration tests"

[feature.slam-rs.tasks.tests-golden]
cmd = "sh -c 'pytest -q -ra -m golden \"$@\" || test $? -eq 5' _"
depends-on = ["slam-rs-build"]
cwd = "packages/slam-rs"
description = "Build the core, then run the package golden reference tests"

# ── GPU lane (wgpu) ──────────────────────────────────────────────────────
# The GPU runtime uses the host graphics driver and runs from the base feature.
# Clippy checks GPU code and tests with warnings denied; the default lane
# does not compile these optional modules.
[feature.slam-rs.tasks.slam-rs-wgpu-clippy]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "cargo clippy -p slam-rs --features gpu-wgpu --all-targets -- -D warnings"
cwd = "packages/slam-rs"
description = "Lint the portable wgpu lane, tests included, with warnings denied"

# `--list | grep -c` first, and it is not decoration: both suites are
# `#![cfg(feature = "gpu-core")]` and the task selects `gpu-wgpu`, so a feature
# rename that stops the two matching compiles the files away and `cargo test`
# reports "ok. 0 passed" — a green gate that ran nothing. It happened once,
# splitting out `gpu-core`, and the count is what caught it. `grep -c`
# exits non-zero on no matches, so an empty binary fails before it runs.
#
# The cell-selection parity tests live in staging. The consumer keeps input,
# allocation and frame-queue tests in three binaries. The pool-flat assertion
# runs separately because each binary shares one CubeCL client.
[feature.slam-rs.tasks.slam-rs-wgpu-test]
depends-on = ["slam-rs-wgpu-build"]
cmd = "cargo test --locked --offline -p slam-rs --features gpu-wgpu --test gpu_kernels -- --list | grep -c ': test' && cargo test --locked --offline -p slam-rs --features gpu-wgpu --test frame_allocations -- --list | grep -c ': test' && cargo test --locked --offline -p slam-rs --features gpu-wgpu --test gpu_pool -- --list | grep -c ': test' && cargo test --locked --offline --workspace --features slam-rs/gpu-wgpu -- --nocapture && python -m pytest -q -ra -m integration tests/test_metal_python_host.py"
cwd = "packages/slam-rs"
description = "Run workspace tests with wgpu, checking that all three GPU integration binaries contain tests"

[feature.slam-rs.tasks.slam-rs-wgpu-doc]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = 'RUSTDOCFLAGS="-D warnings" cargo doc --locked --offline --no-deps -p slam-rs -p slam-rs-py --features slam-rs/gpu-wgpu'
cwd = "packages/slam-rs"
description = "Build wgpu Rust documentation with warnings denied"

# The same core on the portable lane, for measuring it: `--gpu` then selects
# wgpu, the only GPU runtime (D70).
[feature.slam-rs.tasks.slam-rs-wgpu-build]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "cargo build --release -p slam-rs-py --features gpu-wgpu --target-dir target/wgpu && cp target/wgpu/release/$CORE_CDYLIB slam_rs/_core.so.new && mv slam_rs/_core.so.new slam_rs/_core.so"
cwd = "packages/slam-rs"
inputs = [
    "packages/slam-rs/Cargo.toml",
    "packages/slam-rs/Cargo.lock",
    "packages/slam-rs/crates/*/Cargo.toml",
    "packages/slam-rs/crates/*/build.rs",
    "packages/slam-rs/crates/*/src/**",
    "packages/kornia-staging/Cargo.{toml,lock}",
    "packages/kornia-staging/crates/*/{Cargo.toml,build.rs}",
    "packages/kornia-staging/crates/*/src/**",
    "packages/kornia-staging/patches/**",
    "packages/kornia-staging/scripts/prepare_patched_deps.py",
    "packages/kornia-staging/target/patch/**",
]
outputs = ["packages/slam-rs/slam_rs/_core.so"]
description = "Build the Rust VIO core with the portable wgpu CubeCL frontend and install it in place"

