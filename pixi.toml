# ═══════════════════════════════════════════════════════════════════════════
# wilor-nano
# ═══════════════════════════════════════════════════════════════════════════
[feature.wilor-nano.dependencies]
python = "3.12.*"
dill = ">=0.4.0,<0.5"
trimesh = "*"
pyrender = "*"
# float with the shared cuda130/torch-2.12 stack (torch 2.12 pairs with torchvision 0.27)
torchvision = "*"
torchcodec = "*"

[feature.wilor-nano.pypi-dependencies]
wilor_nano = { path = "packages/wilor-nano", editable = true }
daggr = { path = "/home/pablo/0Dev/personal/daggr", editable = true }
rtmlib = { git = "https://github.com/pablovela5620/rtmlib.git", rev = "98bca2193c39b349034b280803b54c9ee58f7c68" }
onnx = ">=1.12.0,<1.18.0"
onnxscript = "*"

[feature.wilor-nano.target.linux-64.pypi-dependencies]
# TensorRT engines are machine-local artifacts; keep ONNX portable and rebuild engines per target GPU.
tensorrt-cu13 = { version = "==10.13.3.9", index = "https://pypi.nvidia.com" }
# tensorrt-cu13-libs has stale metadata requiring `nvidia-cuda-runtime-cu13` (NVIDIA
# deprecated it for cu13 in favor of unsuffixed `nvidia-cuda-runtime`). conda provides
# the real CUDA 13 runtime, so satisfy it with NVIDIA's empty 0.0.0a0 placeholder wheel
# (no-op; avoids building the broken 0.0.1 sdist stub).
nvidia-cuda-runtime-cu13 = "==0.0.0a0"
cuda-python = "*"

[feature.wilor-nano.target.linux-aarch64.pypi-dependencies]
onnxruntime-gpu = { version = ">=1.24.0.dev0,<2", index = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ort-cuda-13-nightly/pypi/simple/" }

[feature.wilor-nano.activation.env]
PACKAGE_DIR = "packages/wilor-nano"

[feature.wilor-nano.tasks.wilor-nano-image-example]
cmd = "python tools/wilor_inference.py --image-path assets/img.png"
cwd = "packages/wilor-nano"
description = "Run WiLoR inference on example image"

[feature.wilor-nano.tasks.wilor-nano-video-example]
cmd = "python tools/wilor_inference.py --video-path assets/video.mp4"
cwd = "packages/wilor-nano"
description = "Run WiLoR inference on example video using the original PyTorch path"

[feature.wilor-nano.tasks.wilor-nano-video-trt]
cmd = "python tools/wilor_inference_trt.py"
cwd = "packages/wilor-nano"
description = "Run WiLoR video inference with the accepted batched TensorRT detector and full-WiLor backend"

[feature.wilor-nano.tasks.wilor-nano-export-onnx]
cmd = "python tools/conversion/export_wilor_onnx.py"
cwd = "packages/wilor-nano"
description = "Export WiLoR ONNX graphs used to rebuild TensorRT engines"

[feature.wilor-nano.tasks.wilor-nano-build-trt]
cmd = "python tools/conversion/build_wilor_tensorrt.py"
cwd = "packages/wilor-nano"
description = "Build machine-local WiLoR TensorRT engines from exported ONNX graphs"

[feature.wilor-nano.tasks.wilor-nano-compare-reference]
cmd = "python tools/compare_rrd_reference.py --reference-rrd tests/reference_data/wilor_video_30.rrd --candidate-rrd /tmp/wilor_candidate.rrd --index video_time --rtol 0.01 --atol 0.25"
