selfcap-curate = { features = ["catalog-common", "rerun-prerelease", "cuda", "selfcap-curate", "soma-runtime", "posekit-egohand"], solve-group = "selfcap-curate", no-default-feature = true }
selfcap-curate-dev = { features = ["catalog-common", "rerun-prerelease", "cuda", "selfcap-curate", "soma-runtime", "posekit-egohand", "dev"], solve-group = "selfcap-curate", no-default-feature = true }
exo-calib = { features = [
