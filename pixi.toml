# ── the macOS lane ───────────────────────────────────────────────────────
# The linux environments get their runtime stack from `catalog-common` and
# `rerun-prerelease`, and both are linux-only on purpose: eighteen of the twenty
# environments that compose them also compose `cuda`. Widening them was tried
# first and `pixi lock` refused: the `dataloader` extra then came from PyPI, and
# no PyPI torchvision for `osx-arm64` built against the conda torch. slam-rs
# imports no torchvision, so the macOS lane restates what the package actually
# loads and spells out the `catalog` extra alone. The duplication with `catalog-common` is the price
# of not making nineteen other environments solve for a platform none of them
# runs on.
[feature.slam-rs-osx]
platforms = ["osx-arm64"]

[feature.slam-rs-osx.dependencies]
av = "*"
py-opencv = "*"
numpy = "*"
pyserde = ">=0.31.2,<0.32"
tomli-w = ">=1.2,<2"
orjson = ">=3.11,<4"
jaxtyping = "*"
typing_extensions = ">=4.1.0,<4.16.0"
scipy = "*"
tqdm = "*"
# simplecv declares it, and the conda build spares uv a Rust source build.
hf-transfer = "*"
# pin-bump: hold — the macOS lane restates `common`'s exact pin, so a Rerun bump
# that misses this line leaves the Mac a release behind with no gate to say so.
rerun-sdk = { version = "==0.42.0", channel = "https://prefix.dev/conda-forge" } # pin-bump: hold
python-dateutil = "<3"  # conda rerun-sdk (ipykernel -> jupyter_client) and pandas would take 4.x; PyPI s3fs -> aiobotocore needs <3
pandas = ">=2"

[feature.slam-rs-osx.pypi-dependencies]
datafusion = "==54.0.0"  # rerun-sdk[catalog]; PyPI, see [feature.common.pypi-dependencies]
simplecv = { path = "packages/simplecv", editable = true }

# ── Package consumer lane ─────────────────────────────────────────────────
# Installs the two pixi-build outputs of packages/slam-rs (recipe.yaml) the way
# an external repo does, from the package directory as a source dependency, and
# checks that the core imports without simplecv. The other slam-rs environments
# keep the editable install: pixi rebuilds a source package whenever any file
# under the package changes, which would recompile the Rust core on every edit.
[feature.slam-rs-pkg]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.slam-rs-pkg.dependencies]
python = "3.12.*"
# The recipe's run dependency asks for rerun-sdk ==0.42.0; name the channel, as every
# other pin does, so the ai-demos rerun-sdk builds do not shadow conda-forge's.
rerun-sdk = { version = "==0.42.0", channel = "https://prefix.dev/conda-forge" }
slam-rs = { path = "packages/slam-rs" }
slam-rs-catalog = { path = "packages/slam-rs" }

[feature.slam-rs-pkg.tasks.slam-rs-pkg-check]
cmd = "python -c \"import importlib.util, slam_rs, slam_rs.rig, slam_rs.frontend_log, slam_rs.config; assert 'site-packages' in slam_rs.__file__, slam_rs.__file__; assert importlib.util.find_spec('slam_rs.catalog_feed'); print('slam-rs', slam_rs._core.__version__, slam_rs.__file__)\""
description = "Import the installed slam-rs core output and check the catalog output is present"

