# ═══════════════════════════════════════════════════════════════════════════
# gsplat-rust-renderer
# ═══════════════════════════════════════════════════════════════════════════
# osx-arm64 included for the viewer + PLY-loading flows; the `brush` conda
# package is linux-64-only.
[feature.gsplat-rust-renderer]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.gsplat-rust-renderer.dependencies]
python = "3.12.*"
# rerun 0.35 crates require rustc >= 1.95
rust = "1.97.*"
clang = "*"
cmake = "*"
pkg-config = "*"
numpy = "*"
jaxtyping = "<0.3"
typing_extensions = ">=4.1.0,<4.13.0"
av = "*"
py-opencv = "*"
huggingface_hub = "*"
hf-transfer = "*"
tyro = ">=0.9.1,<0.10"
pyserde = ">=0.31.2,<0.32"
# CPU-only PyTorch for lpips metrics (no CUDA requirement).
pytorch-cpu = ">=2.8.0"
torchvision = "*"

[feature.gsplat-rust-renderer.target.linux-64.dependencies]
# gilrs (via re_viewer) links libudev through pkg-config at build time.
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"
brush = "==0.3.0"

# Same viewer build deps for aarch64; brush (linux-64-only) deliberately absent.
[feature.gsplat-rust-renderer.target.linux-aarch64.dependencies]
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"

[feature.gsplat-rust-renderer.pypi-dependencies]
gsplat-rust-renderer = { path = "packages/gsplat-rust-renderer", editable = true }
lpips = ">=0.1.4,<1"
plyfile = ">=1.1,<2"
rerun-sdk = "==0.35.0"
simplecv = { path = "packages/simplecv", editable = true }

[feature.gsplat-rust-renderer.activation.env]
PACKAGE_DIR = "packages/gsplat-rust-renderer"
# Make pixi's pkg-config files (libudev.pc) visible to cargo builds.
PKG_CONFIG_PATH = "${CONDA_PREFIX}/lib/pkgconfig"

