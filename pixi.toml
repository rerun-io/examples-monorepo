[feature.hexels.tasks.hexels-export-published]
cmd = "python tools/export_published.py"
cwd = "packages/hexels"
description = "Stage published 30k checkpoints: model.ply, cameras.json, exact GT, published metrics (no GPU)"

[feature.hexels.tasks.hexels-render-published]
cmd = "python tools/render_published.py"
cwd = "packages/hexels"
description = "Render published checkpoints with upstream CUDA (16-bit), paper FPS, shared scorer + upstream evaluator"

[feature.hexels.tasks.hexels-train]
cmd = "python tools/train.py"
cwd = "packages/hexels"
description = "Train one scene with upstream Hexels under our protocol (7k, fixed SfM population) and score it"

[feature.hexels.tasks.hexels-score]
cmd = "python tools/score.py"
cwd = "packages/hexels"
description = "Shared scorer: PSNR/SSIM/LPIPS-VGG of a run's 16-bit renders against the scene's GT"

[feature.hexels.tasks.hexels-fit-2d]
cmd = "python tools/fit_image.py --method hexels-2d"
cwd = "packages/hexels"
description = "Fit Image-GS benchmark images with upstream 2D Hexels (20K->10K, 5,100 steps), time, VRAM, score"

[feature.hexels.tasks.hexels-decode-2d]
cmd = "python tools/decode2d.py"
cwd = "packages/hexels"
description = "Decode 2D fits with upstream CUDA and with the WGSL renderer, score both, time the decodes"

[feature.hexels.tasks.hexels-figure-2d]
cmd = "python tools/figure2d.py"
cwd = "packages/hexels"
description = "Write the 2D Figure 2 rows and the six-image summary as Rerun recordings"

# The benchmark: Brush on the Hexels protocol (gsplat-train from the gsplat-rust-renderer build), the
