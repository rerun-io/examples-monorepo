    "_gsplat-rust-renderer-download-nerfbaselines-data-lego",
]
cwd = "packages/gsplat-rust-renderer"
description = "Train Lego for 7k steps while Rerun 0.35.0 replays Brush eval pairs, metrics, cameras, and eight retained snapshots"

