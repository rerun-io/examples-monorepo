# ═══════════════════════════════════════════════════════════════════════════
# lietorch-mojo — lietorch's Lie group API on Mojo CPU/GPU kernels (replaces ai-demos lietorch)
# ═══════════════════════════════════════════════════════════════════════════
[feature.lietorch-mojo]
channels = ["https://conda.modular.com/max/"]
platforms = ["linux-64", "linux-aarch64"]

[feature.lietorch-mojo.dependencies]
python = "3.12.*"
# Exact stable pins (2026-11-06): `mojo = "*"` from max-nightly had let the lock freeze a June 2026
# nightly; 1.2.0 is the newest stable Mojo, and since 1.2.0 std.gpu and layout ship in max-core.
# Bump deliberately: re-run lietorch-mojo's tests and mast3r-slam's Mojo parity tests (tests/test_mojo_backend.py).
# mojo comes directly from the stable max channel, not the modular metapackage (whose starlette pin conflicts
# with gradio). mast3r-slam's Mojo backend build gets mojo and max-core from this feature too.
mojo = { version = "==1.2.0", channel = "https://conda.modular.com/max/" }
max-core = { version = "==26.7.0", channel = "https://conda.modular.com/max/" }

[feature.lietorch-mojo.pypi-dependencies]
lietorch-mojo = { path = "packages/lietorch-mojo", editable = true }

# Package-only settings live in their own feature so consumers (dpvo) keep their PACKAGE_DIR.
[feature.lietorch-mojo-pkg]
platforms = ["linux-64", "linux-aarch64"]

[feature.lietorch-mojo-pkg.activation.env]
PACKAGE_DIR = "packages/lietorch-mojo"
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.lietorch-mojo.tasks.lietorch-mojo-build]
cmd = "mojo build --emit shared-lib -I lietorch_mojo/mojo -o lietorch_mojo/_lietorch_mojo_backends.so lietorch_mojo/mojo/_lietorch_mojo_backends.mojo"
cwd = "packages/lietorch-mojo"
description = "Build the lietorch-mojo extension (CPU + GPU kernels for the local GPU)"
inputs = ["packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/lietorch-mojo/lietorch_mojo/_lietorch_mojo_backends.so"]

# Upstream lietorch stays out of the lock: a throwaway `pixi exec` env (needs a CUDA GPU) freezes its
# outputs into the parity tests' reference .rrd. Re-run only when the reference inputs or ops change.
[feature.lietorch-mojo.tasks.lietorch-mojo-freeze-references]
cmd = "pixi exec -c https://prefix.dev/ai-demos -c https://prefix.dev/conda-forge -s 'python 3.11.*' -s \"lietorch[version='==1.0',build_number='>=2']\" -s 'pytorch-gpu 2.12.*' -s 'cuda-version 13.0.*' -s 'rerun-sdk ==0.42.0' -s numpy python -I tools/freeze_lietorch_references.py"
cwd = "packages/lietorch-mojo"
description = "Freeze upstream lietorch's outputs into tests/fixtures/lietorch_references.rrd (pixi exec env; lietorch is not in the lock)"

# ═══════════════════════════════════════════════════════════════════════════
# sam2-streaming — the vendored SAM 2 fork's own lane: its connected-components kernel in Mojo
# (sam2/mojo/, the port of sam2/csrc's CUDA extension) and its tests. posekit and mamma install sam2 without
# the Mojo toolchain; there the kernel is off (build_sam2_generic_video_predictor(fill_holes=False)).
# ═══════════════════════════════════════════════════════════════════════════
[feature.sam2-streaming]
platforms = ["linux-64", "linux-aarch64"]

[feature.sam2-streaming.dependencies]
python = "3.12.*"
hydra-core = ">=1.3.2,<1.4"
iopath = ">=0.1.10"

[feature.sam2-streaming.pypi-dependencies]
sam2 = { path = "packages/sam2-streaming", editable = true }

[feature.sam2-streaming.activation.env]
PACKAGE_DIR = "packages/sam2-streaming"
# The vendored upstream code is not typed; typecheck the Mojo wrapper and the tests.
PYREFLY_TARGET = "sam2/mojo_cc.py tests"

[feature.sam2-streaming.tasks.sam2-mojo-build]
cmd = "mojo build --emit shared-lib -I ../lietorch-mojo/lietorch_mojo/mojo -I sam2/mojo -o sam2/_sam2_mojo.so sam2/mojo/_sam2_mojo.mojo"
depends-on = ["lietorch-mojo-build"]
cwd = "packages/sam2-streaming"
description = "Build SAM 2's connected-components kernel in Mojo (GPU kernels for the local GPU)"
inputs = ["packages/sam2-streaming/sam2/mojo/*.mojo", "packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/sam2-streaming/sam2/_sam2_mojo.so"]

[feature.sam2-streaming.tasks.tests]
cmd = "cd $PACKAGE_DIR && pytest -q"
depends-on = ["sam2-mojo-build"]
description = "Build the Mojo kernel, then run the sam2-streaming unit tests"

[feature.sam2-streaming.tasks.tests-integration]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["sam2-mojo-build"]
description = "Build the Mojo kernel, then run the sam2-streaming integration tests (CUDA)"

[feature.dpvo]
channels = ["https://prefix.dev/ai-demos", "https://prefix.dev/conda-forge"]
# linux-aarch64: the DGX Spark (GB10) through the cuda feature.
platforms = ["linux-64", "linux-aarch64"]

[feature.dpvo.dependencies]
python = "3.12.*"
dpretrieval = { path = "packages/dpretrieval" }
einops = ">=0.8.0,<0.9"
matplotlib = ">=3.8.4,<3.9"
icecream = ">=2.1.3,<2.2"
numba = ">=0.60.0"
plyfile = ">=1.0.3,<1.1"
tyro = ">=0.9.1,<0.10"
# Video input decodes on NVDEC (simplecv TorchCodecVideoReader); the source video is logged once as an H.264
# VideoStream (simplecv log_video, FFmpeg re-encode). ffmpeg <902 links libjxl 0.11 and dlopen-fails beside 0.12.
torchcodec = "*"
ffmpeg = { version = ">=8.1", build-number = ">=902" }

[feature.dpvo.pypi-dependencies]
dpvo = { path = "packages/dpvo", editable = true }
# Intrinsics without a calibration file come from MoGe-2 (monopriors' TensorRT predictor, torch fallback).
monopriors = { path = "packages/monoprior", editable = true }
trtkit = { path = "packages/trtkit", editable = true }
# monopriors' metadata requires sam3; resolve it to the workspace package like the other monopriors consumers
sam3 = { path = "packages/sam3", editable = true }
evo = ">=1.28.0"
kornia = ">=0.7.0"
pypose = ">=0.6.0"
yacs = ">=0.1.8"
opencv-python = ">=4.9.0.80"
spaces = ">=0.32.0"

[feature.dpvo.activation.env]
PACKAGE_DIR = "packages/dpvo"

# Its tests import lietorch_mojo and the Mojo kernels (dpvo.mojo_backend), so the test lanes build both first.
[feature.dpvo.tasks.tests]
cmd = "cd $PACKAGE_DIR && pytest -q"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build"]
description = "Build lietorch-mojo and the Mojo kernels, then run the package unit tests"

[feature.dpvo.tasks.tests-integration]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build"]
description = "Build lietorch-mojo and the Mojo kernels, then run the package integration tests"

[feature.dpvo.tasks.tests-golden]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m golden \"$@\" || test $? -eq 5' _"
depends-on = ["lietorch-mojo-build", "dpvo-mojo-build"]
description = "Build lietorch-mojo and the Mojo kernels, then run the package golden reference tests"

# DPVO's correlation / BA kernels in Mojo (dpvo.mojo_backend): CPU and CUDA from one source, on
# lietorch-mojo's runtimes. The GPU kernels compile for the local GPU (sm_120 / sm_121).
[feature.dpvo.tasks.dpvo-mojo-build]
cmd = "mojo build --emit shared-lib -I ../lietorch-mojo/lietorch_mojo/mojo -I dpvo/mojo_backend/mojo -o dpvo/mojo_backend/_dpvo_mojo.so dpvo/mojo_backend/mojo/_dpvo_mojo.mojo"
cwd = "packages/dpvo"
description = "Build the Mojo kernels of dpvo.mojo_backend (CPU + GPU kernels for the local GPU)"
inputs = ["packages/dpvo/dpvo/mojo_backend/mojo/*.mojo", "packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/dpvo/dpvo/mojo_backend/_dpvo_mojo.so"]

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.dpvo.tasks._download-dpvo-model]
cmd = "hf download pablovela5620/dpvo dpvo.pth --repo-type model --local-dir checkpoints/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/checkpoints/dpvo.pth"]
description = "Download DPVO model checkpoint"

# The example videos are H.264 MP4s without B-frames: NVDEC decodes them and Rerun logs them as a VideoStream
# without a transcode (ffmpeg -c:v h264_nvenc -preset p5 -cq 32 -bf 0 -g 30 -an, from the original iPhone MOVs).
[feature.dpvo.tasks._download-dpvo-data]
cmd = "hf download pablovela5620/dpvo-example-data --repo-type dataset --include 'movies/*.mp4' --local-dir data/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/movies/IMG_0493.mp4"]
description = "Download DPVO example video data"

[feature.dpvo.tasks._download-dpvo-iphone-data]
cmd = "hf download pablovela5620/dpvo-example-data iphone/pool.mp4 --repo-type dataset --local-dir data/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/iphone/pool.mp4"]
description = "Download DPVO iPhone example data"

[feature.dpvo.tasks._dpvo-download-orb-vocab]
cmd = "bash -lc 'if [ ! -f ORBvoc.txt ]; then curl -L https://github.com/UZ-SLAMLab/ORB_SLAM3/raw/master/Vocabulary/ORBvoc.txt.tar.gz | tar xz; fi'"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/ORBvoc.txt"]
description = "Download ORB vocabulary for DBoW2 loop closure"

# ── EuRoC evaluation tasks ───────────────────────────────────────────────
[feature.dpvo.tasks._dpvo-download-euroc]
cmd = "python -c \"from dpvo.api.euroc import download_euroc; download_euroc()\""
cwd = "packages/dpvo"
description = "Download EuRoC MH_01-MH_05 sequences (~2GB each)"

[feature.dpvo.tasks.dpvo-eval-euroc]
cmd = "python tools/eval_euroc.py --modes vo slam --stride 2 --trials 1"
depends-on = [
    "lietorch-mojo-build",
    "dpvo-mojo-build",
    "_download-dpvo-model",
    "_dpvo-download-euroc",
]
cwd = "packages/dpvo"
description = "Evaluate DPV-SLAM on EuRoC MH sequences (VO + SLAM)"

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-demo]
cmd = "python tools/demo.py --imagedir data/movies/IMG_0493.mp4"
depends-on = [
    "lietorch-mojo-build",
    "dpvo-mojo-build",
    "_download-dpvo-model",
    "_download-dpvo-data",
]
cwd = "packages/dpvo"
description = "Run DPVO demo on example video"

# ── App tasks ────────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-app]
cmd = "python tools/gradio_app.py"
depends-on = [
    "lietorch-mojo-build",
    "dpvo-mojo-build",
    "_download-dpvo-model",
    "_download-dpvo-data",
    "_download-dpvo-iphone-data",
]
cwd = "packages/dpvo"
description = "Launch DPVO Gradio web UI"

# ─── slam-evals feature (VSLAM-LAB benchmark → Rerun catalog ingester) ──────
[feature.slam-evals]
platforms = ["linux-64", "linux-aarch64"]

[feature.slam-evals.dependencies]
python = "3.12.*"
pyyaml = "*"
pyarrow = ">=20.0.0,<21"
tqdm = "*"
pandas = "*"

[feature.slam-evals.pypi-dependencies]
slam-evals = { path = "packages/slam-evals", editable = true }
tyro = ">=0.9,<1"

[feature.slam-evals.activation.env]
PACKAGE_DIR = "packages/slam-evals"
VSLAM_LAB_BENCHMARK = "/home/pablo/0Dev/work/VSLAM-LAB-Benchmark"

[feature.slam-evals.tasks.slam-evals-ingest]
cmd = "python tools/ingest.py --benchmark-root $VSLAM_LAB_BENCHMARK --out ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Discover + ingest every sequence under $VSLAM_LAB_BENCHMARK into per-layer RRDs"

[feature.slam-evals.tasks.slam-evals-catalog]
cmd = "python tools/catalog.py --rrd-dir ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Mount the RRD directory as a Rerun catalog and print the segment summary"

[feature.slam-evals.tasks.slam-evals-refresh]
cmd = "python tools/catalog.py --refresh --rrd-dir ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Push edited layer files into the running catalog (append --datasets / --layers / --only filters; defaults to all)"

# ═══════════════════════════════════════════════════════════════════════════
# slam-rs — Rust VIO core (PyO3 extension) + Python plumbing
# ═══════════════════════════════════════════════════════════════════════════
# Explicit platforms required — see AGENTS.md "Platforms & lockfile". The core
# is CPU-only pure Rust, so this lists the plain subdirs and no named CUDA
# platform; `osx-arm64` is reachable only through `slam-rs-osx` below, since the
# two catalog features the linux environments compose are linux-only.
[feature.slam-rs]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.slam-rs.dependencies]
python = "3.12.*"
# conda-forge `rust` ships cargo/rustc/clippy/rustfmt and sets the linker; a
# pure-Rust crate needs nothing else. Same pin as gsplat-rust-renderer.
rust = "1.98.*"
tyro = ">=0.9.1,<0.10"

[feature.slam-rs.pypi-dependencies]
slam-rs = { path = "packages/slam-rs", editable = true }

[feature.slam-rs.target.linux-64.dependencies]
dav1d = "1.2.*"

[feature.slam-rs.target.linux-aarch64.dependencies]
dav1d = "1.2.*"

# Catalog result-layer publishing imports dataforge; dataforge is a linux-only
# member, so the osx lane leaves it out.
[feature.slam-rs.target.linux-64.pypi-dependencies]
dataforge = { path = "packages/dataforge", editable = true }

[feature.slam-rs.target.linux-aarch64.pypi-dependencies]
dataforge = { path = "packages/dataforge", editable = true }

[feature.slam-rs.tasks.slam-rs-demo]
cmd = "python tools/apps/replay.py --stage vio --segment msd-g2__MGO_others__MGO07_mapping_easy"
cwd = "packages/slam-rs"
depends-on = ["slam-rs-build", "slam-rs-download-sample", "slam-rs-register"]
description = "Build, fetch the sample, start the local catalog, register, and replay the four-camera MGO07 clip in the viewer"

[feature.slam-rs.tasks.slam-rs-catalog-up]
cmd = "python tools/apps/catalog_up.py"
cwd = "packages/slam-rs"
description = "Start the local catalog on :51235 unless one is already listening"

[feature.slam-rs.tasks.slam-rs-serve]
cmd = "bash -c 'ulimit -n 524288 && exec rerun server --port 51235'"
cwd = "packages/slam-rs"
description = "Start the local in-memory Rerun catalog on :51235 (own shell; keep it running)"

[feature.slam-rs.tasks.slam-rs-register]
# dataforge owns registration; the download mirrors its layer-major layout, so its
# register tool works on the tree unchanged (Linux: dataforge is a linux-only dep).
# A headset with no downloaded files is skipped; dataforge refuses an empty device.
cmd = "bash -c 'for d in index g2 odyssey; do compgen -G \"data/msd-rrd/base/msd-${d}__*.rrd\" > /dev/null || continue; python ../dataforge/tools/apps/register.py msd --device $d || exit 1; done'"
cwd = "packages/slam-rs"
depends-on = ["slam-rs-catalog-up"]
env = { DATAFORGE_OUTPUT_ROOT = "data/msd-rrd", RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Register downloaded MSD recordings in the catalog (dataforge-register per headset)"

[feature.slam-rs.tasks.slam-rs-gate]
cmd = "python tools/apps/gate.py"
cwd = "packages/slam-rs"
description = "Score catalog segments against ground truth and baselines"

[feature.slam-rs.tasks.slam-rs-download-sample]
# All three layers must be present. Adding a clip and updating the count
# re-downloads for everyone; hf download reconciles what is already there.
# The two smoke-tier clips plus MGO07_mapping_easy, the four-camera clip the demo replays, about 50 MB in total.
cmd = "bash -c 'test \"$(ls data/msd-rrd/{base,gt,sensor_metadata}/*{MIO10_short_2_panorama,MGO09_short_1_updown,MGO07_mapping_easy}* 2>/dev/null | wc -l)\" -ge 9 || hf download pablovela5620/msd-rrd --repo-type dataset --local-dir data/msd-rrd --include \"*MIO10_short_2_panorama*\" --include \"*MGO09_short_1_updown*\" --include \"*MGO07_mapping_easy*\"'"
cwd = "packages/slam-rs"
description = "Download the sample: the two smoke clips and the demo clip"

[feature.slam-rs.tasks.slam-rs-download-all]
# All three layers must be present. Adding a clip and updating the count
# re-downloads for everyone; hf download reconciles what is already there.
cmd = "bash -c 'test \"$(ls data/msd-rrd/{base,gt,sensor_metadata}/*.rrd 2>/dev/null | wc -l)\" -ge 192 || hf download pablovela5620/msd-rrd --repo-type dataset --local-dir data/msd-rrd'"
cwd = "packages/slam-rs"
description = "Download every MSD recording (about 15.5 GB)"

# A catalog run belongs on the GPU: the wgpu frontend (built first, so no CPU-only core left by a test run is used) and NVDEC
# decode, which only the slam-rs-cuda environments carry. Without a GPU adapter it falls back to the CPU and says so.
[feature.slam-rs-nvdec.tasks.slam-rs-catalog-layer]
depends-on = ["slam-rs-wgpu-build"]
cmd = "python tools/apps/catalog_layer.py"
cwd = "packages/slam-rs"
description = "Run catalog VIO on the GPU (wgpu frontend, NVDEC decode) and replace its slam_rs pose layer (fast profile)"

[feature.slam-rs.tasks.slam-rs-import-imu-calibration]
cmd = "python tools/import_imu_calibration.py"
cwd = "packages/slam-rs"
description = "Import a known Basalt IMU model as catalog metadata without rewriting recordings"

[feature.slam-rs-cpu]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.slam-rs-cpu.dependencies]
# SimpleCV's import needs torch even when the decoder is PyAV.
pytorch-cpu = ">=2.8.0"

[feature.slam-rs-nvdec]
platforms = ["linux-64", "linux-aarch64"]

[feature.slam-rs-nvdec.dependencies]
torchcodec = ">=0.14,<0.15"

[feature.slam-rs.activation.env]
PACKAGE_DIR = "packages/slam-rs"
PYREFLY_TARGET = "slam_rs tools tests"
# `tests/fixture_types.py` is what the suites share and is not a test module, so
# pytest finds it through `tests/` on sys.path and pyrefly needs the same
# directory on its search path.
PYREFLY_EXTRA_ARGS = "--search-path tests"
# cargo decides the cdylib's prefix and suffix from the target and no rustflag
# renames it, so the one filename that differs per platform is a variable rather
# than a second copy of the build task. Not a `lib_core.*` glob: that would also
# match the `lib_core.d` dep-info file cargo writes beside it.
CORE_CDYLIB = "lib_core.so"

# macOS writes the cdylib as `lib_core.dylib`; the import name keeps the `.so`
# suffix, which is what CPython looks for on macOS as well as on Linux. A
# target-scoped activation env merges with the feature's, so `PACKAGE_DIR` and
# `PYREFLY_TARGET` are still set here.
[feature.slam-rs.target.osx-arm64.activation.env]
CORE_CDYLIB = "lib_core.dylib"

# ── Rust build + gates ───────────────────────────────────────────────────
# cargo never runs during `pixi lock`/`pixi install`: the extension is built by
# this task and dropped next to the Python sources, where hatchling's editable
# .pth already looks (the dpvo / mast3r-slam in-place pattern).
[feature.slam-rs.tasks.slam-rs-build]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
# The CPU core and the GPU core (slam-rs-wgpu-build) share slam_rs/_core.so: each task that needs one installs it first, and
# the install is a rename, so a running process keeps the file it loaded. Separate target dirs make the switch a copy, not a rebuild.
cmd = "cargo build --release -p slam-rs-py && cp target/release/$CORE_CDYLIB slam_rs/_core.so.new && mv slam_rs/_core.so.new slam_rs/_core.so"
cwd = "packages/slam-rs"
inputs = [
    "packages/slam-rs/Cargo.toml",
    "packages/slam-rs/Cargo.lock",
    "packages/slam-rs/crates/*/Cargo.toml",
    "packages/slam-rs/crates/*/build.rs",
    "packages/slam-rs/crates/*/src/**",
    "packages/kornia-staging/Cargo.{toml,lock}",
    "packages/kornia-staging/crates/*/{Cargo.toml,build.rs}",
    "packages/kornia-staging/crates/*/src/**",
    "packages/kornia-staging/patches/**",
    "packages/kornia-staging/scripts/prepare_patched_deps.py",
    "packages/kornia-staging/target/patch/**",
]
outputs = ["packages/slam-rs/slam_rs/_core.so"]
description = "Build the Rust VIO core and install slam_rs._core in place"

[feature.slam-rs.tasks.slam-rs-clippy]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "cargo clippy --workspace --all-targets -- -D warnings"
cwd = "packages/slam-rs"
description = "Run clippy over the whole Rust workspace"

[feature.slam-rs.tasks.slam-rs-rust-test]
depends-on = [{ task = "kornia-staging-cubecl-park-test", environment = "kornia-staging" }]
cmd = "cargo test --locked --offline --workspace -- --nocapture"
cwd = "packages/slam-rs"
description = "Run the Rust test suite (unit tests + proptest)"

[feature.slam-rs.tasks.slam-rs-recorder-test]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "cargo test --locked --offline -p robocap-recorder --features live-slam -- --nocapture"
cwd = "packages/slam-rs"
description = "Run the recorder's live SLAM adapter tests without capture hardware"

[feature.slam-rs.tasks.slam-rs-catalog-test]
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = """bash -c 'cargo test --locked --offline -p slam-rs-cli --features catalog && if [[ -n ${SLAM_RS_CATALOG_URL:-} && -f ${SLAM_RS_TEST_FIXTURE:-}/clip.json && ( -f ${SLAM_RS_TEST_FIXTURE:-}/frames.u8 || -f ${SLAM_RS_TEST_FIXTURE:-}/frames.u8.xz ) && -n ${SLAM_RS_TEST_OUTPUT:-} ]]; then cargo test --locked --offline -p slam-rs-cli --features catalog catalog_inputs_match_python_fixture -- --ignored --nocapture; else echo "SKIP catalog_inputs_match_python_fixture: set SLAM_RS_CATALOG_URL, SLAM_RS_TEST_FIXTURE (clip.json plus frames.u8 or frames.u8.xz), SLAM_RS_TEST_OUTPUT; dav1d required for G2"; fi'"""
cwd = "packages/slam-rs"
description = "Run native catalog tests and explicitly select fixture parity when its assets are configured"

[feature.slam-rs.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "tests", "tests-integration", "slam-rs-rust-test", "slam-rs-recorder-test", "slam-rs-clippy", "slam-rs-wgpu-clippy"]
description = "Run Python, core native and recorder live-slam author checks; catalog and wgpu have named lanes"

[feature.slam-rs.tasks.slam-rs-fmt]
cmd = "cargo fmt --all"
cwd = "packages/slam-rs"
description = "Format the Rust sources"

[feature.slam-rs.tasks.slam-rs-version]
cmd = "python tools/apps/version.py"
depends-on = ["slam-rs-build"]
cwd = "packages/slam-rs"
description = "Print the version reported by the compiled core"

# Python tests import slam_rs._core, so every tier needs the build first;
