# ═══════════════════════════════════════════════════════════════════════════
# mamma — streaming multiview body capture (causal MAMMA pipeline)
# ═══════════════════════════════════════════════════════════════════════════
[feature.mamma]
platforms = ["linux-64"]

[feature.mamma.dependencies]
python = "3.12.*"
# The MAMMA MPI download server only talks to wget (rejects python TLS clients).
wget = "*"
onnx = "*"
onnxscript = "*"
einops = ">=0.8.0,<0.9"
tyro = ">=0.9.1,<0.10"
torchcodec = "*"
pyyaml = "*"
natsort = ">=8.4.0,<9"

[feature.mamma.pypi-dependencies]
mamma = { path = "packages/mamma", editable = true }
posekit = { path = "packages/posekit", editable = true }
trtkit = { path = "packages/trtkit", editable = true }
# Vendored sam2 fork with static metadata — see packages/sam2-streaming/VENDOR.md.
sam2 = { path = "packages/sam2-streaming", editable = true }

[feature.mamma.activation.env]
PACKAGE_DIR = "packages/mamma"

[feature.mamma.tasks._download-mamma-inputs]
cmd = "test -e data/inputs/indoors/crossing_arms/meta/global.npz || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'inputs/**' 'golden/**' 'body_models/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/inputs/indoors/crossing_arms/meta/global.npz"]
description = "Download crossing_arms inputs + slim golden + body models (private HF repo)"

[feature.mamma.tasks._download-mamma-weights]
cmd = "test -e data/weights/ma_2d/mamma_mask_full_cvpr.safetensors || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'weights/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/weights/ma_2d/mamma_mask_full_cvpr.safetensors"]
description = "Download MammaNet/YOLO/SAM2/EfficientTAM weights (private HF repo)"

[feature.mamma.tasks._download-mamma-hocap-sample]
cmd = "test -e data/hocap/sample || (mkdir -p data/hocap/ && hf download pablovela5620/hocap-sample sample.zip --repo-type dataset --local-dir data/hocap/ && python -m zipfile -e data/hocap/sample.zip data/hocap/)"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/hocap/sample"]
description = "Download and extract the HoCap sample dataset"

[feature.mamma.tasks._download-mamma-assembly101-sample]
cmd = "test -e data/assembly101-720-sample || hf download pablovela5620/Assembly101-Sample --repo-type dataset --include 'assembly101-720-sample/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/assembly101-720-sample"]
description = "Download the Assembly101 720p sample dataset"

[feature.mamma.tasks.mamma-download-dataset]
cmd = "python tools/download_dataset.py"
cwd = "packages/mamma"

[feature.mamma.tasks.mamma-demo-crossing-arms]
cmd = "python tools/demo_crossing_arms.py --tracker.expected-subjects 1"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Streaming pipeline on crossing_arms (4x 4K cams), live Rerun viewer"

[feature.mamma.tasks._download-mamma-body-models]
cmd = "test -e data/body_models/smplx || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'body_models/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/body_models/smplx"]
description = "Download SMPL-X body models + downsampled verts (private HF repo)"

[feature.mamma.tasks.mamma-demo-hocap]
cmd = "python tools/demo_hocap.py"
depends-on = [
    "_download-mamma-hocap-sample",
    "_download-mamma-weights",
    "_download-mamma-body-models",
]
cwd = "packages/mamma"
description = "Streaming pipeline on the HoCap sample (ingestion + visual check)"

[feature.mamma.tasks.mamma-demo-assembly101]
cmd = "python tools/demo_assembly101.py"
depends-on = [
    "_download-mamma-assembly101-sample",
    "_download-mamma-weights",
    "_download-mamma-body-models",
]
cwd = "packages/mamma"
description = "Streaming pipeline on the Assembly101 720p sample (ingestion + visual check)"

[feature.mamma.tasks.mamma-validate-golden]
cmd = "python tools/validate_golden.py --rr-config.headless"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Run streaming pipeline on crossing_arms frames 60:90 and gate MPJPE/PVE vs golden ma_3d"

[feature.mamma.tasks.mamma-benchmark]
cmd = "python tools/benchmark.py"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Timed full-clip run: PASS if wall <= 2x clip duration (>=50% realtime) after warmup incl. Rerun logging"

[feature.mamma.tasks.mamma-goal-check]
cmd = "python tools/goal_check.py"
depends-on = [
    "_download-mamma-inputs",
    "_download-mamma-weights",
    "_download-mamma-hocap-sample",
    "_download-mamma-assembly101-sample",
]
cwd = "packages/mamma"
description = "Aggregate goal verification: golden gate, 30fps benchmark, dataset RRDs, no-disk-writes, hygiene"

# iPhone catalog pipeline, in order: sweep → serve (own shell, keep running) → register.
[feature.mamma.tasks.mamma-iphones-sweep]
cmd = "python tools/sweep_iphones_quality.py --subset all"
depends-on = ["_download-mamma-weights"]
cwd = "packages/mamma"
description = "Step 1: run the quality preset on all 42 iPhone scenes -> quality.rrd + gate.json per scene (GPU)"

[feature.mamma.tasks.mamma-iphones-serve]
cmd = "rerun server --port 51234"
cwd = "packages/mamma"
description = "Step 2: start the local in-memory Rerun catalog on :51234 (run in its own shell; keep running to register/view)"

[feature.mamma.tasks.mamma-iphones-register]
cmd = "python tools/register_catalog.py"
cwd = "packages/mamma"
description = "Step 3: register the 42 RRDs into the mamma_iphones catalog (base+props layers, names/properties from gate.json, default blueprint); needs mamma-iphones-serve running"

# ═══════════════════════════════════════════════════════════════════════════
# mvs — multiview stereo depth + live meshing
# ═══════════════════════════════════════════════════════════════════════════
[feature.mvs]
platforms = ["linux-64-cuda13", "linux-aarch64-cuda13"]

[feature.mvs.dependencies]
python = "3.12.*"
einops = ">=0.8,<0.9"
kornia = ">=0.8,<0.9"
timm = ">=1.0,<2"
tyro = "*"
# NVDEC decode of catalog AV1 samples (cuda130 builds exist; torch pin comes from `cuda`).
torchcodec = ">=0.14,<0.15"

[feature.mvs.pypi-dependencies]
mvs = { path = "packages/mvs", editable = true }
trtkit = { path = "packages/trtkit", editable = true }

[feature.mvs.activation.env]
PACKAGE_DIR = "packages/mvs"

[feature.mvs.tasks.mvs-live-mesh]
cmd = "python tools/apps/live_mesh.py"
cwd = "packages/mvs"
description = "Stream catalog AV1 segments through NVDEC and log the frames to Rerun"

[feature.mvs.tasks.mvs-download-depth-model]
cmd = "hf download pablovela5620/mvs-depth depth_model_dot.onnx --local-dir data/models"
cwd = "packages/mvs"
description = "Download the ONNX multiview depth model"

[feature.mvs.tasks.mvs-catalog-depth]
cmd = "python tools/demos/catalog_depth.py"
cwd = "packages/mvs"
depends-on = ["mvs-download-depth-model"]
description = "Predict metric depth for catalog segments and log it to Rerun"


# ─── arkitscenes-download (ARKitScenes → layered Rerun recordings) ──────────
# linux-64 only: the video transcode prefers av1_nvenc with a libsvtav1 CPU fallback.
[feature.arkitscenes-download]
platforms = ["linux-64"]

[feature.arkitscenes-download.dependencies]
python = "3.12.*"
ffmpeg = ">=8.1"
imagecodecs = ">=2024.9.22"
trimesh = "*"
pillow = "*"
curl = "*"
rich = "*"

[feature.arkitscenes-download.pypi-dependencies]
arkitscenes-download = { path = "packages/arkitscenes-download", editable = true }
tyro = ">=0.9,<1"
modal = ">=1.0"

[feature.arkitscenes-download.activation.env]
PACKAGE_DIR = "packages/arkitscenes-download"
# Modal's decorated-function stubs (ParamSpec) and the container-only boto3
# import are unavoidable false positives; baseline them.
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.arkitscenes-download.tasks.arkitscenes-download-sample]
cmd = "python tools/apps/download.py --download-dir data --num-random 5 --seed 42 --no-include-point-clouds --assets mov annotation mesh lowres_wide.traj confidence lowres_depth lowres_wide_intrinsics ultrawide_intrinsics highres_depth"
cwd = "packages/arkitscenes-download"
description = "Download a 5-sequence ARKitScenes sample (mov + depth + calibration, no point clouds)"

[feature.arkitscenes-download.tasks.arkitscenes-download-ingest]
cmd = "python tools/apps/ingest_batch.py --workers 2"
cwd = "packages/arkitscenes-download"
depends-on = ["arkitscenes-download-sample"]
description = "Ingest every downloaded sequence into layered .rrd files under data/rrd/"

[feature.arkitscenes-download.tasks.arkitscenes-download-serve]
# Rerun keeps one handle open per registered RRD. One full corpus has
# 5015 segments * 7 layers = 35105 RRDs, so 65536 cannot hold two corpora.
cmd = "bash -c 'ulimit -n 524288 && exec rerun server --port 51235'"
cwd = "packages/arkitscenes-download"
description = "Serve a Rerun catalog for registered ARKitScenes recordings"

[feature.arkitscenes-download.tasks.arkitscenes-download-register]
cmd = "python tools/apps/register_catalog.py --rrd-dir data/rrd"
cwd = "packages/arkitscenes-download"
env = { RERUN_INSECURE_SKIP_HOST_CHECK = "1" }
description = "Register ingested layer .rrds into the catalog on :51235"

[feature.arkitscenes-download.tasks.arkitscenes-download-view]
cmd = "rerun rerun+http://127.0.0.1:51235"
cwd = "packages/arkitscenes-download"
description = "Open the native Rerun viewer on the local catalog"

