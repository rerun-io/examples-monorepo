cwd = "packages/gsplat-rust-renderer"
outputs = ["packages/gsplat-rust-renderer/data/tools/brush-v0.3.0/brush_app"]
description = "Install the checksummed official Brush v0.3.0 Apple Silicon binary project-locally"

[feature.gsplat-rust-renderer.tasks._gsplat-rust-renderer-build-brush-metrics-mac]
cmd = "test -x data/tools/brush-v0.3.0-metrics/brush_app || (rm -rf data/tools/brush-v0.3.0-metrics-src data/tools/brush-v0.3.0-metrics-target && git clone --depth 1 --branch v0.3.0 https://github.com/ArthurBrussee/brush.git data/tools/brush-v0.3.0-metrics-src && git -C data/tools/brush-v0.3.0-metrics-src rev-parse HEAD | grep -qx 3edecbb2fe79d3e2c87eeab85b15e0b1dd10d486 && git -C data/tools/brush-v0.3.0-metrics-src apply ../../../patches/brush-v0.3.0-cli-loss.patch && CARGO_TARGET_DIR=data/tools/brush-v0.3.0-metrics-target cargo build --release --locked --manifest-path data/tools/brush-v0.3.0-metrics-src/Cargo.toml --package brush-app --bin brush_app && mkdir -p data/tools/brush-v0.3.0-metrics && cp data/tools/brush-v0.3.0-metrics-target/release/brush_app data/tools/brush-v0.3.0-metrics/brush_app && rm -rf data/tools/brush-v0.3.0-metrics-src data/tools/brush-v0.3.0-metrics-target)"
cwd = "packages/gsplat-rust-renderer"
outputs = [
    "packages/gsplat-rust-renderer/data/tools/brush-v0.3.0-metrics/brush_app",
]
description = "Build pinned Brush v0.3.0 locally with pure-CLI loss output (macOS Metal; embedded Rerun remains disabled)"

