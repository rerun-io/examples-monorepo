# dpvo
# ═══════════════════════════════════════════════════════════════════════════
[feature.dpvo]
channels = ["https://prefix.dev/ai-demos", "https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[feature.dpvo.dependencies]
python = "3.11.*"
dpretrieval = { path = "packages/dpretrieval" }
eigen = ">=3.4.0,<3.5"
einops = ">=0.8.0,<0.9"
matplotlib = ">=3.8.4,<3.9"
icecream = ">=2.1.3,<2.2"
lietorch = ">=0.3.0"
numba = ">=0.60.0"
plyfile = ">=1.0.3,<1.1"
tyro = ">=0.9.1,<0.10"
ninja = ">=1.13.2,<2"

[feature.dpvo.pypi-dependencies]
dpvo = { path = "packages/dpvo", editable = true }
mini-dust3r = ">=0.1.1,<0.2"
evo = ">=1.28.0"
kornia = ">=0.7.0"
pypose = ">=0.6.0"
yacs = ">=0.1.8"
opencv-python = ">=4.9.0.80"
spaces = ">=0.32.0"

[feature.dpvo.activation.env]
PACKAGE_DIR = "packages/dpvo"

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.dpvo.tasks._download-dpvo-model]
cmd = "hf download pablovela5620/dpvo dpvo.pth --repo-type model --local-dir checkpoints/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/checkpoints/dpvo.pth"]
description = "Download DPVO model checkpoint"

[feature.dpvo.tasks._download-dpvo-data]
cmd = "bash -lc 'hf download pablovela5620/dpvo-example-data movies.zip --repo-type dataset --local-dir . && unzip -o movies.zip -d data/ && rm -f movies.zip && if [ -d data/data/movies ]; then rm -rf data/movies && mv data/data/movies data/movies && rmdir data/data 2>/dev/null || true; fi'"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/movies/IMG_0493.MOV"]
description = "Download DPVO example video data"

[feature.dpvo.tasks._download-dpvo-iphone-data]
cmd = "hf download pablovela5620/dpvo-example-data pool.MOV --repo-type dataset --local-dir data/iphone/"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/data/iphone/pool.MOV"]
description = "Download DPVO iPhone example data"

# ── Build tasks ──────────────────────────────────────────────────────────
[feature.dpvo.tasks._build-dpvo-cuda-kernels]
cmd = "python setup.py build_ext --inplace"
cwd = "packages/dpvo"
description = "Build DPVO CUDA extensions (cuda_corr, cuda_ba)"
inputs = [
    "packages/dpvo/setup.py",
    "packages/dpvo/dpvo/altcorr/*.cpp",
    "packages/dpvo/dpvo/altcorr/*.cu",
    "packages/dpvo/dpvo/fastba/*.cpp",
    "packages/dpvo/dpvo/fastba/*.cu",
]
outputs = [
    "packages/dpvo/dpvo/_cuda_corr*.so",
    "packages/dpvo/dpvo/_cuda_ba*.so",
]

[feature.dpvo.tasks._dpvo-download-orb-vocab]
cmd = "bash -lc 'if [ ! -f ORBvoc.txt ]; then curl -L https://github.com/UZ-SLAMLab/ORB_SLAM3/raw/master/Vocabulary/ORBvoc.txt.tar.gz | tar xz; fi'"
cwd = "packages/dpvo"
outputs = ["packages/dpvo/ORBvoc.txt"]
description = "Download ORB vocabulary for DBoW2 loop closure"

# ── EuRoC evaluation tasks ───────────────────────────────────────────────
[feature.dpvo.tasks._dpvo-download-euroc]
cmd = "python -c \"from dpvo.api.euroc import download_euroc; download_euroc()\""
cwd = "packages/dpvo"
description = "Download EuRoC MH_01-MH_05 sequences (~2GB each)"

[feature.dpvo.tasks.dpvo-eval-euroc]
cmd = "python tools/eval_euroc.py --modes vo slam --stride 2 --trials 1"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_dpvo-download-euroc",
]
cwd = "packages/dpvo"
description = "Evaluate DPV-SLAM on EuRoC MH sequences (VO + SLAM)"

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-demo]
cmd = "python tools/demo.py --imagedir data/movies/IMG_0493.MOV"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_download-dpvo-data",
]
cwd = "packages/dpvo"
description = "Run DPVO demo on example video"

# ── App tasks ────────────────────────────────────────────────────────────
[feature.dpvo.tasks.dpvo-app]
cmd = "python tools/gradio_app.py"
depends-on = [
    "_build-dpvo-cuda-kernels",
    "_download-dpvo-model",
    "_download-dpvo-data",
    "_download-dpvo-iphone-data",
]
cwd = "packages/dpvo"
description = "Launch DPVO Gradio web UI"

# ─── slam-evals feature (VSLAM-LAB benchmark → Rerun catalog ingester) ──────
# Ingestion depends only on rerun-sdk, av, numpy, pyyaml, pyarrow — all
# cross-platform. Platform is pinned to linux-aarch64 for now because the
# current dev host is aarch64 and pixi's uv build-dispatch can't initialise
# for linux-64 cross-builds from this host (see sibling CUDA features for
# the same pattern). Flip to ["linux-64", "linux-aarch64"] once a linux-64
# host is available to regenerate the linux-64 lockfile entries. The
# PyCuVSLAM baseline will come later as a separate CUDA-only feature.
[feature.slam-evals]
platforms = ["linux-aarch64"]

[feature.slam-evals.dependencies]
python = "3.10.*"
pyyaml = "*"
pyarrow = ">=20.0.0,<21"
tqdm = "*"
pandas = "*"

[feature.slam-evals.pypi-dependencies]
slam-evals = { path = "packages/slam-evals", editable = true }
tyro = ">=0.9,<1"

[feature.slam-evals.activation.env]
PACKAGE_DIR = "packages/slam-evals"
VSLAM_LAB_BENCHMARK = "/home/pablo/0Dev/work/VSLAM-LAB-Benchmark"

[feature.slam-evals.tasks.slam-evals-ingest]
cmd = "python tools/ingest.py --benchmark-root $VSLAM_LAB_BENCHMARK --out ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Discover + ingest every sequence under $VSLAM_LAB_BENCHMARK into per-layer RRDs"

[feature.slam-evals.tasks.slam-evals-catalog]
cmd = "python tools/catalog.py --rrd-dir ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Mount the RRD directory as a Rerun catalog and print the segment summary"

[feature.slam-evals.tasks.slam-evals-refresh]
cmd = "python tools/catalog.py --refresh --rrd-dir ../../data/slam-evals/rrd"
cwd = "packages/slam-evals"
description = "Push edited layer files into the running catalog (append --datasets / --layers / --only filters; defaults to all)"

# ═══════════════════════════════════════════════════════════════════════════
# Environments
# ═══════════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════════
# mamma — streaming multiview body capture (causal MAMMA pipeline)
# ═══════════════════════════════════════════════════════════════════════════
[feature.mamma]
platforms = ["linux-64"]

[feature.mamma.dependencies]
python = "3.12.*"
# cuda13 migration: align with the shared cuda130/torch-2.12 stack (fixes the
# torchvision-0.26/torch-2.10 mismatch that pinned the realtime gate RED).
pytorch-gpu = "2.12.*"
onnx = "*"
onnxscript = "*"
einops = ">=0.8.0,<0.9"
tyro = ">=0.9.1,<0.10"
torchcodec = "*"
pyyaml = "*"
natsort = ">=8.4.0,<9"

[feature.mamma.pypi-dependencies]
mamma = { path = "packages/mamma", editable = true }
# Vendored cjaverliat/sam2 fork (streaming predictor + forgetful memory bank +
# EfficientTAM); distribution name is `sam2`, needs no-build-isolation (torch
# at build time). See packages/sam2-streaming/VENDOR.md.
sam2 = { path = "packages/sam2-streaming", editable = true }
# TensorRT python API for the MammaNet engine (same pinned build as
# sapiens2-pose; engines are machine-local, rebuilt per GPU).
tensorrt-cu13 = { version = "==10.13.3.9", index = "https://pypi.nvidia.com" }
# tensorrt-cu13-libs has stale metadata requiring `nvidia-cuda-runtime-cu13` (NVIDIA
# deprecated it for cu13 in favor of unsuffixed `nvidia-cuda-runtime`). conda provides
# the real CUDA 13 runtime, so satisfy it with NVIDIA's empty 0.0.0a0 placeholder wheel
# (no-op; avoids building the broken 0.0.1 sdist stub).
nvidia-cuda-runtime-cu13 = "==0.0.0a0"

[feature.mamma.activation.env]
PACKAGE_DIR = "packages/mamma"

[feature.mamma.tasks._download-mamma-inputs]
cmd = "test -e data/inputs/indoors/crossing_arms/meta/global.npz || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'inputs/**' 'golden/**' 'body_models/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/inputs/indoors/crossing_arms/meta/global.npz"]
description = "Download crossing_arms inputs + slim golden + body models (private HF repo)"

[feature.mamma.tasks._download-mamma-weights]
cmd = "test -e data/weights/ma_2d/mamma_mask_full_cvpr.safetensors || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'weights/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/weights/ma_2d/mamma_mask_full_cvpr.safetensors"]
description = "Download MammaNet/YOLO/SAM2/EfficientTAM weights (private HF repo)"

[feature.mamma.tasks._download-mamma-hocap-sample]
cmd = "test -e data/hocap/sample || (mkdir -p data/hocap/ && hf download pablovela5620/hocap-sample sample.zip --repo-type dataset --local-dir data/hocap/ && python -m zipfile -e data/hocap/sample.zip data/hocap/)"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/hocap/sample"]
description = "Download and extract the HoCap sample dataset"

[feature.mamma.tasks._download-mamma-assembly101-sample]
cmd = "test -e data/assembly101-720-sample || hf download pablovela5620/Assembly101-Sample --repo-type dataset --include 'assembly101-720-sample/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/assembly101-720-sample"]
description = "Download the Assembly101 720p sample dataset"

[feature.mamma.tasks.mamma-demo-crossing-arms]
cmd = "python tools/demo_crossing_arms.py --tracker.expected-subjects 1"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Streaming pipeline on crossing_arms (4x 4K cams), live Rerun viewer"

[feature.mamma.tasks._download-mamma-body-models]
cmd = "test -e data/body_models/smplx || hf download pablovela5620/mamma-streaming-data --repo-type dataset --include 'body_models/**' --local-dir data/"
cwd = "packages/mamma"
outputs = ["packages/mamma/data/body_models/smplx"]
description = "Download SMPL-X body models + downsampled verts (private HF repo)"

[feature.mamma.tasks.mamma-demo-hocap]
cmd = "python tools/demo_hocap.py"
depends-on = ["_download-mamma-hocap-sample", "_download-mamma-weights", "_download-mamma-body-models"]
cwd = "packages/mamma"
description = "Streaming pipeline on the HoCap sample (ingestion + visual check)"

[feature.mamma.tasks.mamma-demo-assembly101]
cmd = "python tools/demo_assembly101.py"
depends-on = ["_download-mamma-assembly101-sample", "_download-mamma-weights", "_download-mamma-body-models"]
cwd = "packages/mamma"
description = "Streaming pipeline on the Assembly101 720p sample (ingestion + visual check)"

[feature.mamma.tasks.mamma-validate-golden]
cmd = "python tools/validate_golden.py --rr-config.headless"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Run streaming pipeline on crossing_arms frames 60:90 and gate MPJPE/PVE vs golden ma_3d"

[feature.mamma.tasks.mamma-benchmark]
cmd = "python tools/benchmark.py"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights"]
cwd = "packages/mamma"
description = "Timed full-clip run: PASS if wall <= 2x clip duration (>=50% realtime) after warmup incl. Rerun logging"

[feature.mamma.tasks.mamma-goal-check]
cmd = "python tools/goal_check.py"
depends-on = ["_download-mamma-inputs", "_download-mamma-weights", "_download-mamma-hocap-sample", "_download-mamma-assembly101-sample"]
cwd = "packages/mamma"
description = "Aggregate goal verification: golden gate, 30fps benchmark, dataset RRDs, no-disk-writes, hygiene"

# iPhone catalog pipeline (run in order): `sweep` generates per-scene quality.rrd +
# gate.json; `serve` runs the in-memory Rerun catalog (own shell, keep running);
# `register` registers the RRDs as the mamma_iphones dataset with names/properties
# + default blueprint. Mirrors rerun-io/trossen-oss's preprocess/serve/register.
[feature.mamma.tasks.mamma-iphones-sweep]
cmd = "python tools/sweep_iphones_quality.py --subset all"
depends-on = ["_download-mamma-weights"]
cwd = "packages/mamma"
description = "Step 1: run the quality preset on all 42 iPhone scenes -> quality.rrd + gate.json per scene (GPU)"

[feature.mamma.tasks.mamma-iphones-serve]
cmd = "rerun server --port 51234"
cwd = "packages/mamma"
description = "Step 2: start the local in-memory Rerun catalog on :51234 (run in its own shell; keep running to register/view)"

[feature.mamma.tasks.mamma-iphones-register]
cmd = "python tools/register_catalog.py"
cwd = "packages/mamma"
description = "Step 3: register the 42 RRDs into the mamma_iphones catalog (base+props layers, names/properties from gate.json, default blueprint); needs mamma-iphones-serve running"

