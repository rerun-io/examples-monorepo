[feature.kornia-staging.tasks.kornia-staging-cubecl-park-test]
# Cross-environment callers require the transitive task environment explicitly.
depends-on = [{ task = "kornia-staging-patch-deps", environment = "kornia-staging" }]
cmd = "cargo test --locked --offline --manifest-path target/patch/cubecl-common-0.11.0-pre.3/Cargo.toml park"
cwd = "packages/kornia-staging"
