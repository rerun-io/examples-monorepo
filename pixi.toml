# ═══════════════════════════════════════════════════════════════════════════
# live-rerun — zero-transcode logging of hardware-encoded H.264/H.265 into
# Rerun VideoStream (backend #1: DepthAI/OAK)
# ═══════════════════════════════════════════════════════════════════════════
[feature.live-rerun]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.live-rerun.dependencies]
python = "3.12.*"
tyro = ">=0.9.1,<0.10"

[feature.live-rerun.pypi-dependencies]
live-rerun = { path = "packages/live-rerun", editable = true }
# DepthAI 2.x required — 3.x fails to open this OAK unit. PyPI-only.
depthai = "==2.27.0.0"

[feature.live-rerun.activation.env]
PACKAGE_DIR = "packages/live-rerun"
PYREFLY_TARGET = "."
# depthai's incomplete compiled-module stubs are baselined.
PYREFLY_EXTRA_ARGS = "--baseline pyrefly-baseline.json"

[feature.live-rerun-demo]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.live-rerun-demo.tasks.live-rerun-oak]
cmd = "python tools/apps/oak_live_rerun.py"
cwd = "packages/live-rerun"
description = "Stream an OAK camera's encoded H.265/H.264 to Rerun (pass --rr-config.save out.rrd for live+save)"

# ═══════════════════════════════════════════════════════════════════════════
# mast3r-slam
# ═══════════════════════════════════════════════════════════════════════════
[feature.mast3r-slam]
channels = [
    "https://prefix.dev/ai-demos",
    "conda-forge",
]
platforms = ["linux-64"]

[feature.mast3r-slam.dependencies]
# Depth PNGs for catalog and Rerun logging (packages/depth-png).
depth-png = { path = "packages/depth-png" }
# The map surface: keyframes re-fused into a sparse colour TSDF, marching-cubes mesh (packages/tsdf-rs).
tsdf-rs = { path = "packages/tsdf-rs" }
python = "3.12.*"
torchcodec = "*"
ffmpeg = ">=7.1.0"
open3d = ">=0.19.0,<0.20"
# mkl 2026 (forced by cuda13/torch-2.12) breaks faiss's mkl builds (.so.2 vs
# .so.3 soname clash). Routing BLAS through OpenBLAS drops mkl entirely; GPU
# kernels are identical, only the CPU BLAS backend differs.
libblas = { version = "*", build = "*openblas" }
faiss = { version = "*", build = "*openblas*" }
scikit-learn = "*"
matplotlib = "*"
trimesh = "*"

[feature.mast3r-slam.target.linux-64.dependencies]
mast3r-src = { path = "recipes/mast3r-src" }
asmk-src = { path = "recipes/asmk-src" }
# asmk.hamming (asmk's Cython extension) in Rust; asmk-src re-exports it (recipes/asmk-src hamming-from-asmk-rs.patch).
asmk-rs = { path = "packages/asmk-rs" }

[feature.mast3r-slam.pypi-dependencies]
mast3r-slam = { path = "packages/mast3r-slam", editable = true }
# The tracking forward runs as a bf16 TensorRT engine (packages/trtkit); tensorrt-cu13 comes from the cuda feature.
trtkit = { path = "packages/trtkit", editable = true }
einops = ">=0.8.0"
evo = "*"
natsort = ">=8.4"
pykdtree = "*"
roma = "*"
pyaml = "*"

[feature.mast3r-slam.activation.env]
PACKAGE_DIR = "packages/mast3r-slam"
# Cap the CPU thread pools of every mast3r-slam process (frontend, backend, logger): with one pool per core in
# each, ~350 mostly spinning threads made example-fast 25.0 ms/frame; capped, 15.2.
OMP_NUM_THREADS = "4"
OPENBLAS_NUM_THREADS = "1"

# Its tests import lietorch_mojo and mast3r_slam.mojo_backend, so the test lanes build both extensions first.
[feature.mast3r-slam.tasks.tests]
cmd = "cd $PACKAGE_DIR && pytest -q"
depends-on = ["_mast3r-slam-build-mojo-kernels"]
description = "Build the Mojo kernels, then run the package unit tests"

[feature.mast3r-slam.tasks.tests-integration]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m integration \"$@\" || test $? -eq 5' _"
depends-on = ["_mast3r-slam-build-mojo-kernels"]
description = "Build the Mojo kernels, then run the package integration tests"

[feature.mast3r-slam.tasks.tests-golden]
cmd = "cd $PACKAGE_DIR && sh -c 'pytest -q -m golden \"$@\" || test $? -eq 5' _"
depends-on = ["_mast3r-slam-build-mojo-kernels"]
description = "Build the Mojo kernels, then run the package golden reference tests"

# typecheck resolves mast3r_slam.mojo_backend._mast3r_mojo, so the gate builds the kernels before it, not only before the tests.
[feature.mast3r-slam.tasks.gate]
depends-on = ["_mast3r-slam-build-mojo-kernels", "lint", "typecheck", "deadcode", "tests", "tests-integration"]
description = "Build the Mojo kernels, then run the author pre-merge checks for the package"

# ── Mojo kernel build ──────────────────────────────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-build-mojo-kernels]
depends-on = ["lietorch-mojo-build"]
cmd = "mojo build --emit shared-lib -I ../lietorch-mojo/lietorch_mojo/mojo -I mast3r_slam/mojo_backend/mojo -o mast3r_slam/mojo_backend/_mast3r_mojo.so mast3r_slam/mojo_backend/mojo/_mast3r_mojo.mojo"
cwd = "packages/mast3r-slam"
description = "Build the Mojo kernels of mast3r_slam.mojo_backend (GPU kernels for the local GPU, CPU pose solve)"
inputs = ["packages/mast3r-slam/mast3r_slam/mojo_backend/mojo/*.mojo", "packages/lietorch-mojo/lietorch_mojo/mojo/*.mojo"]
outputs = ["packages/mast3r-slam/mast3r_slam/mojo_backend/_mast3r_mojo.so"]

# ── Download tasks (hidden, used as depends-on) ─────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-download-checkpoints]
cmd = """
hf download pablovela5620/mast3r-slam \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_codebook.pkl \
    MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_trainingfree.pth \
    --repo-type model --local-dir checkpoints/
"""
cwd = "packages/mast3r-slam"
description = "Download MASt3R-SLAM model checkpoints"
outputs = [
    "packages/mast3r-slam/checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth",
]

[feature.mast3r-slam.tasks._mast3r-slam-download-example-data]
# The tours are mast3r-slam's own; the IMG_049x clips are dpvo / MetricTrail examples, so the same clip can be
# compared across the three apps. TODO(relocalisation): dpvo's iphone/pool.mp4 is left out on purpose — mast3r-slam
# loses tracking there and never relocalises (see "Known limitations" in packages/mast3r-slam/README.md).
cmd = """hf download pablovela5620/mast3r-slam-example-data normal-apt-tour.mp4 livingroom-tour.mp4 --repo-type dataset --local-dir data/ \
  && hf download pablovela5620/dpvo-example-data movies/IMG_0493.mp4 movies/IMG_0494.mp4 movies/IMG_0495.mp4 \
  --repo-type dataset --local-dir data/"""
cwd = "packages/mast3r-slam"
outputs = [
    "packages/mast3r-slam/data/normal-apt-tour.mp4",
    "packages/mast3r-slam/data/livingroom-tour.mp4",
    "packages/mast3r-slam/data/movies/IMG_0493.mp4",
    "packages/mast3r-slam/data/movies/IMG_0494.mp4",
    "packages/mast3r-slam/data/movies/IMG_0495.mp4",
]
description = "Download the example videos (mast3r-slam's tours and the dpvo / MetricTrail clips)"

# ── Test baseline task ──────────────────────────────────────────────────
[feature.mast3r-slam.tasks._mast3r-slam-generate-test-baseline]
cmd = """python tools/mast3r_slam_inference.py test \
  --dataset data/normal-apt-tour.mp4 --img-size 224 \
  --max-frames 30 \
  --rr-config.save tests/fixtures/baseline_30frames.rrd"""
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Generate baseline .rrd for regression tests (30 frames, deterministic)"
outputs = ["packages/mast3r-slam/tests/fixtures/baseline_30frames.rrd"]

# ── Demo tasks ───────────────────────────────────────────────────────────
[feature.mast3r-slam.tasks.mast3r-slam-example-quick]
cmd = "python tools/mast3r_slam_inference.py fast --dataset data/normal-apt-tour.mp4 --img-size 224 --max-frames 100"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM on first 100 frames (fast config, ~2 min)"

[feature.mast3r-slam.tasks.mast3r-slam-example-fast]
cmd = "python tools/mast3r_slam_inference.py fast --dataset data/normal-apt-tour.mp4 --img-size 224"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM inference (fast config, 224px, full video)"

[feature.mast3r-slam.tasks.mast3r-slam-example-base]
cmd = "python tools/mast3r_slam_inference.py base --dataset data/normal-apt-tour.mp4 --img-size 512"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Run MASt3R-SLAM inference (base config, 512px)"

[feature.mast3r-slam.tasks.mast3r-slam-app]
cmd = "python tools/gradio-app.py"
depends-on = [
    "_mast3r-slam-build-mojo-kernels",
    "_mast3r-slam-download-checkpoints",
    "_mast3r-slam-download-example-data",
]
cwd = "packages/mast3r-slam"
description = "Launch MASt3R-SLAM Gradio web UI"

# ═══════════════════════════════════════════════════════════════════════════
# gsplat-rust-renderer
# ═══════════════════════════════════════════════════════════════════════════
# Native viewer, render, evaluation and training tools share one workspace.
[feature.gsplat-rust-renderer]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.gsplat-rust-renderer.dependencies]
brush-src = { path = "recipes/brush-src" }
python = "3.12.*"
# Pinned Rerun and Brush crates share this Rust toolchain.
rust = "1.98.*"
clang = "*"
cmake = "*"
pkg-config = "*"
numpy = "*"
jaxtyping = "*"
typing_extensions = ">=4.1.0,<4.16.0"
av = "*"
py-opencv = "*"
huggingface_hub = "*"
hf-transfer = "*"
tyro = ">=0.9.1,<0.10"
pyserde = ">=0.31.2,<0.32"
tomli-w = ">=1.2,<2"
orjson = ">=3.11,<4"
scipy = "*"
pillow = "*"
rerun-sdk = { version = "==0.42.0", channel = "https://prefix.dev/conda-forge" }  # matches the custom viewer's =0.42.0 re_viewer crates; moves with their Rust port
python-dateutil = "<3"  # conda rerun-sdk (ipykernel -> jupyter_client) and pandas would take 4.x; PyPI s3fs -> aiobotocore needs <3
# simplecv asks for pandas; take it from conda beside the conda pyarrow that rerun-sdk brings.
pandas = ">=2.3.3"

[feature.gsplat-rust-renderer.target.linux-64.dependencies]
# gilrs (via re_viewer) links libudev through pkg-config at build time.
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"
# Same viewer build dependencies for aarch64.
[feature.gsplat-rust-renderer.target.linux-aarch64.dependencies]
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"

[feature.gsplat-rust-renderer.pypi-dependencies]
gsplat-rust-renderer = { path = "packages/gsplat-rust-renderer", editable = true }
plyfile = ">=1.1,<2"
simplecv = { path = "packages/simplecv", editable = true }

[feature.gsplat-rust-renderer.activation]
scripts = ["packages/gsplat-rust-renderer/activate.sh"]

[feature.gsplat-rust-renderer.activation.env]
PACKAGE_DIR = "packages/gsplat-rust-renderer"
PYREFLY_TARGET = "gsplat_rust_renderer tools tests"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_INCREMENTAL = "0"
# Make pixi's pkg-config files (libudev.pc) visible to cargo builds.
PKG_CONFIG_PATH = "${CONDA_PREFIX}/lib/pkgconfig"

# ── Download tasks ───────────────────────────────────────────────────────
# nerfbaselines HF data: datasets from nerfbaselines/nerfbaselines-data
# (blender/<scene>.zip), pretrained from nerfbaselines/nerfbaselines
# (3dgs-mcmc/blender/<scene>.zip, INRIA layout). Extraction is idempotent.
[feature.gsplat-rust-renderer.tasks.gsplat-download]
args = [{ arg = "kind", default = "pretrained" }, { arg = "scene", default = "lego" }]
cmd = "python tools/download.py {{ kind }} {{ scene }}"
cwd = "packages/gsplat-rust-renderer"
description = "Download data, pretrained checkpoints, all Blender assets, or tandt"

[feature.gsplat-rust-renderer.tasks.gsplat-build]
cmd = "cargo build --release --locked --workspace --bins --all-features"
cwd = "packages/gsplat-rust-renderer"
description = "Build the gsplat CLI with its probe subcommand, trainer and viewer"

[feature.gsplat-rust-renderer.tasks.gsplat-brush-cli-build]
cmd = "cargo install --git https://github.com/ArthurBrussee/brush --rev 1388f74c6fe0236f68ee4915564bf00e9d2e3747 brush-cli --locked --root .brush"
cwd = "packages/gsplat-rust-renderer"
env = { CARGO_TARGET_DIR = "target/brush-cli" }
description = "Build the pinned, unpatched Brush CLI for training comparisons"

[feature.gsplat-rust-renderer.tasks.gsplat-train]
args = [{ arg = "scene", default = "lego" }, { arg = "iterations", default = "30000" }, { arg = "mode", default = "record" }]
cmd = "python tools/train.py --scene {{ scene }} --iterations {{ iterations }} --mode {{ mode }}"
depends-on = ["gsplat-build"]
cwd = "packages/gsplat-rust-renderer"
description = "Prepare a scene and train; modes are record, live and video (extra flags follow --)"

[feature.gsplat-rust-renderer.tasks.gsplat-evaluate]
cmd = "python tools/evaluate_nerfbaselines.py"
depends-on = ["gsplat-build", { task = "gsplat-download", args = ["all", "all"] }]
cwd = "packages/gsplat-rust-renderer"
description = "Render and evaluate Blender test splits; --checkpoint-only checks bundled predictions"

# Call the env's cargo-fmt/cargo-clippy directly: unless $CARGO_HOME/bin is on PATH, `cargo <sub>` searches it
# first, where a rustup proxy may run an older toolchain than the pinned rust (Rerun 0.42 requires rustc 1.98).
[feature.gsplat-rust-renderer.tasks.gsplat-rust-check]
cmd = "cargo-fmt -p gsplat-core -p gsplat-viewer -p gsplat-cli -p gsplat-train -- --check && cargo-clippy clippy --locked --workspace --all-targets --all-features -- -D warnings && cargo test --locked --workspace --all-features"
cwd = "packages/gsplat-rust-renderer"
description = "Check our Rust formatting, run Clippy including gsplat probe, and run Rust unit tests"

[feature.gsplat-rust-renderer.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "tests", "tests-integration", "gsplat-rust-check"]
description = "Run Python, Rust and GPU integration author checks"

[feature.gsplat-rust-renderer.tasks.tests-integration]
cmd = "pytest -q -ra -m integration"
cwd = "packages/gsplat-rust-renderer"
description = "Run Python and whole-target Rust integration contracts"

[feature.gsplat-rust-renderer.tasks.tests-golden]
cmd = "pytest -q -ra -m golden"
cwd = "packages/gsplat-rust-renderer"
depends-on = ["gsplat-build"]
description = "Build release tools and compare against golden references"

[feature.gsplat-rust-renderer.tasks.gsplat-log-ply]
cmd = "python tools/log_gaussian_ply.py --rr-config.connect --rr-config.application-id gsplat-rust-renderer"
depends-on = [{ task = "gsplat-download", args = ["pretrained", "lego"] }]
cwd = "packages/gsplat-rust-renderer"
description = "Log the pretrained Lego PLY to the running viewer"

[feature.gsplat-rust-renderer.tasks.gsplat-log-scene]
cmd = "python tools/log_splats_with_cameras.py --rr-config.connect --rr-config.application-id gsplat-rust-renderer"
depends-on = [{ task = "gsplat-download", args = ["pretrained", "lego"] }, { task = "gsplat-download", args = ["data", "lego"] }]
cwd = "packages/gsplat-rust-renderer"
description = "Log the pretrained Lego splats and dataset cameras to the running viewer"

[feature.gsplat-rust-renderer.tasks.gsplat-log-hexels-compare]
cmd = "python tools/log_hexels_compare.py"
cwd = "packages/gsplat-rust-renderer"
description = "Log a Brush PLY and a hexel PLY side by side on one orbit camera with the per-scene metrics table"

# ═══════════════════════════════════════════════════════════════════════════
# depth-video-viewer — out-of-tree Rerun viewer that draws DepthVideoStream (AV1 10-bit depth)
# ═══════════════════════════════════════════════════════════════════════════
# Same pattern as the gsplat-rust-renderer viewer: crates.io Rerun =0.42.0 crates, no fork.
[feature.depth-video-viewer]
platforms = ["linux-64", "linux-aarch64"]

[feature.depth-video-viewer.dependencies]
python = "3.12.*"
# Pinned Rerun crates share this Rust toolchain (Rerun 0.42 requires rustc 1.98).
rust = "1.98.*"
clang = "*"
cmake = "*"
pkg-config = "*"
# rav1d's x86-64 assembly; without it AV1 decoding is ~25x slower.
nasm = "*"
# libaom-av1 encoder and the reference gray10le decoder for the logging helper.
ffmpeg = "*"
numpy = "*"
jaxtyping = "*"
pillow = "*"
tyro = ">=0.9.1,<0.10"
rerun-sdk = { version = "==0.42.0", channel = "https://prefix.dev/conda-forge" }  # pin-bump: hold — matches the viewer's =0.42.0 re_viewer crates
python-dateutil = "<3"  # conda rerun-sdk (ipykernel -> jupyter_client) would take 4.x
# gilrs (via re_viewer) links libudev through pkg-config at build time.
libudev = "257.*"
libxkbcommon = "*"
wayland = "*"
xorg-libx11 = "*"
xorg-libxcursor = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"

[feature.depth-video-viewer.pypi-dependencies]
depth-video-viewer = { path = "packages/depth-video-viewer", editable = true }

[feature.depth-video-viewer.activation.env]
PACKAGE_DIR = "packages/depth-video-viewer"
PYREFLY_TARGET = "depth_video_viewer tools tests"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"
CARGO_INCREMENTAL = "0"
PKG_CONFIG_PATH = "${CONDA_PREFIX}/lib/pkgconfig"

[feature.depth-video-viewer.tasks.depth-video-viewer-build]
cmd = "cargo build --release --locked"
cwd = "packages/depth-video-viewer"
description = "Build the depth-video-viewer binary (release)"

[feature.depth-video-viewer.tasks.depth-video-viewer]
cmd = "cargo run --release --locked --"
cwd = "packages/depth-video-viewer"
description = "Run the viewer; extra arguments (an .rrd path, --headless, --port) follow"

# Call the env's cargo-fmt/cargo-clippy directly (see gsplat-rust-check for why).
[feature.depth-video-viewer.tasks.depth-video-viewer-rust-check]
cmd = "cargo-fmt -- --check && cargo-clippy clippy --locked --all-targets -- -D warnings && cargo test --locked"
cwd = "packages/depth-video-viewer"
description = "Check Rust formatting, run Clippy and the Rust unit tests"

[feature.depth-video-viewer.tasks.gate]
depends-on = ["lint", "typecheck", "deadcode", "tests", "tests-integration", "depth-video-viewer-rust-check"]
description = "Run Python and Rust author checks"

# ═══════════════════════════════════════════════════════════════════════════
# hexels — upstream Hexels (CUDA 13 build in recipes/hexels-src) + our protocol tools
# ═══════════════════════════════════════════════════════════════════════════
# hexel-kernel installs as the Python module `gsplat`: never compose this feature with nerfstudio gsplat.
# Image-GS runs through upstream's fit_image harness in this env (hexel-kernel carries its 2D kernels).
[feature.hexels]
platforms = ["linux-64"]

[feature.hexels.dependencies]
python = "3.12.*"
# hexels-src runs need open3d (upstream mesh extraction, 2DGS eval_dtu and eval_tnt). Hold the monorepo's 0.19
# like every other feature. An earlier conda-forge 0.20.0 build failed to import (libOpen3D.so.0.20: undefined
# filament symbol); build _2 imports on Python 3.12 (2026-11-06), but 0.20 also moves the TSDF meshes, so the
# bump is its own change.
open3d = ">=0.19.0,<0.20"
hexels-src = { path = "recipes/hexels-src" }
hexel-kernel = { path = "recipes/hexels-src" }
image-gs = { path = "recipes/hexels-src" }
tyro = ">=0.9.1,<0.10"
pyserde = ">=0.31.2,<0.32"
tomli-w = ">=1.2,<2"
orjson = ">=3.11,<4"
jaxtyping = "*"
numpy = "*"
pillow = "*"
nvidia-ml-py = "*"
# Imported by hexels_bench (16-bit PNG I/O, PLY headers, the LPIPS scorer); until now they arrived only as
# run dependencies of the hexels-src outputs.
py-opencv = "*"
plyfile = "*"
lpips = "*"
