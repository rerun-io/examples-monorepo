cwd = "packages/zipdepth"
description = "Stream one catalog segment through ZipDepth-PromptDA and log wide + ultrawide inputs, predictions, targets, and per-frame scores to Rerun"

[feature.zipdepth-catalog.tasks.zipdepth-eval-teacher-reference]
