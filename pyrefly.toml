# Monorepo-wide Pyrefly config. Keep all Pyrefly settings here and do not add
# package-local `[tool.pyrefly]` sections in `packages/*/pyproject.toml`.
project-includes = [
    "packages/monoprior/monopriors/**/*",
    "packages/simplecv/simplecv/**/*",
    "packages/prompt-da/src/**/*",
    "packages/zipdepth/zipdepth/**/*",
    "packages/wilor-nano/src/**/*",
    "packages/sam3d-body/src/**/*",
    "packages/sam3/src/**/*",
    "packages/mv-api/src/**/*",
    "packages/robocap-slam/robocap_slam/**/*",
    "packages/dataforge/dataforge/**/*",
    "packages/exo-calib/exo_calib/**/*",
    "packages/pysfm/pysfm/**/*",
    "packages/vistadream/src/**/*",
    "packages/pyvrs-viewer/src/**/*",
    "packages/gsplat-rust-renderer/gsplat_rust_renderer/**/*",
    "packages/mast3r-slam/mast3r_slam/**/*",
    "packages/dpvo/dpvo/**/*",
    "packages/slam-evals/slam_evals/**/*",
    "packages/arkitscenes-download/arkitscenes_download/**/*",
    "packages/sapiens2-pose/src/**/*",
    "packages/sapiens-coco133-pose/src/**/*",
    "packages/posekit/src/**/*",
    "packages/trtkit/src/**/*",
    "packages/egoexo-forge/src/**/*",
    "packages/mamma/src/**/*",
    "packages/mvs/src/**/*",
    "packages/gauss-surf/src/**/*",
    "packages/live-rerun/src/**/*",
]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*.ipynb",
    "**/*venv/**/*",
    "**/third_party/**/*",
    "monopriors/third_party/**/*",
    "packages/monoprior/monopriors/third_party/**/*",
    # unmodified upstream ZipDepth training code is a vendor boundary (untyped)
    "packages/zipdepth/zipdepth/data/**/*",
    "packages/zipdepth/zipdepth/loss/**/*",
    "packages/zipdepth/zipdepth/training/**/*",
    "packages/zipdepth/zipdepth/evaluation/**/*",
    "packages/zipdepth/zipdepth/upstream_cli/**/*",
    "packages/sapiens2-pose/src/sapiens2_pose/assets/**/*",
    "packages/sapiens2-pose/src/sapiens2_pose/sapiens_lite/**/*",
]

# Disable heuristics so pyrefly uses only our explicit search-path,
# not per-file guesses (critical for monorepo with multiple source roots)
disable-search-path-heuristics = true

# Tensor-shape checking of jaxtyping annotations turns on by itself when the
# `shape_extensions` package resolves; pyrefly ships it as PyPI stub packages
# pinned to its own version (`pyrefly-torch-stubs`, `pyrefly-numpy-stubs`, both
# on `pyrefly-shape-extensions`). Adopt them in the `dev` feature once the numpy
# stubs (pyrefly 1.3 line) cover `einsum` and batched `@`; see AGENTS.md.

# Source roots — where first-party imports are resolved from
search-path = [
    "packages/monoprior",
    "packages/simplecv",
    "packages/prompt-da/src",
    "packages/zipdepth",
    "packages/wilor-nano/src",
    "packages/sam3d-body/src",
    "packages/sam3/src",
    "packages/mv-api/src",
    "packages/robocap-slam",
    "packages/dataforge",
    "packages/exo-calib",
    "packages/pysfm",
    "packages/vistadream/src",
    "packages/pyvrs-viewer/src",
    "packages/gsplat-rust-renderer",
    "packages/mast3r-slam",
    "packages/dpvo",
    "packages/slam-evals",
    "packages/arkitscenes-download",
    "packages/sapiens2-pose",
    "packages/sapiens2-pose/src",
    "packages/sapiens-coco133-pose/src",
    "packages/posekit/src",
    "packages/trtkit/src",
    "packages/egoexo-forge/src",
    "packages/mamma/src",
    "packages/mvs/src",
    "packages/gauss-surf/src",
    "packages/live-rerun/src",
    # Vendored sam2 fork is installed editable; pyrefly can't follow the
    # __editable__ finder, so resolve `sam2.*` from the source tree directly.
    "packages/sam2-streaming",
]

# Third-party packages — all *-dev env site-packages so pyrefly can resolve
# any import regardless of which package file is open.
# Requires all *-dev envs installed (pixi install -a)
site-package-path = [
    # Per-package envs for package-specific deps.
    # Common deps (rerun, numpy, etc.) are resolved from the python-interpreter-path
    # (dev env) automatically — no need to list .pixi/envs/dev here.
    ".pixi/envs/monoprior-dev/lib/python3.12/site-packages",
    ".pixi/envs/monoprior-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/simplecv-dev/lib/python3.12/site-packages",
    ".pixi/envs/simplecv-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/arkitscenes-download-dev/lib/python3.12/site-packages",
    ".pixi/envs/arkitscenes-download-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/prompt-da-dev/lib/python3.12/site-packages",
    ".pixi/envs/prompt-da-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/prompt-da-stream-dev/lib/python3.12/site-packages",
    ".pixi/envs/prompt-da-stream-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/zipdepth-dev/lib/python3.12/site-packages",
    ".pixi/envs/zipdepth-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/zipdepth-catalog-dev/lib/python3.12/site-packages",
    ".pixi/envs/zipdepth-catalog-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/wilor-nano-dev/lib/python3.12/site-packages",
    ".pixi/envs/sam3d-body-dev/lib/python3.12/site-packages",
    ".pixi/envs/sam3-dev/lib/python3.12/site-packages",
    ".pixi/envs/mv-api-dev/lib/python3.12/site-packages",
    ".pixi/envs/robocap-slam-dev/lib/python3.12/site-packages",
    ".pixi/envs/dataforge-dev/lib/python3.12/site-packages",
    ".pixi/envs/dataforge-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/exo-calib-dev/lib/python3.12/site-packages",
    ".pixi/envs/exo-calib-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/pysfm-dev/lib/python3.12/site-packages",
    ".pixi/envs/vistadream-dev/lib/python3.12/site-packages",
    ".pixi/envs/pyvrs-viewer-dev/lib/python3.12/site-packages",
    ".pixi/envs/gsplat-rust-renderer-dev/lib/python3.12/site-packages",
    ".pixi/envs/gsplat-rust-renderer-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/mast3r-slam-dev/lib/python3.11/site-packages",
    # rerun-sdk uses a .pth file (rerun_sdk.pth) that adds a subdirectory
    # to sys.path at runtime.  Pyrefly doesn't process .pth files, so we
    # add the subdirectory explicitly.
    ".pixi/envs/mast3r-slam-dev/lib/python3.11/site-packages/rerun_sdk",
    ".pixi/envs/dpvo-dev/lib/python3.11/site-packages",
    ".pixi/envs/slam-evals-dev/lib/python3.10/site-packages",
    ".pixi/envs/sapiens2-pose-dev/lib/python3.12/site-packages",
    ".pixi/envs/sapiens2-pose-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/sapiens-coco133-pose-dev/lib/python3.12/site-packages",
    ".pixi/envs/sapiens-coco133-pose-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/posekit-dev/lib/python3.12/site-packages",
    ".pixi/envs/posekit-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/trtkit-dev/lib/python3.12/site-packages",
    ".pixi/envs/egoexo-forge-dev/lib/python3.12/site-packages",
    ".pixi/envs/egoexo-forge-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/mamma-dev/lib/python3.12/site-packages",
    ".pixi/envs/mamma-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/mvs-dev/lib/python3.12/site-packages",
    ".pixi/envs/mvs-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/gauss-surf-dev/lib/python3.12/site-packages",
    ".pixi/envs/gauss-surf-dev/lib/python3.12/site-packages/rerun_sdk",
    ".pixi/envs/live-rerun-dev/lib/python3.12/site-packages",
    ".pixi/envs/live-rerun-dev/lib/python3.12/site-packages/rerun_sdk",
]

python-interpreter-path = ".pixi/envs/dev/bin/python"
