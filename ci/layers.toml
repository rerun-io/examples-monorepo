# Layer-import check (SPEC §1.3), run by ci/tests/test_layer_imports.py in `pixi run -e ci ci`.
# Layers, highest first: App > Graph > Node > Op > Model > Runtime > Types; imports only point down.
# A port moves its import root from `pending` to `enforced`; in an enforced package every module must match a rule.

enforced = ["exo_calib", "mamma", "robocap_live"]
pending = ["vistadream", "mast3r_slam"]

# Import name -> source root (the directory that holds the import package), relative to the repo.
[roots]
dagkit = "packages/dagkit"
simplecv = "packages/simplecv"
exo_calib = "packages/exo-calib"
mamma = "packages/mamma/src"
robocap_live = "packages/robocap-live"
vistadream = "packages/vistadream/src"
mast3r_slam = "packages/mast3r-slam"
posekit = "packages/posekit/src"
monopriors = "packages/monoprior"
trtkit = "packages/trtkit/src"

# dagkit is machinery, not a layer: stdlib plus these, and gradio only inside function bodies of dagkit/app.py.
[dagkit]
allowed = ["numpy", "pyarrow", "rerun", "serde", "tomli_w", "orjson", "tyro", "beartype"]
lazy = ["gradio", "gradio_rerun"]

# Path rules, first match wins; patterns are fnmatch globs on the path relative to packages/ (`*` crosses `/`).
[[rules]]
glob = "*/tools/*"
layer = "App"
[[rules]]
glob = "*/apis/*"
layer = "App"
[[rules]]
glob = "*/gradio*"
layer = "App"
[[rules]]
glob = "*/verify.py"
layer = "App"
[[rules]]
glob = "*/graphs/*"
layer = "Graph"
[[rules]]
glob = "*/nodes/*"
layer = "Node"
[[rules]]
glob = "*/sources/*"
layer = "Node"
[[rules]]
glob = "*/sinks/*"
layer = "Node"
[[rules]]
glob = "*/ops/*"
layer = "Op"
[[rules]]
glob = "*/models/*"
layer = "Model"
[[rules]]
glob = "trtkit/*"
layer = "Runtime"
[[rules]]
glob = "*/types.py"
layer = "Types"
[[rules]]
glob = "*/types/*"
layer = "Types"

# Rows import columns (SPEC §1.2). "dagkit" = any dagkit module; "dagkit.<m>" = only that module.
[allowed]
App = ["App", "Graph", "Node", "Op", "Model", "Runtime", "Types", "dagkit"]
Graph = ["Graph", "Node", "Op", "Model", "Runtime", "Types", "dagkit"]
Node = ["Node", "Op", "Model", "Runtime", "Types", "dagkit"]
Op = ["Op", "Types", "dagkit.types", "dagkit.time"]
Model = ["Model", "Runtime", "Types", "dagkit.types", "dagkit.time"]
Runtime = ["Runtime"]
Types = ["Types", "dagkit.types", "dagkit.time"]
