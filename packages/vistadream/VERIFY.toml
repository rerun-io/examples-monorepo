    "tests/test_ops.py::test_border_mask_covers_exactly_the_canvas_outside_the_image",
    "tests/test_ops.py::test_align_depth_recovers_an_affine_prediction_where_known",
    "tests/test_ops.py::test_gaussians_sit_on_the_backprojected_spawn_pixels",
]

[[tests]]
name = "nodes"
tier = "node"
lane = "unit"
