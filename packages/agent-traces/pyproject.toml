[project]
name = "agent-traces"
version = "0.1.0"
description = "Convert one Claude Code session into one Rerun recording"
requires-python = ">=3.12"
dependencies = ["rerun-sdk", "pyserde", "orjson", "tyro", "numpy", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_traces"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e agent-traces-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e agent-traces-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # Beartype requires TypeAlias, not PEP 695 type
]

[tool.vulture]
paths = ["agent_traces", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
ignore_names = ["converted_at", "subagent", "secs", "nanos", "duration", "unified_diff", "move_path", "agent_path", "durationMs"]  # Serialized fields.
