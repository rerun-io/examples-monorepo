[build-system]
# >= 1.9.4: sets PYO3_BUILD_EXTENSION_MODULE, which replaces PyO3's extension-module feature.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "depth-png"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/depth-png-py/Cargo.toml"
module-name = "depth_png"
# depth_png.pyi (next to this file) ships as depth_png/__init__.pyi with py.typed.
