# depth-png Cargo workspace: lossless PNG encoding and decoding of single-channel depth images (`crates/depth-png`,
# pure Rust) and its PyO3 module (`crates/depth-png-py`, imported as `depth_png`). Laid out like a kornia-staging crate
# plus a binding, as packages/tsdf-rs. maturin builds the module from crates/depth-png-py (pyproject.toml, recipe.yaml).
[workspace]
resolver = "2"
members = ["crates/depth-png", "crates/depth-png-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.dependencies]
depth-png = { path = "crates/depth-png" }
bytemuck = "1.23"
crc32fast = "1.5"
# zlib-rs: flate2's pure-Rust zlib port, bit-identical to zlib's output, 1.7x faster than miniz_oxide at level 4
# and 1.5x faster to inflate than fdeflate on depth PNGs; it builds for wasm32 too.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
numpy = "0.29"
# Decodes PNGs outside the encoder's layout (other filters, interlacing).
png = "0.18.1"
pyo3 = "0.29"
thiserror = "2"
# Adler-32 per band and its combination; already in the tree behind flate2's zlib-rs backend.
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
