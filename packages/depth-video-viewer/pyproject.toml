[project]
name = "depth-video-viewer"
version = "0.1.0"
description = "Log depth as AV1 10-bit video (DepthVideoStream) for the depth-video-viewer custom Rerun viewer"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["depth_video_viewer"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # PEP 695 `type` and beartype error messages
]

[tool.vulture]
paths = ["depth_video_viewer", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/target/*", "*/.ruff_cache/*"]
sort_by_size = true
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e depth-video-viewer-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e depth-video-viewer-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
