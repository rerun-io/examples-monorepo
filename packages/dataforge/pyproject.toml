[project]
name = "dataforge"
version = "0.1.0"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, gradio, gradio-rerun,
    #         huggingface_hub, hf-transfer, tqdm, pyserde, av, opencv
    "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # PEP 695 `type` does not parse on our Python 3.10/3.11 envs, and beartype errors name only the alias, not the shape
    "UP046",  # PEP 695 type parameters do not parse on Python 3.10/3.11 either
]

[tool.vulture]
paths = ["dataforge", "tests"]
# Tyro-facing verb entry points and config fields (the CLI shims call them), plus the
# keyword-only parameters a test fake must accept to match the real catalog API.
ignore_names = [
    # Shared SelfCap API used by selfcap-curate and selfcap-soma (outside these scan paths).
    "SOMA_XLO", "SOMA_METRICS", "SOMA_JOINTS", "SOMA_EARS", "SAPIENS2_XYZ",
    "SOMA_LAYER",  # Public layer-name contract retained by the SelfCap schema review.
    "OAK_HAND_BASES", "HEADSET_COVERED", "coco133_uv_shown_path", "oak_egohand_path",
    "oak_rig_of", "SyncRecord", "require_offset", "read_oak_track", "project_ego",
    "head_convention",  # Source-axis provenance on the shared normalized RigTrack record.
    "build_quest_model",  # Tyro entry point in tools/dev/selfcap_quest_model.py.
    # Snapshot fields are serialized; the snapshot CLI is a thin Tyro shim.
    "rerun_segment_id", "original_id", "snapshot_catalog",
    "device_id", "to", "pixel_array_size", "sensor_info",  # Vendor calibration schema fields.
    # VRS binary header fields retained to match FileFormat.h positional unpacking.
    "previous_record_size",
    "uncompressed_size",
    # soma_x_identity writes upstream SkeletonTransfer / RadialBasisFunction state that SOMA-X reads, outside these paths.
    "dim", "n_control", "include_polynomial", "kernel_name", "kernel_params", "_rbf_func", "_lu", "A", "bind_local_transforms",
    "_warp_stage1_skinned_orig_centered", "_warp_stage2_n1_children_orig_centered", "_warp_stage2_n2_children_orig_centered",
    "installed",  # pytest fixture taken by name.
    # MammaSyn: a cached shard index compares stamps whole; a context manager's __exit__ takes the exception triple.
    "mtime_ns",
    "exc",
    "main",
    "rr_config",
    "sequence",
    "force",
    "catalog_url",
    "dataset",
    "root",
    "_target",
    "on_duplicate",
    "set_default",
    "exist_ok",
    # A context manager's __exit__ has to accept it; the bodies here do not use it.
    "traceback",
    # msd's tyro-facing config fields, and the stub parameters a signature has to
    # accept but a body has no use for.
    "device",
    "keep_raw",
    "raw_budget_gb",
    "revision",
    "keywords",
    # http.server hooks the test's local download server overrides.
    "protocol_version",
    "do_HEAD",
    "do_GET",
    "do_POST",
    "log_message",
    # pytest's module-level skip marker.
    "pytestmark",
    # lamaria's tyro-facing config fields.
    "sequences",
    "keep_raw",
    "base_url",
    # The GPU-encoder gate fixture: requested for its skip, never read. Naming it
    # in @pytest.mark.usefixtures instead only moves the report to the fixture
    # itself, since vulture does not read strings.
    "nvenc",
    # gsi-six-view: the partner sign-in fixture, requested for the environment it sets.
    "signed_in",
    # Partial profile envelope consumed by pyserde.
    "hand_model",
    # aria_gen2_pilot manifest entries, read by name from FETCHED.
    "mps_slam_trajectories",
    "mps_hand_tracking",
    # EpisodeProperties fields serialized through dataclasses.fields.
    "hand_pose_version",
    "object_pose_version",
    "captions_version",
    # Ego-Exo4D-HM fit fields and takes.json fields, read through getattr and pyserde.
    "root_orient",
    "pose_body",
    # Timing record fields serialized by pyserde.
    "converter_version",
    "host",
    # MagicMock configuration in the fake catalog (tests/test_register.py).
    "return_value",
    # PyAV decoder setting, read by the decoder.
    "thread_type",
    "pix_fmt",
    # Pytest invokes this autouse capability fixture.
    "fixture_cuda_filter_available",
    # s3fs reads its retry count internally.
    "retries",
]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e dataforge-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e dataforge-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
