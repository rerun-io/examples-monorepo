[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
clap = { version = "4", features = ["derive"] }
glam = "0.30"
image = "0.25"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "=30.0.0"
burn = { git = "https://github.com/tracel-ai/burn", branch = "main", version = "=0.22.0-pre.3", default-features = false, features = ["std", "wgpu"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "fs", "sync"] }
brush-render = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
brush-serde = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
brush-loss = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
lpips = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
brush-process = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
brush-train = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
brush-dataset = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }

# Burn and CubeCL are pinned to Brush revisions in Cargo.lock.
# Rerun 0.38.1 pins wasm-bindgen =0.2.126, requiring registry wgpu 30.0.0.
# Match Brush: thin LTO; codegen-units keeps Cargo's release default (16).
[profile.release]
lto = "thin"
codegen-units = 16

# Observer-only event additions; see vendor/brush-process/README.md.
[patch.'https://github.com/ArthurBrussee/brush']
brush-process = { path = "vendor/brush-process" }
