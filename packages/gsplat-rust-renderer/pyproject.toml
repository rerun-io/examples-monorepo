[project]
name = "gsplat-rust-renderer"
version = "0.1.0"
description = "Gaussian splat logging helper and PLY parser for the custom Rerun viewer"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # PEP 695 `type` does not parse on our Python 3.10/3.11 envs, and beartype errors name only the alias, not the shape
]

[tool.vulture]
paths = ["gsplat_rust_renderer", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*", "*/.ruff_cache/*"]
sort_by_size = true
# CLI config fields and reusable metric helpers are runtime/public surfaces
# that Vulture reports at 60%.
min_confidence = 80

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e gsplat-rust-renderer-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e gsplat-rust-renderer-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
