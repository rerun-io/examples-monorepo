[package]
name = "gsplat-core"
version = "0.1.0"
edition = "2024"
description = "WebGPU Gaussian splat forward rendering without a tensor runtime"

[features]
testing = ["dep:pollster"]
# Derives for the camera files (camera_spec: gsplat-cli, viewer-probe); SOG meta.json parsing uses serde unconditionally.
serde = []
# Provenance (source commit, Cargo.lock digest, Brush revision) for metric reports: gsplat-cli and viewer-probe.
provenance = ["dep:sha2"]

[dependencies]
anyhow.workspace = true
sha2 = { version = "0.10", optional = true }
pollster = { workspace = true, optional = true }
half = { workspace = true, features = ["bytemuck"] }
bytemuck.workspace = true
glam.workspace = true
thiserror.workspace = true
wgpu.workspace = true
serde.workspace = true
serde_json.workspace = true
# Lossless WebP (VP8L) decode of SOG planes, pure Rust on native and wasm (already in the native lock via image).
image-webp = "0.2.4"
# zlib streams of .asog (already in the native and web locks through flate2/png).
miniz_oxide = "0.8.9"

[dev-dependencies]
pollster.workspace = true
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[lints]
workspace = true
