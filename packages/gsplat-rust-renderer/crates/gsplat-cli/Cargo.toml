[package]
name = "gsplat-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gsplat"
path = "src/main.rs"

[dependencies]
tempfile = "3"
gsplat-core = { path = "../gsplat-core", features = ["serde", "provenance"] }
brush-serde.workspace = true
brush-render.workspace = true
colmap-reader.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
tokio = { workspace = true, features = ["io-util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image.workspace = true
clap.workspace = true
anyhow.workspace = true
burn.workspace = true
half.workspace = true
re_renderer.workspace = true
re_sdk_types.workspace = true
rerun = { workspace = true, features = ["sdk"] }
re_types_core.workspace = true
re_log_encoding = { workspace = true, features = ["decoder"] }
re_log_types.workspace = true
re_chunk.workspace = true
# Rerun 0.44 math (glam 0.33) for the native engine; Brush-facing code keeps the workspace glam 0.30.
re_math = "0.33"
brush-dataset.workspace = true
brush-loss.workspace = true
lpips.workspace = true

[dev-dependencies]
brush-train.workspace = true

[lints]
workspace = true
