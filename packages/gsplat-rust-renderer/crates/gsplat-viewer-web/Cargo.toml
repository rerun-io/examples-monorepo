# Web (wasm32) build of the custom gsplat viewer: the stock re_viewer WebHandle plus our compute splat renderer.
# Its own Cargo workspace, so the [patch.crates-io] below never reaches the native viewer.
# Build: tools/build_web_viewer.py (pixi task gsplat-web-build), which prepares target/patch/ first.
[workspace]

[package]
name = "gsplat-viewer-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gsplat-core = { path = "../gsplat-core" }
gsplat-viewer = { path = "../gsplat-viewer" }
# The stock web viewer's map and audio views; no analytics, no agent panel (see gsplat-viewer/Cargo.toml).
re_viewer = { git = "https://github.com/rerun-io/rerun", tag = "0.44.0", default-features = false, features = ["default_web"] }
re_log = { git = "https://github.com/rerun-io/rerun", tag = "0.44.0" }
wasm-bindgen = "=0.2.129"
# The page URL, for ?force_no_subgroups=1.
wgpu = "=30.0.0"

# The WebGPU "subgroups" feature mapping that wgpu 30 lacks (patches/wgpu-30.0.0-webgpu-subgroups.patch), and the egui
# family at the revisions in Rerun's 0.44.0 Cargo.lock, as in ../../Cargo.toml.
[patch.crates-io]
wgpu = { path = "target/patch/wgpu-30.0.0" }
ecolor = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
eframe = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui-wgpu = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui-winit = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_extras = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_glow = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_inspection = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_kittest = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_system_font_provider = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
emath = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
epaint = { git = "https://github.com/emilk/egui.git", rev = "90431d979ab1faae2de6d9f736e9d33ca0d31956" }
egui_table = { git = "https://github.com/rerun-io/egui_crates.git", rev = "54b452e2b09e748511132d7be179c5d5b2ae566d" }
egui_tiles = { git = "https://github.com/rerun-io/egui_crates.git", rev = "54b452e2b09e748511132d7be179c5d5b2ae566d" }
re_mp4 = { git = "https://github.com/rerun-io/re_mp4.git", rev = "dd10225b0bcd192e0acaa4efa7d6e41682481d72" }

# Rerun 0.44 hooks (patches/re_viewer-0.44.0-web-hooks.patch) in a checkout of the tag. Patching the git crates that
# this graph (gsplat-viewer's native ones included: Cargo.lock covers every target) names directly sends every other Rerun crate to the same checkout through its path dependencies, so no
# crate builds twice. The checkout sits outside this workspace's directory: inside it, cargo would pass re_renderer's
# sources as workspace-relative paths, and re_renderer's embedded shader lookup only strips absolute ones.
# tools/build_web_viewer.py prepares both trees.
[patch."https://github.com/rerun-io/rerun"]
re_build_info = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_build_info" }
re_byte_size = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_byte_size" }
re_crash_handler = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_crash_handler" }
re_format = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_format" }
re_grpc_server = { path = "../../target/patch/rerun-0.44.0/crates/data_flow/re_grpc_server" }
re_log = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_log" }
re_tracing = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_tracing" }
re_video = { path = "../../target/patch/rerun-0.44.0/crates/utils/re_video" }
re_viewer = { path = "../../target/patch/rerun-0.44.0/crates/top/re_viewer" }

[profile.release]
# Full LTO and one codegen unit keep the wasm close to the stock viewer's size.
opt-level = 2
lto = "fat"
codegen-units = 1
debug = false
