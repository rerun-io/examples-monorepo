# Web (wasm32) build of the custom gsplat viewer: the stock re_viewer WebHandle plus our compute splat renderer.
# Its own Cargo workspace, so the [patch.crates-io] below never reaches the native viewer.
# Build: scripts/build_web_viewer.py (pixi task gsplat-web-build), which prepares target/patch/ first.
[workspace]

[package]
name = "gsplat-viewer-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gsplat-core = { path = "../gsplat-core" }
gsplat-viewer = { path = "../gsplat-viewer" }
# The stock web viewer's map and audio views; no analytics, no agent panel (see gsplat-viewer/Cargo.toml).
re_viewer = { version = "=0.42.0", default-features = false, features = ["default_web"] }
re_log = "=0.42.0"
wasm-bindgen = "=0.2.129"
# The page URL, for ?force_no_subgroups=1; DecompressionStream and its stream plumbing for the .asog inflate.
web-sys = { version = "0.3", features = [
  "CompressionFormat",
  "DecompressionStream",
  "Location",
  "Navigator",
  "ReadableStream",
  "ReadableWritablePair",
  "Response",
  "Window",
  "WritableStream",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wgpu = "=30.0.0"

# Rerun 0.42 hooks (patches/re_viewer-0.42.0-web-hooks.patch) and the WebGPU "subgroups" feature mapping that
# wgpu 30 lacks (patches/wgpu-30.0.0-webgpu-subgroups.patch). scripts/build_web_viewer.py prepares both trees.
[patch.crates-io]
re_viewer = { path = "target/patch/re_viewer-0.42.0" }
wgpu = { path = "target/patch/wgpu-30.0.0" }

[profile.release]
# Full LTO and one codegen unit keep the wasm close to the stock viewer's size.
opt-level = 2
lto = "fat"
codegen-units = 1
debug = false
