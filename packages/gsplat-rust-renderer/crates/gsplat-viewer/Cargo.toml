[package]
name = "gsplat-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gsplat-rust-renderer"
path = "src/main.rs"

[[bin]]
name = "gsplat-viewer-probe"
path = "src/bin/probe.rs"
required-features = ["probe"]

[features]
probe = ["dep:serde", "dep:serde_json", "dep:gsplat-render"]

[dependencies]
gsplat-core = { path = "../gsplat-core" }
gsplat-render = { path = "../gsplat-render", optional = true }
anyhow.workspace = true
clap.workspace = true
glam.workspace = true
wgpu.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Published Rerun 0.38.1 crates from crates.io — reproducible from a clean
# checkout on any machine. Rerun 0.38 uses egui/eframe 0.36, so the headless
# kittest harness must stay on the same egui family as re_viewer.
egui_kittest = { version = "0.36.2", features = ["wgpu", "eframe"] }
# `half::f16` decode for the `SphericalHarmonics3` wire component (viewer only).
# `bytemuck` feature makes `f16: Pod` so `[f16; 45]` slices out of Arrow.
half = { version = "2.7", features = ["bytemuck"] }
re_byte_size = { version = "=0.38.1" }
re_crash_handler = { version = "=0.38.1" }
re_grpc_server = { version = "=0.38.1" }
re_log_types = "=0.38.1"
re_log_channel = { version = "=0.38.1" }
re_log = { version = "=0.38.1", features = ["setup"] }
re_query = { version = "=0.38.1" }
re_renderer = { version = "=0.38.1" }
re_sdk_types = { version = "=0.38.1" }
re_view = { version = "=0.38.1" }
re_view_spatial = { version = "=0.38.1" }
re_viewer = { version = "=0.38.1" }
re_viewer_context = { version = "=0.38.1" }
tokio = { workspace = true }
