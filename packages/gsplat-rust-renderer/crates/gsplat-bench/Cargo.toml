[package]
name = "gsplat-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
gsplat-core = { path = "../gsplat-core" }
gsplat-render = { path = "../gsplat-render" }
brush-render.workspace = true
brush-serde.workspace = true
burn.workspace = true
image.workspace = true
glam.workspace = true
tokio.workspace = true
gsplat-rust-renderer = { path = "../..", default-features = false }
gsplat-eval = { path = "../gsplat-eval" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
log = "0.4"
# Rerun's codec dependency strips trace logs in release. Keep API events
# available for the opt-in attribution counter; logging is otherwise disabled.
wgpu-core = { version = "=30.0.1", features = ["api_log_info"] }
re_renderer = "=0.38.1"
re_sdk_types = "=0.38.1"
re_types_core = "=0.38.1"
re_log_encoding = { version = "=0.38.1", features = ["decoder"] }
re_log_types = "=0.38.1"
re_chunk = "=0.38.1"
macaw = "0.30"

colmap-reader = { git = "https://github.com/ArthurBrussee/brush", rev = "1388f74c6fe0236f68ee4915564bf00e9d2e3747" }
