[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, gradio, gradio-rerun,
    #         huggingface_hub, hf-transfer, tqdm, pyserde, av, opencv
    "monopriors>=0.3.2",
]
description = "Prompt Depth Anything Polycam CLI for the examples monorepo"
name = "rerun-prompt-da"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/rerun_prompt_da", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
# _engine: held only to keep the TRT engine alive for its execution context.
# _sample_index: populated by the synthetic RerunIterableDataset test fixture.
# cameras_path: populated by the synthetic PolycamDataset batching fixture.
# forward: called by torch.nn.Module.__call__.
# video/depth/conf/k/pose_t/pose_q: PromptDARow TypedDict fields, read via subscript.
ignore_names = ["rr_config", "_engine", "_sample_index", "cameras_path", "forward", "video", "depth", "conf", "k", "pose_t", "pose_q"]
