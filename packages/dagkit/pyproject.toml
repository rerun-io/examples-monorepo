[project]
name = "dagkit"
version = "0.1.0"
description = "Typed node/graph contract, runners, sources, sinks and verify cards (no torch)"
requires-python = ">=3.10"
dependencies = ["numpy", "pyarrow", "rerun-sdk", "pyserde", "tomli-w", "orjson", "tyro"]

[project.optional-dependencies]
gradio = ["gradio", "gradio-rerun"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagkit"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e dagkit-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e dagkit-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # Beartype requires TypeAlias, not PEP 695 type
]

[tool.ruff.lint.flake8-bugbear]
# Frozen port-kind and placement dataclasses are immutable, so they are safe defaults.
extend-immutable-calls = ["dagkit.graph.Block", "dagkit.graph.Placement"]

[tool.vulture]
paths = ["dagkit", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
# Serialized schema/report fields read by consumers, Config fields read by tyro/gradio, pytest markers.
ignore_names = [
    "step_ms_mean", "step_ms_p95", "params_sha", "reference", "input", "window_s", "lane", "properties", "metric",
    "iterations", "lr", "polish", "headless", "image", "frames", "scale", "output_ply", "pytestmark", "verify_run", "verify_score",
    "models_dir", "guidance", "captures", "export", "output_scale", "display", "resize_hw", "calib",
]
