[project]
name = "monopriors"
version = "0.3.2"
description = "Monocular Geometric Priors"
requires-python = ">=3.11.0"
readme = "README.md"

dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, gradio, gradio-rerun,
    #         huggingface_hub, hf-transfer, tqdm, pyserde, av, opencv
    "geffnet>=1.0.2",
    "omnidata-tools>=0.0.23",
    "pytorch-lightning>=2.5.1,<3",
    "diffusers[torch]>=0.32.2",
    "timm>=1.0.15,<2",
    "sam3>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["monopriors*", "tools*"]

[tool.setuptools.package-data]
monopriors = [
    "third_party/g3t/LICENSE.txt",
    "third_party/g3t/README.md",
]

[tool.ruff]
line-length = 150
exclude = ["monopriors/third_party", "notebooks"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "UP037", # Remove quotes from type, false positive when using jaxtyping
]

[tool.vulture]
paths = ["monopriors", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*", "*/third_party/*"]
sort_by_size = true
min_confidence = 60
ignore_names = [
    "StableNormalPredictor",
    "aabb",
    "camera_model",
    "camtoworld",
    "collider_type",
    "examples",
    "extract_zip",
    "far",
    "find_keyframes_dir",
    "foreground_mask",
    "has_mono_prior",
    "local_path",
    "near",
    "new_size",
    "orientation_override",
    "original_size",
    "padding",
    "pairs",
    "radius",
    "repo_path",
    "resolution_level",
    "rr_config",
    "run_fusion",
    "set_model_device",
    "sfm_sparse_points_view",
    "unload_vggt_model",
    "validate_zip",
    "worldtogt",
]
