[project]
name = "monopriors"
version = "0.3.3"
description = "Monocular Geometric Priors"
requires-python = ">=3.11.0"
readme = "README.md"

dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, gradio, gradio-rerun,
    #         huggingface_hub, hf-transfer, tqdm, pyserde, av, opencv
    "geffnet>=1.0.2",
    "omnidata-tools>=0.0.23",
    "pytorch-lightning>=2.5.1,<3",
    "diffusers[torch]>=0.32.2",
    "timm>=1.0.15,<2",
    "sam3>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["monopriors*", "tools*"]

[tool.setuptools.package-data]
monopriors = [
    "third_party/g3t/LICENSE.txt",
    "third_party/g3t/README.md",
    "third_party/zipdepth/LICENSE",
]

[tool.ruff]
line-length = 150
exclude = [
    "monopriors/third_party/depth_anything_v2",
    "monopriors/third_party/dsine",
    "monopriors/third_party/g3t",
    "monopriors/third_party/promptda",
    "monopriors/third_party/video_depth_anything",
    "tests/reference_data/zipdepth/upstream_architecture.py",
    "tests/reference_data/zipdepth/upstream_model_utils.py",
    "notebooks",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "UP037", # Remove quotes from type, false positive when using jaxtyping
]

[tool.vulture]
paths = ["monopriors", "tests", "tools"]
exclude = [
    "*/.pixi/*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/node_modules/*",
    "*/third_party/depth_anything_v2/*",
    "*/third_party/dsine/*",
    "*/third_party/g3t/*",
    "*/third_party/promptda/*",
    "*/third_party/video_depth_anything/*",
    "*/tests/reference_data/zipdepth/upstream_architecture.py",
    "*/tests/reference_data/zipdepth/upstream_model_utils.py",
]
sort_by_size = true
min_confidence = 60
ignore_names = [
    # third_party/zipdepth: TypedDict fields read by subscript and APIs used by packages/zipdepth
    "heads",
    "parameters_M",
    "print_model_summary",
    "fuse_remaining_conv_bn",
    "StableNormalPredictor",
    "aabb",
    "camera_model",
    "camtoworld",
    "collider_type",
    "examples",
    "extract_zip",
    "far",
    "find_keyframes_dir",
    "foreground_mask",
    "has_mono_prior",
    "local_path",
    "mask_token",
    "near",
    "new_size",
    "orientation_override",
    "original_size",
    "padding",
    "pairs",
    "radius",
    "repo_path",
    "resolution_level",
    "rr_config",
    "run_fusion",
    "set_model_device",
    "sfm_sparse_points_view",
    "unload_vggt_model",
    "validate_zip",
    "worldtogt",
]
