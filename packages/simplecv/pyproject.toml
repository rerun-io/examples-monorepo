[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simplecv"
version = "0.7.2"
description = "CV utilities for Python"
authors = [{ name = "pablovela5620", email = "pablovela5620@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # The old <0.3 cap guarded pyserde's jaxtyping breakage (pyserde#643);
    # current pyserde releases dropped their jaxtyping pin, so 0.3 is fine.
    "jaxtyping>=0.2.36",
    "numpy>=2.0",
    "einops>=0.8.0",
    "icecream>=2.1.3",
    "opencv-python>=4.10.0",
    "pyserde>=0.31.2,<0.32",
    "typing-extensions>=4.1.0",
    # Root Pixi lanes select the catalog and optional dataloader extras.
    "rerun-sdk>=0.36.3",
    "tyro>=0.9.1",
    "tqdm",
    "hf-transfer>=0.1.9",
    "lovely-numpy>=0.2.13,<0.3",
    "pandas>=2.3.3",
    "universal_pathlib>=0.3.7",
    "s3fs>=2025.3.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.22.0,<2"]
cuda = ["onnxruntime-gpu>=1.22.0,<2"]

[project.scripts]
simplecv-ingest-exoego = "simplecv.apis.ingest_exoego_recording:entrypoint"
simplecv-view-exoego = "simplecv.apis.view_exoego:entrypoint"

[tool.setuptools.packages.find]
include = ["simplecv*", "tools*", "tests*"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 150
exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = [
    "E501",
    "F722",
    "F821",
    "UP037",
    "UP040",
]

[tool.vulture]
paths = ["simplecv", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
# SimpleCV exposes many public APIs and schema fields that Vulture reports at 60%.
min_confidence = 80
# Monkeypatched rr.send_columns lambdas must keep the API's keyword parameter names.
# pts/dts/duration: av.Packet timing attributes set during the in-memory MP4 wrap.
# decode: ColumnDecoder hook invoked by the Rerun dataloader, not by package code.
ignore_names = ["indexes", "pts", "dts", "duration", "decode"]
