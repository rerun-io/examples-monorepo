[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
description = "Rerun and Gradio tools for egocentric and exocentric human datasets"
name = "egoexo-forge"
requires-python = ">= 3.12"
version = "0.1.0"
dependencies = [
    "wilor-nano",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/egoexo_forge"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/egoexo_forge", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
