# robocap-live: the on-cap live pipeline (raw cameras + IMU -> slam-rs VIO + DetNet/KeyNet on the NPU + handfit fit -> Rerun),
# and the same core replaying an exported session. Its own workspace: it path-depends on slam-rs and handfit.
[workspace]
resolver = "3"
members = ["crates/robocap-live", "crates/robocap-panel", "crates/robocap-types"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
handfit = { path = "../handfit/crates/handfit" }
# kornia-rs first, at slam-rs's pinned revision (7 commits behind the v0.2.0 release) so slam-rs and this crate share one Image type.
# Moving both to crates.io 0.2.0 together comes before any kornia-slam dependency (it builds on 0.2.0). See UPSTREAM.md.
kornia-3d = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
kornia-image = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
nalgebra = "0.35"
robocap-types = { path = "crates/robocap-types" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
slam-rs = { path = "../slam-rs/crates/slam-rs" }
thiserror = "2"

# slam-rs's patched cubecl-common (see packages/slam-rs/Cargo.toml); the tree is prepared by slam-rs-patch-deps.
[patch.crates-io]
cubecl-common = { path = "../slam-rs/target/patch/cubecl-common-0.11.0-pre.3" }
# The Mali shader-compiler fix (slam-rs patches/cubecl-spirv-0.11.0-pre.3-shared-implicit-pointer.patch): without it the
# GPU lane's first kernel crashes libmali's compiler on the caps. Same patched tree as slam-rs's own workspace.
cubecl-spirv = { path = "../slam-rs/target/patch/cubecl-spirv-0.11.0-pre.3" }

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
