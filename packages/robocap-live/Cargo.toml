# robocap-live: the on-cap live pipeline (raw cameras + IMU -> slam-rs VIO + DetNet/KeyNet on the NPU + handfit fit -> Rerun),
# and the same core replaying an exported session. Its own workspace: it path-depends on slam-rs and handfit.
[workspace]
resolver = "3"
members = ["crates/robocap-live", "crates/robocap-live-py", "crates/robocap-panel", "crates/robocap-types"]
# robocap-live-py (the Python extension) builds only when named (`-p robocap-live-py`, the robocap-live-build pixi task): the cap
# build and the workspace's own build, test and clippy runs need no Python.
default-members = ["crates/robocap-live", "crates/robocap-panel", "crates/robocap-types"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
kornia-staging-3d = { path = "../kornia-staging/crates/kornia-staging-3d", features = ["virtual-camera"] }
kornia-staging-imgproc = { path = "../kornia-staging/crates/kornia-staging-imgproc" }
anyhow = "1"
handfit = { path = "../handfit/crates/handfit" }
# Match slam-rs on crates.io kornia 0.2 so both consumers share one Image type. See UPSTREAM.md.
kornia-algebra = { version = "0.2", default-features = false }
kornia-image = { version = "0.2", default-features = false }
kornia-imgproc = { version = "0.2", default-features = false }
nalgebra = "0.35"
robocap-types = { path = "crates/robocap-types" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
slam-rs = { path = "../slam-rs/crates/slam-rs" }
thiserror = "2"

# slam-rs's patched cubecl-common (see packages/slam-rs/Cargo.toml); the tree is prepared by slam-rs-patch-deps.
[patch.crates-io]
cubecl-common = { path = "../slam-rs/target/patch/cubecl-common-0.11.0-pre.3" }
# The Mali shader-compiler fix (slam-rs patches/cubecl-spirv-0.11.0-pre.3-shared-implicit-pointer.patch): without it the
# GPU lane's first kernel crashes libmali's compiler on the caps. Same patched tree as slam-rs's own workspace.
cubecl-spirv = { path = "../slam-rs/target/patch/cubecl-spirv-0.11.0-pre.3" }

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
