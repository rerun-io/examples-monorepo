[project]
name = "selfcap-soma"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "torch", "py-soma-x==0.3.0", "rerun-sdk", "pyserde", "orjson", "tomli-w", "jaxtyping", "tyro"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.pytest.ini_options]
markers = ["integration: requires model assets, CUDA or catalog", "golden: stored reference comparisons"]
addopts = "-m 'not integration and not golden'"

[tool.vulture]
paths = ["selfcap_soma", "tests"]
min_confidence = 80
ignore_names = ["pytestmark"]
