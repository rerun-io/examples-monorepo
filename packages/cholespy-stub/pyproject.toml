[project]
name = "cholespy"
version = "2.2.0.post0+stub"
description = "Empty stand-in for cholespy: py-soma-x 0.3.0 lists it but never imports it, and it has no linux-aarch64 wheel"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cholespy"]
