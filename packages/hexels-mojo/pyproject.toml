[project]
name = "hexels-mojo"
version = "0.1.0"
description = "Hexels' CUDA extensions in Mojo: fused-ssim, simple-knn distCUDA2 and the 2D prune scorer"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
# Static metadata only. torch, jaxtyping and lietorch-mojo (whose runtime the kernels share) come from the
# environment; the Mojo extension `hexels_mojo/_hexels_mojo.so` is built by the `hexels-mojo-build` task.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexels_mojo"]
artifacts = ["hexels_mojo/_hexels_mojo.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a CUDA GPU (run: pixi run -e hexels-dev hexels-mojo-tests)",
    "golden: reference comparison against stored ground truth",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["hexels_mojo", "tests"]
exclude = ["*/.pixi/*", "*/__pycache__/*"]
min_confidence = 60
# upstream's API kept for drop-in use (distCUDA2, FusedSSIMMap's autograd hooks), pytest names.
ignore_names = ["pytestmark", "distCUDA2", "backward", "forward"]
