[project]
name = "metrictrail"
version = "0.1.0"
description = "NVIDIA MetricTrail (ViPE) in the monorepo: benchmark presets, kernel checks, VSLAM-LAB evaluation and a Rerun app"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
# Static metadata only. ViPE + MetricTrail come from the `recipes/vipe-src` conda package (kernels: packages/vipe-mojo);
# torch comes from the `cuda` feature; lietorch from the `lietorch-mojo` feature (pixi.toml [environments]); monopriors and
# trtkit (metrictrail.moge2) from the `metrictrail` feature's editable path packages. dpvo (MetricTrail's DPVO,
# dpvo.metric, behind vipe-src's vipe.metrictrail.dpvo shims; metrictrail.capture observes it through dpvo.hooks) is a
# workspace package, pinned below.
dependencies = ["dpvo", "trtkit", "vipe-mojo"]

[tool.uv.sources]
dpvo = { path = "../dpvo", editable = true }
trtkit = { path = "../trtkit", editable = true }
vipe-mojo = { path = "../vipe-mojo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrictrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e metrictrail-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e metrictrail-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
# The python-conventions skill requires typing.TypeAlias (PEP 695 `type` is banned); beartype flags it as deprecated.
filterwarnings = ["ignore::beartype.roar.BeartypeDecorHintPep613DeprecationWarning"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["metrictrail", "tools", "tests"]
exclude = ["*/.pixi/*", "*/__pycache__/*"]
min_confidence = 80
# Framework-used names: pytest's module marker.
ignore_names = ["pytestmark", "solver_verbose"]
