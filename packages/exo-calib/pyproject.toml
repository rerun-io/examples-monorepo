[project]
name = "exo-calib"
version = "0.1.0"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    # catalog-common: numpy, scipy, jaxtyping, rerun-sdk, huggingface_hub,
    #                 hf-transfer, tqdm, pyserde, av, opencv
    # conda (pixi feature): open3d, torchcodec; pypi: kornia-rs (bundle adjustment)
    # monopriors / posekit / simplecv are workspace siblings, pinned to their paths in [tool.uv.sources] below.
    "monopriors",
    "posekit",
    "simplecv",
    "tyro>=0.9.1",
]

# Workspace siblings named above resolve to their in-repo path (never to a PyPI
# namesake); the root manifest installs the same paths editable.
[tool.uv.sources]
monopriors = { path = "../monoprior", editable = true }
posekit = { path = "../posekit", editable = true }
simplecv = { path = "../simplecv", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exo_calib"]

[tool.ruff]
line-length = 150

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e exo-calib-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e exo-calib-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # PEP 695 `type` does not parse on our Python 3.10/3.11 envs, and beartype errors name only the alias, not the shape
    "UP046",  # PEP 695 type parameters do not parse on Python 3.10/3.11 either
]

[tool.vulture]
paths = ["exo_calib", "tests"]
# Tyro-facing entry points (the CLI shims call them), dagkit node/sink protocol members the runners call, names used only
# in string casts or fakes (TYPE_CHECKING imports, MoGe's K_33 keyword), pytestmark, the eval.json
# dataclass fields (serialized by pyserde), and the verify hooks run/score (VERIFY.toml names them for dagkit.verify).
ignore_names = ["main", "run", "score", "pytestmark", "K_33", "PersonDetector", "RtmPose2d", "inputs", "outputs", "reset", "step", "flush", "contents", "from_layer", "to_rerun", "mean_abs", "max_abs", "se3", "sim3", "focal_error_pct", "camera_names", "refinement_diagnostics", "camera_centers_m", "pairwise_distance_m", "segment_id", "dataset_name", "per_camera", "median", "rotation_deg", "translation_cm", "scale"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
