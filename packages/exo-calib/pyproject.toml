[project]
name = "exo-calib"
version = "0.1.0"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    # catalog-common: numpy, scipy, jaxtyping, rerun-sdk, huggingface_hub,
    #                 hf-transfer, tqdm, pyserde, av, opencv, simplecv
    # conda (pixi feature): pycolmap, open3d, torchcodec
    "monopriors",
    "posekit",
    "tyro>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exo_calib"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # Beartype requires TypeAlias, not PEP 695 type
    "UP046",  # Same reason: beartype needs Generic[TypeVar], not PEP 695 type params
]

[tool.vulture]
paths = ["exo_calib", "tests"]
# Tyro-facing verb entry points; the CLI shims call them.
ignore_names = ["main"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
