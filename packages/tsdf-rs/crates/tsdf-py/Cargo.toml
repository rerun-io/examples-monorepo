[package]
name = "tsdf-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "PyO3 bindings for the tsdf core, built by maturin as the `tsdf_rs` module."

[lints]
workspace = true

[lib]
name = "tsdf_rs"
path = "src/lib.rs"
crate-type = ["cdylib"]
# Exercised from Python (packages/metrictrail/tests); a Rust test binary would link libpython.
test = false
doctest = false

[dependencies]
tsdf.workspace = true
numpy.workspace = true
# No `extension-module` feature (deprecated in PyO3 0.29): maturin sets PYO3_BUILD_EXTENSION_MODULE and passes the
# macOS `-undefined dynamic_lookup` link arguments itself.
pyo3 = { workspace = true, features = ["abi3-py312"] }
