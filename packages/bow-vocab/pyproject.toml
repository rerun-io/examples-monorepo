[build-system]
# >= 1.9.4: sets PYO3_BUILD_EXTENSION_MODULE, which replaces PyO3's extension-module feature.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "bow-vocab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/bow-vocab-py/Cargo.toml"
module-name = "bow_vocab"
# bow_vocab.pyi (next to this file) ships as bow_vocab/__init__.pyi with py.typed.
