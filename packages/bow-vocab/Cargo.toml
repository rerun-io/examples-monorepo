# bow-vocab Cargo workspace: the PyO3 module `bow_vocab` (`crates/bow-vocab-py`) over kornia-staging-bow's seeded
# k-means vocabulary for float descriptors, TF-IDF bags of words and inverted-file L1 scores. The core lives in
# kornia-staging; this workspace is only the binding, as packages/insta360-io's is for its core. maturin builds the
# module from crates/bow-vocab-py (pyproject.toml, recipe.yaml). No GPU and no CubeCL, so no patched dependencies.
[workspace]
resolver = "2"
members = ["crates/bow-vocab-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[workspace.dependencies]
kornia-bow = "0.2"
kornia-staging-bow = { path = "../kornia-staging/crates/kornia-staging-bow" }
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.12"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
