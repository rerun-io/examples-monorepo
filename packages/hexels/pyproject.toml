[project]
name = "hexels-bench"
version = "0.1.0"
description = "Hexels beside Brush: upstream checkpoint export to hexel PLY, protocol training (Hexels and Brush), published-checkpoint renders, the shared NVS scorer, the benchmark queue and its tables"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
# Static metadata only. Upstream Hexels, its CUDA kernels and Image-GS come from the
# `packages/hexels-src` conda outputs; torch comes from the `cuda` feature.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hexels_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e hexels-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e hexels-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["hexels_bench", "tools", "tests"]
exclude = ["*/.pixi/*", "*/__pycache__/*"]
min_confidence = 80
# Framework-used names: __exit__ arguments.
ignore_names = ["exc"]
