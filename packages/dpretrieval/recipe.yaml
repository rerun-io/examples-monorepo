# rattler-build recipe for dpretrieval: ORB image retrieval for DPV-SLAM's classical loop closure. DBoW2's vocabulary
# tree and database and OpenCV's cross-checked Hamming matcher are Rust (crates/dbow, pyo3 module dpretrieval._core);
# ORB detection is OpenCV's, through cv2. maturin builds the module from crates/dpretrieval-py (pyproject.toml).
package:
  name: dpretrieval
  version: "0.2.0"

source:
  - path: .
    filter:
      exclude:
        - target/**
        - .pixi/**
        - '**/__pycache__/**'

build:
  number: 0
  script:
    # pixi reuses the host prefix across source builds, and files left there are packaged: drop an earlier install,
    # including the pybind11 module (dpretrieval.cpython-312-*.so) of the C++ build, which would shadow the package.
    - export SP_DIR="$(${{ PYTHON }} -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
    - rm -rf "$SP_DIR/dpretrieval" "$SP_DIR"/dpretrieval-*.dist-info "$SP_DIR"/dpretrieval.cpython-*.so
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('rust') }}
    # The C compiler links the extension; no stdlib('c'): it would pin a sysroot to the workspace's glibc 2.35.
    - ${{ compiler('c') }}
  host:
    - python 3.12.*
    - pip
    - maturin >=1.9.4,<2
  run:
    - python 3.12.*
    - numpy
    - py-opencv
    - jaxtyping

tests:
  - python:
      imports:
        - dpretrieval
      pip_check: false
