# rattler-build recipe for dpretrieval
# Builds DBoW2 (bag-of-words image retrieval) as a static library and links it
# into a pybind11 Python extension module for ORB-based loop closure detection.
package:
  name: dpretrieval
  version: "0.1.0"

source:
  path: .

build:
  number: 1
  script:
    # Clone the DBoW2 library at a pinned commit (Lipson's fork used by DPV-SLAM)
    - git clone https://github.com/lahavlipson/DBoW2.git DBoW2
    - cd DBoW2 && git checkout 89f8b270270fa68a399c10cd90427a9f7ec4fa81 && cd ..
    # Name the host prefix's Python: on macOS, CMake and pybind11 otherwise find Xcode's Python 3.9 first and
    # install a cpython-39 module into the Xcode framework.
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DPython_EXECUTABLE=$PYTHON -DPYTHON_EXECUTABLE=$PYTHON -GNinja
    - cmake --build build
    - cmake --install build

requirements:
  build:
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
    - git
  host:
    - python 3.12.*
    - pybind11
    - libopencv <5  # OpenCV 5 dropped/moved features2d; DBoW2's find_package needs the v4 layout
  run:
    - python 3.12.*
    - libopencv <5  # OpenCV 5 dropped/moved features2d; DBoW2's find_package needs the v4 layout
