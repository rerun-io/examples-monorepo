# rattler-build recipe for dpretrieval: ORB image retrieval for DPV-SLAM's classical loop closure, on kornia-rs
# (pyo3 module dpretrieval._core in crates/dpretrieval-py: kornia-bow vocabulary and bags of words, kornia-imgproc's
# cross-checked matcher, kornia-staging-bow's inverted-file database); ORB detection is OpenCV's, through cv2.
# maturin builds the module (pyproject.toml).
package:
  name: dpretrieval
  version: "0.3.0"

source:
  # The two packages keep their relative layout, so the Cargo path dependency on packages/kornia-staging
  # (../kornia-staging/crates/kornia-staging-bow) resolves as in the repository. pixi rebuilds on changes under
  # packages/dpretrieval only; after editing kornia-staging-bow, bump the build number.
  - path: .
    target_directory: dpretrieval
    filter:
      exclude:
        - target/**
        - .pixi/**
        - '**/__pycache__/**'
  - path: ../kornia-staging
    target_directory: kornia-staging
    filter:
      exclude:
        - target/**
        - .pixi/**
        - fixtures/**
        - '**/__pycache__/**'

build:
  number: 0
  script:
    # pixi reuses the host prefix across source builds, and files left there are packaged: drop an earlier install,
    # including the pybind11 module (dpretrieval.cpython-312-*.so) of the C++ build, which would shadow the package.
    - export SP_DIR="$(${{ PYTHON }} -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
    - rm -rf "$SP_DIR/dpretrieval" "$SP_DIR"/dpretrieval-*.dist-info "$SP_DIR"/dpretrieval.cpython-*.so
    - cd dpretrieval && ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('rust') }}
    # The C compiler links the extension; no stdlib('c'): it would pin a sysroot to the workspace's glibc 2.35.
    - ${{ compiler('c') }}
  host:
    - python 3.12.*
    - pip
    - maturin >=1.9.4,<2
  run:
    - python 3.12.*
    - numpy
    - py-opencv
    - jaxtyping

tests:
  - python:
      imports:
        - dpretrieval
      pip_check: false
