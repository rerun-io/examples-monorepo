[project]
name = "pipelines"
version = "0.1.0"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
description = "End-to-end flows over stage packages: each step a stage's pixi task in its own process, the catalog layer the only hand-off"
dependencies = ["simplecv", "tyro>=0.9.1"]

[tool.uv.sources]
simplecv = { path = "../simplecv", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # TypeAlias, not PEP 695 aliases (python-conventions)
]

[tool.vulture]
paths = ["pipelines", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60

[tool.pytest.ini_options]
# pytest-beartype: beartype checks pipelines only while pytest runs (AGENTS.md, Beartype).
beartype_packages = ["pipelines"]
# A package imported before pytest-beartype's hook (e.g. by tests/conftest.py) would go unchecked: fail instead.
filterwarnings = ["error::pytest_beartype.roar.PytestBeartypeOptionPackagesWarning"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e pipelines-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e pipelines-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
