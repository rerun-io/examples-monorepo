# Runtime SLAM settings. Recordings and their geometry are read from the catalog.
# Sensor calibration and applied timestamp corrections are read from the catalog.

schema_version = 2
catalog_url = "rerun+http://127.0.0.1:51235"

[[dataset]]
name = "msd-index"
vio_config = "configs/msdmi_config.json"

[[dataset]]
name = "msd-g2"
vio_config = "configs/msdmg_config.json"

[[dataset]]
name = "msd-odyssey"
vio_config = "configs/msdmo_config.json"

# EuRoC MAV (RootSLAM's EMH/EV1/EV2) as VSLAM-LAB's dataforge conversion; its video_time is the benchmark clock.
# The conversion keeps cam1 by frame count, not by stamp, so framesets are matched (1 ms; the cameras run at 20 Hz).
# Known data issue: MH_04 loses one stereo pair and V2_03 its last 295 (1626 of 1921 fed, completion 0.83).
[[dataset]]
name = "vslam-lab-euroc"
vio_config = "configs/euroc_config.json"
video_time_is_absolute = true
frameset_tolerance_ns = 1_000_000

# TUM-VI 512x512 16-bit (RootSLAM's TC/TM/TR/TS) as dataforge's tum-vi conversion: KB4 stereo, imu_config.yaml's noise
# model, the dataset's own clock on video_time. The conversion keeps only frames both cameras share, so framesets match exactly.
[[dataset]]
name = "tum-vi"
vio_config = "configs/tumvi_config.json"
video_time_is_absolute = true

[robocap]
device_id = "f408193e6447b3b0"
vio_config = "configs/msdmo_config.json"
calibration = "configs/robocap_calib_downscale3.json"


# TartanAir V2 (dataforge `tartanair`): one trajectory, three camera sets.
# The configs differ in more than the camera model, so a comparison across them includes these tuning
# differences: `optical_flow_matching_default_depth` is 10.0 for pinhole and 2.0 for fisheye (the
# pinhole value was raised because the 2 m default lost the stereo matches on the OldTown street scene).
[[dataset]]
name = "tartanair-pinhole"
vio_config = "configs/tartanair_pinhole_config.json"

[[dataset]]
name = "tartanair-fisheye"
vio_config = "configs/tartanair_fisheye_config.json"

# Insta360 X4 Air (dataforge insta360, mei_v6 cameras) as a plain two-lens rig. The name is the segment-id prefix
# (`insta360__<clip>`), which is how replay and catalog_layer find a segment's dataset.
[[dataset]]
name = "insta360"
vio_config = "configs/insta360_native_config.json"
