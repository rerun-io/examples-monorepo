# Runtime SLAM settings. Recordings and their geometry are read from the catalog.
# Sensor calibration and applied timestamp corrections are read from the catalog.

schema_version = 2
catalog_url = "rerun+http://127.0.0.1:51235"

[[dataset]]
name = "msd-index"
vio_config = "configs/msdmi_config.json"

[[dataset]]
name = "msd-g2"
vio_config = "configs/msdmg_config.json"

[[dataset]]
name = "msd-odyssey"
vio_config = "configs/msdmo_config.json"

# EuRoC MAV (RootSLAM's EMH/EV1/EV2) as VSLAM-LAB's dataforge conversion; its video_time is the benchmark clock.
# The conversion keeps cam1 by frame count, not by stamp, so framesets are matched (1 ms; the cameras run at 20 Hz).
# Known data issue: MH_04 loses one stereo pair and V2_03 its last 295 (1626 of 1921 fed, completion 0.83).
[[dataset]]
name = "vslam-lab-euroc"
vio_config = "configs/euroc_config.json"
video_time_is_absolute = true
frameset_tolerance_ns = 1_000_000

[robocap]
device_id = "f408193e6447b3b0"
vio_config = "configs/msdmo_config.json"
calibration = "configs/robocap_calib_downscale3.json"

