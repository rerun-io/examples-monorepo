# Runtime SLAM settings. Recordings and their geometry are read from the catalog.
# Sensor calibration and applied timestamp corrections are read from the catalog.

schema_version = 2
catalog_url = "rerun+http://127.0.0.1:51235"

[[dataset]]
name = "msd-index"
vio_config = "configs/msdmi_config.json"

[[dataset]]
name = "msd-g2"
vio_config = "configs/msdmg_config.json"

[[dataset]]
name = "msd-odyssey"
vio_config = "configs/msdmo_config.json"

[robocap]
device_id = "f408193e6447b3b0"
vio_config = "configs/msdmo_config.json"
calibration = "configs/robocap_calib_downscale3.json"


# TartanAir V2 (dataforge `tartanair`): one trajectory, three camera sets.
# The three configs differ in more than the camera model, so a comparison across them includes these tuning
# differences: `optical_flow_matching_default_depth` is 10.0 for pinhole and 2.0 for fisheye and equirect (the
# pinhole value was raised because the 2 m default lost the stereo matches on the OldTown street scene), and
# `optical_flow_detection_grid_size` is 64 for equirect and 50 for pinhole and fisheye.
[[dataset]]
name = "tartanair-pinhole"
vio_config = "configs/tartanair_pinhole_config.json"

[[dataset]]
name = "tartanair-fisheye"
vio_config = "configs/tartanair_fisheye_config.json"

[[dataset]]
name = "tartanair-equirect"
vio_config = "configs/tartanair_equirect_config.json"

# Insta360 X4 Air (dataforge insta360, mei_v6 cameras): the same .rrd through the panorama lane (two lenses stitched into two
# hemisphere tiles, two-centre extrinsics, rolling-shutter corrected keypoints) and as a plain two-lens KB4 rig.
[[dataset]]
name = "insta360"
vio_config = "configs/insta360_config.json"

[[dataset]]
name = "insta360-native"
vio_config = "configs/insta360_native_config.json"
