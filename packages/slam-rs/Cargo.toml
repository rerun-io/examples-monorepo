# slam-rs Cargo workspace: a pure-Rust VIO core, its PyO3 extension module and a
# native CLI. Self-contained with a committed lockfile, like
# packages/gsplat-rust-renderer, and never built during `pixi lock` /
# `pixi install` — the `slam-rs-build` pixi task compiles it explicitly.
[workspace]
resolver = "3"
members = ["crates/slam-rs", "crates/slam-rs-py", "crates/slam-rs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
slam-rs = { path = "crates/slam-rs" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
nalgebra = "0.35"
numpy = "0.29"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes the JSON float parser correctly rounded, like the
# `strtod` cereal uses on the C++ side. Without it several calibration and
# config values land one ulp off the double basalt reads from the same file,
# which is exactly the kind of difference the accuracy gate must not measure.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# The frontend's only parallelism. Used through `frontend::parallel::WorkPool`,
# which builds an explicitly sized pool: the ambient global pool is forbidden
# (decision D31), because its width would decide the reduction shape.
rayon = "1"
# dev-only
approx = "0.5"
proptest = "1"
# A runtime dependency from the frontend on: `kornia_imgproc::features::
# fast_detect_rect_u8` is the FAST kernel behind basalt's grid detector
# (decision D09, D20). It doubles as the pyramid's test oracle (`pyrdown_u8`,
# decision D08). Pinned by exact git rev with default features off; kornia's
# CUDA features are never enabled, because GPU work here is CubeCL only (T04).
kornia-image = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }

# The GPU phase (decision D21, V4). CubeCL 0.10 stable: one kernel source, the
# runtime a type parameter. `cubecl-cuda` is the NVIDIA lane and `cubecl-wgpu`
# the portable one; both are optional, so the default build of every crate here
# is the CPU port with no GPU dependency in the graph at all.
cubecl = "0.10"
cubecl-cuda = "0.10"
# No `features` here: which shader compiler cubecl-wgpu builds is decided per
# target in `crates/slam-rs/Cargo.toml`, because `spirv` and `msl` are not the
# same lane on the same platform (see the two target sections there).
cubecl-wgpu = "0.10"

# What the availability probe reads before any CubeCL client is constructed:
# CubeCL 0.10 unwraps its own bring-up, so the only way an absent GPU becomes a
# typed error rather than a panic is to ask the runtimes themselves first. Both
# are already in the graph — `cudarc` under `cubecl-cuda`, `wgpu` under
# `cubecl-wgpu` — and both are declared here with a feature subset of what those
# two ask for, so naming them adds no crate and changes no compiled feature set.
# `libloading` is what the probe dlopens with, which is what cudarc does before
# it panics.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "fallback-dynamic-loading"] }
libloading = "0.9"
wgpu = { version = "29", default-features = false }

# The estimator must never panic on data: errors are typed and returned.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The test suite is dominated by two things an unoptimized build makes ten
# times slower than they need to be: 960x960 KLT pyramids, and the oracle
# replays of a dense LM loop. Optimizing the dev and test profiles moved
# `cargo test -p slam-rs` from 15.1 s to 0.74 s and the whole-pipeline test
# from 14.2 s to 0.31 s, which is what lets that test and the whole
# 60-frameset oracle window run in the default lane. A cold build costs 31 s
# once.
#
# Floating-point semantics do not depend on the optimization level — rustc
# never contracts or reassociates — and every oracle fixture still compares
# exactly, which is the evidence for that here rather than an appeal to the
# reference.
#
# `2`, not `3`: `.cargo/config.toml` records opt-level 3 crashing rustc's LLVM
# while compiling faer on aarch64. faer has since left the graph; the override
# there is kept until an aarch64 host re-tests it, and this level follows it.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

# kornia-rs' release profile: the hot loops are small functions that have to
# inline across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
