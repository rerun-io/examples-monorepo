# slam-rs Cargo workspace: a pure-Rust VIO core, its PyO3 extension module and a
# native CLI. Self-contained with a committed lockfile, like
# packages/gsplat-rust-renderer, and never built during `pixi lock` /
# `pixi install` — the `slam-rs-build` pixi task compiles it explicitly.
[workspace]
resolver = "3"
members = ["crates/slam-rs", "crates/slam-rs-py", "crates/slam-rs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
slam-rs = { path = "crates/slam-rs" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
nalgebra = "0.35"
numpy = "0.29"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
# Correctly rounded parsing preserves calibration and config values across JSON round trips.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# The frontend's only parallelism. Used through `frontend::parallel::WorkPool`,
# which builds an explicitly sized pool: the ambient global pool is forbidden
# (decision D31), because its width would decide the reduction shape.
rayon = "1"
# dev-only
approx = "0.5"
proptest = "1"
# FAST detection runs inside the frontend's grid. The pyramid tests also
# compare with the independent `pyrdown_u8` kernel. Pin the revision and disable
# upstream GPU features: this crate supplies its own CubeCL GPU implementation.
kornia-image = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }

# SO(3)'s exp, log, matrix, inverse and action, at the same pinned rev. Already
# in the lockfile as a dependency of `kornia-imgproc`; naming it here makes the
# edge direct. `crate::lie` routes `So3` through `SO3F32`/`SO3F64` and keeps the
# rest — SE(3), the decoupled pair, `apply_inc`, the four pose Jacobians —
# because upstream's are `f32`-only or coupled (S33 audit A, row 5).
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", rev = "e2148e864a1b63a8fe094b89175273ef08823183", default-features = false }

# The GPU phase (decision D21, D70). CubeCL 0.11 prerelease with the optional
# wgpu runtime; the default CPU build has no GPU dependency.
cubecl = "=0.11.0-pre.3"
# No `features` here: which shader compiler cubecl-wgpu builds is decided per
# target in `crates/slam-rs/Cargo.toml`, because `spirv` and `msl` are not the
# same lane on the same platform (see the two target sections there).
cubecl-wgpu = "=0.11.0-pre.3"

# Probe wgpu before constructing a CubeCL client, whose bring-up can panic.
# This feature subset adds nothing to cubecl-wgpu's compiled feature set.
wgpu = { version = "30", default-features = false }

# The estimator must never panic on data: errors are typed and returned.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Optimize the image pyramids, KLT tracker and dense LM loop so complete
# pipeline tests can run in the default suite. Keep the same optimization
# level for dev and test builds.
#
# `2`, not `3`: `.cargo/config.toml` records opt-level 3 crashing rustc's LLVM
# while compiling faer on aarch64. faer has since left the graph; the override
# there is kept until an aarch64 host re-tests it, and this level follows it.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

# kornia-rs' release profile: the hot loops are small functions that have to
# inline across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
