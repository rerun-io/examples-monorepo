# slam-rs Cargo workspace: a pure-Rust VIO core, its PyO3 extension module and a
# native CLI. Self-contained with a committed lockfile, like
# packages/gsplat-rust-renderer, and never built during `pixi lock` /
# `pixi install` — the `slam-rs-build` pixi task compiles it explicitly.
[workspace]
resolver = "3"
members = ["crates/slam-rs", "crates/slam-rs-py", "crates/slam-rs-cli", "crates/robocap-recorder"]
# Run the patched dependency's own unit tests as a standalone crate.
exclude = ["target/patch/cubecl-wgpu-0.11.0-pre.3", "target/patch/cubecl-common-0.11.0-pre.3", "target/patch/cubecl-spirv-0.11.0-pre.3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
kornia-staging-3d = { path = "../kornia-staging/crates/kornia-staging-3d", features = ["serde"] }
kornia-staging-algebra = { path = "../kornia-staging/crates/kornia-staging-algebra" }
kornia-staging-imgproc = { path = "../kornia-staging/crates/kornia-staging-imgproc" }
anyhow = "1"
libc = "0.2"
cc = "1"
slam-rs = { path = "crates/slam-rs" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
nalgebra = "0.35"
numpy = "0.29"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
# Correctly rounded parsing preserves calibration and config values across JSON round trips.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# The frontend's only parallelism. Used through `frontend::parallel::WorkPool`,
# which builds an explicitly sized pool: the ambient global pool is forbidden
# (decision D31), because its width would decide the reduction shape.
rayon = "1"
# dev-only
approx = "0.5"
proptest = "1"
# FAST detection runs inside the frontend's grid. The pyramid tests also
# compare with the independent `pyrdown_u8` kernel. Disable
# upstream GPU features: this crate supplies its own CubeCL GPU implementation.
kornia-image = { version = "0.2", default-features = false }
kornia-imgproc = { version = "0.2", default-features = false }

# SO(3)'s exp, log, matrix, inverse and action, at the same crates.io release. Already
# in the lockfile as a dependency of `kornia-imgproc`; naming it here makes the
# edge direct. `crate::lie` routes `So3` through `SO3F32`/`SO3F64` and keeps the
# rest — SE(3), the decoupled pair, `apply_inc`, the four pose Jacobians —
# because upstream's are `f32`-only or coupled (S33 audit A, row 5).
kornia-algebra = { version = "0.2", default-features = false }

# The GPU phase (decision D21, D70). CubeCL 0.11 prerelease with the optional
# wgpu runtime; the default CPU build has no GPU dependency.
cubecl = "=0.11.0-pre.3"
# No `features` here: which shader compiler cubecl-wgpu builds is decided per
# target in `crates/slam-rs/Cargo.toml`, because `spirv` and `msl` are not the
# same lane on the same platform (see the two target sections there).
cubecl-wgpu = "=0.11.0-pre.3"

# Probe wgpu before constructing a CubeCL client, whose bring-up can panic.
# This feature subset adds nothing to cubecl-wgpu's compiled feature set.
wgpu = { version = "30", default-features = false }

# The estimator must never panic on data: errors are typed and returned.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Optimize the image pyramids, KLT tracker and dense LM loop so complete
# pipeline tests can run in the default suite. Keep the same optimization
# level for dev and test builds.
#
# `2` keeps test builds quick to compile; release builds take `3` on every
# target (the aarch64 override that held them at 2, for an LLVM crash in faer,
# is gone with faer).
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2

# kornia-rs' release profile: the hot loops are small functions that have to
# inline across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1

# Replace the idle device-channel 150 µs backoff with notified parking:
# Mac two-camera seam 10.81 -> 3.34 ms; RTX 5090 stereo 0.378 -> 0.231 ms.
# Source patch: patches/cubecl-common-0.11.0-pre.3-channel-park.patch.
# The slam-rs-patch-deps Pixi task creates this manifest-relative directory;
# CARGO_TARGET_DIR does not move target/patch.
# Bare cargo before preparation fails with:
# error: failed to load source for dependency `cubecl-common`
# Caused by: failed to read `<package>/target/patch/cubecl-common-0.11.0-pre.3/Cargo.toml`
# Caused by: No such file or directory (os error 2)
# Fix: pixi run -e slam-rs-dev slam-rs-patch-deps
# rust-analyzer: run that command once per checkout before opening the workspace.
# (macOS: use -e slam-rs-osx-dev).
# Bump: update version + archive sha256 in slam_rs/apis/prepare_patched_deps.py,
# rebase the patch, update this path and the Pixi patch-test command, run the prepare
# task, then regenerate Cargo.lock with cargo update -p cubecl-common -p cubecl-spirv.
[patch.crates-io]
cubecl-wgpu = { path = "target/patch/cubecl-wgpu-0.11.0-pre.3" }
cubecl-common = { path = "target/patch/cubecl-common-0.11.0-pre.3" }
# Source patch: patches/cubecl-spirv-0.11.0-pre.3-shared-implicit-pointer.patch (Mali: shared memory
# without VK_KHR_workgroup_memory_explicit_layout). Prepared by the same task; bump it the same way.
cubecl-spirv = { path = "target/patch/cubecl-spirv-0.11.0-pre.3" }
