# slam-rs Cargo workspace: a pure-Rust VIO core, its PyO3 extension module and a
# native CLI. Self-contained with a committed lockfile, like
# packages/gsplat-rust-renderer, and never built during `pixi lock` /
# `pixi install` — the `slam-rs-build` pixi task compiles it explicitly.
[workspace]
resolver = "3"
members = ["crates/slam-rs", "crates/slam-rs-py", "crates/slam-rs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
slam-rs = { path = "crates/slam-rs" }
clap = { version = "4", features = ["derive"] }
log = "0.4"
nalgebra = "0.35"
numpy = "0.29"
pyo3 = "0.29"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes the JSON float parser correctly rounded, like the
# `strtod` cereal uses on the C++ side. Without it several calibration and
# config values land one ulp off the double basalt reads from the same file,
# which is exactly the kind of difference the accuracy gate must not measure.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# The marginalization QR and the final dense solve will use faer, pinned to
# kornia-rs's exact version so the graph never holds two copies (decision D07).
# Declared now, used by the linearization PR; nothing depends on it yet.
faer = "=0.24.4"
# dev-only
approx = "0.5"
proptest = "1"

# The estimator must never panic on data: errors are typed and returned.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# kornia-rs' release profile: the hot loops are small functions that have to
# inline across crate boundaries.
[profile.release]
lto = "thin"
codegen-units = 1
