context:
  # The core output's files in slam_rs/: the abi3 extension and the modules that run on numpy + rerun-sdk. The catalog
  # output gets every other file, so a new module lands in exactly one output.
  core_files: __init__.py rig.py columns.py frontend_log.py config.py machine.py _core.so _core.pyi py.typed

recipe:
  name: slam-rs
  version: "0.1.0"

source:
  - path: .
    target_directory: slam-rs
    filter:
      exclude:
        - target/**
        - data/**
        - .pixi/**
        - '**/__pycache__/**'
        - slam_rs/_core.so
  - path: ../kornia-staging
    target_directory: kornia-staging
    filter:
      exclude:
        - target/**
        - .pixi/**
        - '**/__pycache__/**'

outputs:
  - package:
      name: slam-rs
    build:
      script:
        - cd slam-rs
        - export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
        - cd ../kornia-staging
        - python -m scripts.prepare_patched_deps
        - cd ../slam-rs
        - cargo build --release -p slam-rs-py --locked --features gpu-wgpu
        - python -m pip install . --no-deps --no-build-isolation -vv
        - export SP_DIR="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
        - if: osx
          then: cp target/release/lib_core.dylib "$SP_DIR/slam_rs/_core.so"
          else: cp target/release/lib_core.so "$SP_DIR/slam_rs/_core.so"
        - (cd "$SP_DIR/slam_rs" && for entry in *; do case " ${{ core_files }} " in *" $entry "*) ;; *) rm -rf "$entry" ;; esac; done)
    requirements:
      build:
        - ${{ compiler('c') }}
        - rust 1.98.*
        - git
      host:
        - python 3.12.*
        - pip
        - hatchling
        - tyro
      run:
        - python 3.12.*
        - numpy
        - jaxtyping
        - rerun-sdk ==0.42.0
        - pyserde >=0.31.2,<0.32
        - tomli-w >=1.2,<2
        - orjson >=3.11,<4
    tests:
      - python:
          imports: [slam_rs, slam_rs.rig, slam_rs.frontend_log, slam_rs.config]
          pip_check: false

  - package:
      name: slam-rs-catalog
    build:
      script:
        - cd slam-rs
        - python -m pip install . --no-deps --no-build-isolation -vv
        - export SP_DIR="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
        - (cd "$SP_DIR/slam_rs" && rm -f ${{ core_files }})
        - rm -rf "$SP_DIR"/slam_rs-*.dist-info "$SP_DIR/slam_rs/__pycache__"
    requirements:
      host:
        - python 3.12.*
        - pip
        - hatchling
      run:
        - python 3.12.*
        - ${{ pin_subpackage('slam-rs', exact=True) }}
        # simplecv and dataforge are workspace PyPI path deps supplied by the consumer.
        - tyro >=0.9.1,<0.10
        - scipy
        - pyarrow
        - datafusion
        - av
        - py-opencv
        - pytorch
    tests:
      - script:
          - test -f "$SP_DIR/slam_rs/catalog_feed.py"
          - test -d "$SP_DIR/slam_rs/apis"
