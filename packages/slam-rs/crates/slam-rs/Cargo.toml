[package]
name = "slam-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Visual-inertial odometry core: no Python, no Rerun, no GPU."

[lib]
name = "slam_rs"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The CubeCL GPU frontend on the NVIDIA lane. Off by default: the CPU port is
# what the fleet installs and what the pixi lock covers.
gpu = ["dep:cubecl", "dep:cubecl-cuda"]
# The same kernels through wgpu (Vulkan / Metal / DX12), for the Spark, the
# Pi 5 and the cap. Only the client line differs; `cargo check --features
# gpu-wgpu` is what keeps that true.
gpu-wgpu = ["gpu", "dep:cubecl-wgpu"]

[dependencies]
cubecl = { workspace = true, optional = true }
cubecl-cuda = { workspace = true, optional = true }
cubecl-wgpu = { workspace = true, optional = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
proptest = { workspace = true }
