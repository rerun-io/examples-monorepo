[package]
name = "slam-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Visual-inertial odometry core: no Python, no Rerun; the GPU frontend is an off-by-default cargo feature."

[lib]
name = "slam_rs"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# The kernels, stage backends and seam. Internal: enable `gpu-wgpu` to
# select the runtime as well.
gpu-core = ["dep:kornia-staging-gpu", "dep:cubecl"]
# The CubeCL frontend through wgpu (Vulkan / Metal / DX12), off by default.
# `slam-rs-wgpu-test` checks the kernels on the device.
# Compiler selection and storage alignment belong to kornia-staging-gpu.
gpu-wgpu = ["gpu-core", "kornia-staging-gpu/wgpu"]

[dependencies]
kornia-staging-gpu = { workspace = true, optional = true }
bytes.workspace = true
kornia-staging-slam.workspace = true
kornia-staging-3d.workspace = true
kornia-staging-algebra.workspace = true
kornia-staging-imgproc.workspace = true
cubecl = { workspace = true, optional = true }
kornia-image = { workspace = true }
kornia-imgproc = { workspace = true }
kornia-algebra = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
kornia-staging-imgproc = { workspace = true, features = ["test-fixtures"] }
approx = { workspace = true }
proptest = { workspace = true }
