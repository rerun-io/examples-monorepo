[package]
name = "robocap-recorder"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
gstreamer-capture = ["dep:gstreamer", "dep:gstreamer-app"]
live-slam = ["dep:slam-rs"]

[dependencies]
anyhow = "1"
arrow-array = "58.3"
libc = "0.2"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
slam-rs = { workspace = true, optional = true }
re_build_info = "=0.37.0"
re_log_encoding = { version = "=0.37.0", features = ["encoder", "decoder"] }
re_log_types = "=0.37.0"
rerun = { version = "=0.37.0", default-features = false, features = ["sdk"] }
gstreamer = { version = "0.24", features = ["v1_24"], optional = true }
gstreamer-app = { version = "0.24", features = ["v1_24"], optional = true }

[build-dependencies]
cc = "1"

[[bin]]
name = "robocap-direct"
path = "src/bin/robocap-direct.rs"
required-features = ["gstreamer-capture"]

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
re_log_encoding = { version = "=0.37.0", features = ["decoder"] }
tempfile = "3"

[[example]]
name = "validate_cap_fixture"
required-features = ["gstreamer-capture"]

[[example]]
name = "compare_live_adapter"
required-features = ["live-slam"]

[lints]
workspace = true
