[package]
name = "slam-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native runner for the slam-rs core, usable with no Python at all."

[[bin]]
name = "slam-rs"
path = "src/main.rs"

[features]
catalog = ["dep:anyhow", "dep:arrow", "dep:re_protos", "dep:re_log_encoding", "dep:re_chunk", "dep:tonic", "dep:tokio", "kornia-staging-io/decoder", "dep:kornia-image", "dep:kornia-staging-imgproc"]
# The CubeCL frontend through wgpu, for `replay --lane gpu`.
gpu-wgpu = ["slam-rs/gpu-wgpu"]

[dependencies]
kornia-staging-io = { workspace = true, optional = true }
kornia-image = { workspace = true, optional = true }
kornia-staging-imgproc = { workspace = true, optional = true }
slam-rs = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Same narrow protocol/decoder dependency set as the catalog spike; no DataFusion.
anyhow = { workspace = true, optional = true }
arrow = { version = "=58.4.0", default-features = false, optional = true }
re_protos = { version = "=0.38.1", default-features = false, optional = true }
re_log_encoding = { version = "=0.38.1", default-features = false, optional = true }
re_chunk = { version = "=0.38.1", default-features = false, optional = true }
tonic = { version = "=0.14.6", default-features = false, features = ["transport"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
