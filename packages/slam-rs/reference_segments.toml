# RoboCap session 15: the hard six-camera fisheye rig and the deployment target.
# It has no ground truth, so its metric is agreement with the basalt C++ output
# rather than ATE against GT. Two basalt references exist: the `slam` layer on
# the NAS (1,588 poses, the persisted 4-camera 640x360 replay) and the checked-in
# fixture pair under `tests/reference/robocap-s15/`.
#
# RoboCap is not registered on any running catalog server; both layers are read
# from the NAS `.rrd` files, served in process.
[robocap]
session_id = "s00000015"
device_id = "f408193e6447b3b0"
segment_id = "robocap__f408193e6447b3b0__s00000015"
base_url = "file:///mnt/nas/datasets/robocap/rrd/base/robocap__f408193e6447b3b0__s00000015.rrd"
slam_url = "file:///mnt/nas/datasets/robocap/rrd/slam/robocap__f408193e6447b3b0__s00000015.rrd"
has_ground_truth = false
decode_path = "cpu_gray8_dav1d_1thread"
basalt_num_poses = 1588

[robocap.imu]
rate_hz = 200.0
gyro_noise_std = 0.0007300442812547
accel_noise_std = 0.005955224218014
gyro_bias_std = 3.445397083168e-05
accel_bias_std = 0.0001963150489218
cam_time_offset_ns = 14902432

# Checked-in basalt C++ outputs for session 15, copied from the fork's gate run.
# `golden` is the machine-local trajectory the fork gates against; `candidate` is
# a fresh file-fed run of the same session. Comparing them reproduces the fork's
# published gate numbers, which is what `tests/test_trajectory_fixtures.py` asserts.
[robocap.fixtures]
golden = "tests/reference/robocap-s15/traj_s15_vga.csv"
candidate = "tests/reference/robocap-s15/vit_files_trajectory.csv"
expected_ate_rmse_cm = 0.13
expected_associated = 1588
