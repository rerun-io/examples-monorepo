# Reference set for slam-rs accuracy work: ten Monado SLAM Dataset segments.
#
# The set is motion-stratified over the two catalog datasets (five `msd-index`
# stereo KB4 segments, five `msd-g2` four-camera radtan8 segments) and is split
# into three tiers: `smoke` runs on every commit, `accuracy` per pull request,
# `long` nightly.
#
# Everything here is frozen on purpose. The capture and ground-truth properties,
# and each layer's size and schema hash, are what the catalog reports today, so a
# re-conversion that changes a frame count or a schema fails a test instead of
# silently moving the numbers. The decode path is frozen because it moves ATE by
# about 5 cm on a deterministic VIO: the MSD AV1 streams are limited-range
# yuv420p with flat chroma, so the `gray8` reformat (limited to full expansion)
# recovers the original grayscale while the raw Y plane is off by up to 17 LSB.
# The IMU block is frozen because the catalog does not carry noise densities,
# bias random walks, the update rate or the camera time offset; the values are
# basalt's own MSD calibration (`data/msd/msd*_calib.json`).
#
# Each `[[dataset]]` names the basalt VIO config its segments run with, vendored
# under `configs/` from the fork's `data/msd/`. It is the whole configuration and
# not one device field: `msd{mi,mg}_config.json` set `vio_marg_lost_landmarks =
# true` where basalt's constructor says `false`, so a run built from the
# constructor's defaults is a different estimator from the C++ reference's
# (C72). `flow_config` reads the file and asserts the segment's
# `optical_flow_image_safe_radius` against it; a test compares the vendored copy
# with the configuration every C++ `run.json` embeds, key by key.
#
# Layers live on the NAS, one `.rrd` per segment per layer, plus a EuRoC-style
# `gt.csv` sidecar. Two clocks are in play and confusing them costs every
# association: the `video_time` index is relative, and the sidecar (like every
# basalt CSV) is absolute device-clock nanoseconds. The conversion is exactly
# `absolute = video_time + capture.start_time_ns`, which is why that field is
# recorded per segment here.

# `[segment.reference]` pins the basalt C++ run this port is measured against:
# the fork commit that produced it, the deterministic settings, the committed
# trajectory (or a bundle-only marker for the two long segments), the C++ ATE
# against the `gt.csv` sidecar, and its single-thread wall. `gate_policy` says
# how hard that segment may be gated -- see the README.
#
# `[segment.reference.expected_cpp_ate]` carries that error twice: `rmse_cm` is
# the reference run itself (`use-double 0`), `rmse_cm_f64` is the same code on
# the same pixels with `use-double 1`, one thread and `deterministic 1`. The two
# are the C++'s own precision band (D60) and their distance is what basalt's
# answer is worth on that clip: 0.00007 cm on MIO10, 2.30 cm on the 410-second
# MIO14, where changing nothing but the floating-point width also moves its
# trajectory by 4.24 cm rmse. The port's ground-truth error is gated against that
# band and not against a single number, because a single number claims a
# precision the reference does not have. Every f64 value here was measured on
# this decode path with `slam_rs.trajectory.ate`, the same call that produced the
# f32 column, and each run's f32 twin reproduced `rmse_cm` exactly.
#
# `expected_cpp_wall_s` is the `run.feed_wall_time_s` of the run manifest beside
# it: the decode-plus-VIO feed loop with nothing logged, on `pablo-dl-server`,
# one TBB thread. The port's own replay of the same footage must land within
# `SPEED_TOLERANCE` of it (D58), so a port that is several times slower fails the
# gate rather than passing it quietly.
#
# `hold_out = true` marks a segment tuning may not look at (C56): the gate still
# runs it and prints its row, and its numbers are a check on work done without
# it.

schema_version = 8
catalog_url = "rerun+http://dgx-spark:9988"

# Landscape, unrotated: the Index stores its two fisheye cameras as captured.
[[dataset]]
name = "msd-index"
entry_id = "18D2C8A5D1E6B2217c6d7f028ca47884"
num_cameras = 2
camera_resolution_wh = [[960, 960], [960, 960]]
image_rotation_cw_deg = [0, 0]
vio_config = "configs/msdmi_config.json"

# Portrait: the G2 video is stored rotated (cam0/cam1 90 degrees clockwise,
# cam2/cam3 270), with the catalog intrinsics and extrinsics rotated to match.
# Nothing may assume a landscape frame or a shared orientation across cameras.
[[dataset]]
name = "msd-g2"
entry_id = "18D2CC37925CE0376257837ab3439f34"
num_cameras = 4
camera_resolution_wh = [[480, 640], [480, 640], [480, 640], [480, 640]]
image_rotation_cw_deg = [90, 90, 270, 270]
vio_config = "configs/msdmg_config.json"

