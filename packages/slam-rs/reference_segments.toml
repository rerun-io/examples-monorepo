# Reference set for slam-rs accuracy work: ten Monado SLAM Dataset segments.
#
# The set is motion-stratified over the two catalog datasets (five `msd-index`
# stereo KB4 segments, five `msd-g2` four-camera radtan8 segments) and is split
# into three tiers: `smoke` runs on every commit, `accuracy` per pull request,
# `long` nightly.
#
# Everything here is frozen on purpose. The capture and ground-truth properties
# are what the catalog reports today, so a re-conversion that changes a frame
# count fails a test instead of silently moving the numbers. The decode path is
# frozen because it moves ATE by about 5 cm on a deterministic VIO: the MSD AV1
# streams are limited-range yuv420p with flat chroma, so the `gray8` reformat
# recovers the original grayscale while the raw Y plane is off by up to 17 LSB.
# The IMU block is frozen because the catalog does not carry noise densities,
# bias random walks, the update rate or the camera time offset; the values are
# basalt's own MSD calibration (`data/msd/msd*_calib.json`).
#
# Layers live on the NAS, one `.rrd` per segment per layer, plus a EuRoC-style
# `gt.csv` sidecar with absolute device-clock timestamps and a w-first
# quaternion. The `video_time` index is that clock minus
# `property:capture:start_time_ns`.

schema_version = 1
catalog_url = "rerun+http://dgx-spark:9988"

# rotation-dominated panorama; 8 s, catches gross frontend or IMU sign errors in seconds
[[segment]]
dataset_name = "msd-index"
dataset_entry_id = "18D2C8A5D1E6B2217c6d7f028ca47884"
segment_id = "msd-index__MIO_others__MIO10_short_2_panorama"
tier = "smoke"
base_url = "file:///mnt/nas/datasets/msd-rrd/base/msd-index__MIO_others__MIO10_short_2_panorama.rrd"
gt_url = "file:///mnt/nas/datasets/msd-rrd/gt/msd-index__MIO_others__MIO10_short_2_panorama.rrd"
gt_csv = "/mnt/nas/datasets/msd-rrd/sidecars/msd-index__MIO_others__MIO10_short_2_panorama/gt.csv"
decode_path = "cpu_gray8_dav1d_1thread"

