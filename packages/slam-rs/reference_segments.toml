# RoboCap session 15: the hard six-camera fisheye rig and the deployment target.
# It has no ground truth, so its metric is agreement with the basalt C++ output
# rather than ATE against GT. Two basalt references exist: the `slam` layer on
# the NAS (1,588 poses, the persisted 4-camera 640x360 replay) and the checked-in
# fixture pair under `tests/reference/robocap-s15/`.
#
# RoboCap is not registered on any running catalog server; both layers are read
# from the NAS `.rrd` files, served in process, so there are no layer
# fingerprints to record.
[robocap]
session_id = "s00000015"
device_id = "f408193e6447b3b0"
segment_id = "robocap__f408193e6447b3b0__s00000015"
