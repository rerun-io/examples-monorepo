# RoboCap: the hard six-camera fisheye rig and the deployment target. It has no
# ground truth, so its metric is agreement with the basalt C++ output rather than
# ATE against GT. The `slam` layer beside each base layer on the NAS **is** the
# C++ golden run: session 15's layer, moved onto the CSV clock by
# `imu.cam_time_offset_ns`, reproduces `tests/reference/robocap-s15/traj_s15_vga.csv`
# pose for pose (0.000000 cm rmse, quaternion within float32 rounding), while the
# catalog-fed C++ run in the reference bundle sits 9.70 cm away. So the C++ lane
# to reproduce is `basalt_vio` on the raw session files: four of the six cameras,
# `swscale` AREA downscale 3 to 640x360 on gray8, the Kalibr calibration
# converted at that downscale, `deterministic=1` on one thread in f32.
#
# Both RoboCap entries name NAS file URLs on purpose: the base and `slam` layers
# are read from those `.rrd` files and served in process, so this lane does not
# depend on any catalog registration and there are no layer fingerprints to
# record. Whether a catalog somewhere also holds the dataset is not this file's
# business.
[robocap]
device_id = "f408193e6447b3b0"
has_ground_truth = false
decode_path = "cpu_gray8_swscale_area_downscale3"
# The four cameras the C++ ran, in the calibration's own order: the two eye
# cameras are excluded. These are the `name` statics on the rig's camera nodes,
# which sit at cam_04, cam_00, cam_01 and cam_05 respectively.
camera_names = ["left", "left_front", "right_front", "right"]
downscale = 3
# The rig's six cameras are triggered together but time-stamped per device, so a
# frameset's frames sit tens of microseconds apart where two framesets sit 33 ms
# apart; this is `dataset_io_robocap.cpp`'s own tolerance. The two inertial
# channels run on their own clocks, which basalt pairs by interpolating the
# accelerometer onto the gyroscope's timestamps.
frameset_tolerance_ns = 1000000
interpolate_accel_onto_gyro = true
# The recorder stamps the device clock on the video timeline itself, where MSD
# stamps time since `property:capture:start_time_ns`. So an exported trajectory
# adds nothing here, and that is the clock the basalt CSVs beside the sessions
# carry.
video_time_is_absolute = true
# basalt's own files, as `python/robocap_vit.toml` and
# `scripts/basalt_convert_robocap_calib.py --downscale 3` produced them.
vio_config = "configs/msdmo_config.json"
calibration = "configs/robocap_calib_downscale3.json"

[robocap.imu]
rate_hz = 200.0
gyro_noise_std = 0.0007300442812547
accel_noise_std = 0.005955224218014
gyro_bias_std = 3.445397083168e-05
accel_bias_std = 0.0001963150489218
cam_time_offset_ns = 14902432

# The two sessions S17 measured. `basalt_num_poses` is the pose count on the
# session's own `slam` layer, which is also its complete frameset count.
# `expected_cpp_wall_s` is optional and only session 15 has one: 88.91 s is what
# the C++ took over the same 1,588 framesets at 30 fps with its own Rerun
# logging on, measured on **cap A** (Pablo's vault note, S20 §2) — the one place
# the port and the C++ ran on the same silicon. Like the MSD segments' own
# `expected_cpp_wall_s` it is a reference wall from one machine, so on any other
# machine the ratio to it is a fact about that machine.
[[robocap.session]]
session_id = "s00000015"
segment_id = "robocap__f408193e6447b3b0__s00000015"
base_url = "file:///mnt/nas/datasets/robocap/rrd/base/robocap__f408193e6447b3b0__s00000015.rrd"
slam_url = "file:///mnt/nas/datasets/robocap/rrd/slam/robocap__f408193e6447b3b0__s00000015.rrd"
basalt_num_poses = 1588
expected_cpp_wall_s = 88.91

