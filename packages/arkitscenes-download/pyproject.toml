[project]
name = "arkitscenes-download"
version = "0.1.0"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    # common/catalog-common: numpy, scipy, jaxtyping, rerun-sdk, av, opencv,
    #                        pyserde, huggingface_hub, hf-transfer
    # feature deps (conda): ffmpeg (av1_nvenc/libsvtav1), imagecodecs, trimesh, pillow, curl, rich
    "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arkitscenes_download"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = [
    "E501",   # Line too long
    "F722",   # jaxtyping forward annotation false positive
    "F821",   # jaxtyping forward annotation false positive
    "UP037",  # Remove quotes false positive with jaxtyping
    "UP040",  # Beartype requires TypeAlias, not PEP 695 type
]

[tool.vulture]
paths = ["arkitscenes_download", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*"]
sort_by_size = true
min_confidence = 60
# benchmark/full_run/convert: Modal CLI entrypoints, invoked via `modal run ...::name`
# is_in_threedod: metadata.csv row field, parsed for schema completeness
# Foreign-layer entity paths are consumed by packages/prompt-da and packages/gauss-surf.
ignore_names = [
    "is_in_threedod",
    "clock_fraction_over_10ms",
    "DEPTH_PROMPTDA",
    "PROMPTDA_MESH",
    "DEPTH_SPLAT_WIDE",
    "DEPTH_SPLAT_ULTRAWIDE",
    "RGB_SPLAT_ULTRAWIDE_RECT",
    "NORMALS_SPLAT_ULTRAWIDE_RECT",
    "ERROR_RGB_ULTRAWIDE_RECT",
    "ERROR_DEPTH_ULTRAWIDE_RECT",
    "ERROR_NORMAL_ULTRAWIDE_RECT",
    "SHARPNESS_WIDE",
    "SHARPNESS_ULTRAWIDE",
    "FRAME_SELECTION_WIDE",
    "FRAME_SELECTION_ULTRAWIDE",
    "NORMALS_MOGE",
    "PINHOLE_ULTRAWIDE_RECT",
    "RGB_ULTRAWIDE_RECT",
    "DEPTH_ULTRAWIDE_RECT",
    "NORMALS_ULTRAWIDE_RECT",
    "benchmark",
    "full_run",
    "convert",
    # Rerun protocol hooks invoked dynamically for custom Apple provenance components.
    "as_arrow_array",
    "as_component_batches",
]
