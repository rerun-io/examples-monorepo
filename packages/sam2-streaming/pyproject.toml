[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2"
version = "1.0.0"
description = "SAM 2: Segment Anything in Images and Videos"
requires-python = ">=3.10.0"
license = "Apache-2.0"
authors = [
    { name = "Meta AI", email = "segment-anything@meta.com" },
]
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=1.24.4",
    "tqdm>=4.66.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=9.4.0",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.9.1",
    "jupyter>=1.0.0",
    "opencv-python>=4.7.0",
    "eva-decord>=0.6.1",
]
interactive-demo = [
    "Flask>=3.0.3",
    "Flask-Cors>=5.0.0",
    "av>=13.0.0",
    "dataclasses-json>=0.6.7",
    "eva-decord>=0.6.1",
    "gunicorn>=23.0.0",
    "imagesize>=1.4.1",
    "pycocotools>=2.0.8",
    "strawberry-graphql>=0.243.0",
]
dev = [
    "black==24.2.0",
    "usort==1.0.2",
    "ufmt==2.0.0b2",
    "fvcore>=0.1.5.post20221221",
    "pandas>=2.2.2",
    "scikit-image>=0.24.0",
    "tensorboard>=2.17.0",
    "pycocotools>=2.0.8",
    "tensordict>=0.6.0",
    "opencv-python>=4.7.0",
    "submitit>=1.5.1",
]

[project.urls]
Homepage = "https://github.com/facebookresearch/sam2"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["notebooks*"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e sam2-streaming-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e sam2-streaming-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.vulture]
# The vendored upstream code is not ours to prune; check the Mojo wrapper and the tests.
paths = ["sam2/mojo_cc.py", "tests"]
exclude = ["*/.pixi/*", "*/__pycache__/*"]
min_confidence = 60
ignore_names = ["pytestmark"]

[tool.ruff]
# The vendored upstream code keeps its own style (the root ruff.toml excludes it); lint only what we own.
include = ["sam2/mojo_cc.py", "tests/**/*.py"]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]
