[project]
name = "egohand-inference"
version = "0.1.0"
description = "Vendored EgoHand and DINOv3 inference subset"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egohand", "src/egohand_inference", "src/egohand_dinov3"]

[tool.ruff]
extend-exclude = ["src"]
