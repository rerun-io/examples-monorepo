[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = [
    # common: numpy, jaxtyping, rerun-sdk, huggingface_hub, tqdm, simplecv
    # cuda: pytorch-gpu, torchvision, onnxruntime-gpu, tensorrt-cu13
    "simplecv",
    "tyro>=0.9.1",
]
description = "Unified 2D/3D keypoint-network abstraction: one model API over PyTorch, ONNX Runtime (CUDA IOBinding), and TensorRT backends with GPU-resident pre/postprocessing"
name = "posekit"
requires-python = ">= 3.12"
version = "0.1.0"

# Workspace siblings named above resolve to their in-repo path (never to a PyPI
# namesake); the root manifest installs the same paths editable.
[tool.uv.sources]
simplecv = { path = "../simplecv", editable = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/posekit"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/posekit", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 80
