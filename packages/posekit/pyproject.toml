[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = [
    # common: numpy, jaxtyping, rerun-sdk, huggingface_hub, tqdm, simplecv
    # cuda: pytorch-gpu, torchvision, onnxruntime-gpu, tensorrt-cu13
    "simplecv",
    "tyro>=0.9.1",
]
description = "Unified 2D/3D keypoint-network abstraction: one model API over PyTorch, ONNX Runtime (CUDA IOBinding), and TensorRT backends with GPU-resident pre/postprocessing"
name = "posekit"
requires-python = ">= 3.12"
version = "0.1.0"

# Workspace siblings named above resolve to their in-repo path (never to a PyPI
# namesake); the root manifest installs the same paths editable.
[tool.uv.sources]
simplecv = { path = "../simplecv", editable = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# The vendored EgoHand/DINOv3 inference source keeps its upstream import names:
# the checkpoint's Hydra cfg instantiates `egohand.models...` by name. SAM 3D Body's
# inference source is vendored beside it as `sam3d_body` (see src/sam3d_body/VENDORED.md).
# src/sapiens2_lite is the vendored Sapiens2 pose network.
[tool.hatch.build.targets.wheel]
packages = ["src/posekit", "src/egohand", "src/egohand_inference", "src/egohand_dinov3", "src/sapiens2_lite", "src/sam3d_body"]

[tool.ruff]
line-length = 150
extend-exclude = ["src/egohand", "src/egohand_inference", "src/egohand_dinov3", "src/sapiens2_lite", "src/sam3d_body"]

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e posekit-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e posekit-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/posekit", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 80
# Context-manager/Torch dispatch arguments and compatibility arguments retained
# from the released MHR head (the upstream implementation also ignores them).
ignore_names = ["exc", "types", "do_pcblend", "vertex_offsets", "slim_keypoints"]
