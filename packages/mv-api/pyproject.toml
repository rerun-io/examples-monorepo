[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, gradio, gradio-rerun,
    #         huggingface_hub, hf-transfer, tqdm, pyserde, av, opencv,
    #         simplecv
    "monopriors",
    "rtmlib",
    "tyro>=0.9.1",
    "wilor-nano",
]
description = "Full exo/ego multiview pipeline for raw HoCap datasets"
name = "mv-api"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/mv_api"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/mv_api", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
ignore_names = [
    # simplecv dataset protocol hooks called dynamically by base sequence setup.
    "_build_ego",
    "_build_exo",
    "align_cams_and_videos",
    "image_plane_distance",
    "iter_episode_sequences",
    "load_ego_cams",
    "load_exo_cams",
    "load_labels",
    "load_stream_timestamps_ns",
    "load_video_paths",
    "num_sequences_for_config",
    # test doubles provide attributes consumed by simplecv video reader/sequence bases.
    "_exo_cam_list",
    "_fps",
    "_height",
    "_width",
]
