[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = ["simplecv", "monopriors"]
description = "Open4DGS in the monorepo: 4D Gaussian people from Rerun catalog segments with the TRiGS trainer (recipes/open4dgs-trigs-src), held-out eval and Rerun output"
name = "open4dgs"
requires-python = ">= 3.12"
version = "0.1.0"

[tool.uv.sources]
simplecv = { path = "../simplecv", editable = true }
monopriors = { path = "../monoprior", editable = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/open4dgs"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src/open4dgs", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
min_confidence = 60
ignore_names = [
    "random_start_point", "lengths1", "lengths2", "norm", "return_nn",
    # read through getattr / by the trainer / by pytest and tyro
    "crop_raw_psnr", "crop_raw_ssim", "crop_raw_lpips", "crop_masked_psnr", "crop_masked_ssim", "crop_masked_lpips",
    "fg_psnr", "full_psnr", "full_ssim", "full_lpips", "alpha_iou", "init_layer",
    "has_velocity", "is_static", "dynamic_protect", "dynamic_allowed", "stage_keep",
    "add_scalar", "_sequence_t_max", "pytestmark", "trigs", "rr_config", "exc",
    "num_pixels", "camera_loss_hook",
    # BrightnessSplit fields, read through dataclasses.asdict
    "ratio", "alpha_part", "colour_part", "alpha_mean",
]

[tool.pytest.ini_options]
# pytest-beartype: beartype checks open4dgs only while pytest runs (AGENTS.md, Beartype).
beartype_packages = ["open4dgs"]
# A package imported before pytest-beartype's hook (e.g. by tests/conftest.py) would go unchecked: fail instead.
filterwarnings = ["error::pytest_beartype.roar.PytestBeartypeOptionPackagesWarning"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e open4dgs-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e open4dgs-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
