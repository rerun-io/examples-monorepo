[package]
name = "kornia-staging-3d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kornia-staging-algebra.workspace = true
kornia-3d = { workspace = true, optional = true }
kornia-algebra.workspace = true
kornia-image = { workspace = true, optional = true }
thiserror.workspace = true
nalgebra.workspace = true
rand = { version = "0.10", optional = true, default-features = false, features = ["chacha"] }

[dev-dependencies]
kornia-tensor.workspace = true
serde.workspace = true
proptest.workspace = true
approx.workspace = true
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "cameras"
harness = false

[[bench]]
name = "gp3p"
harness = false
required-features = ["ransac"]

[features]
default = []
virtual-camera = ["dep:kornia-image"]
kornia-3d-interop = ["dep:kornia-3d"]
# GP3P RANSAC on upstream kornia_3d::ransac.
ransac = ["dep:kornia-3d", "dep:rand"]
serde = ["dep:serde"]

[dependencies.serde]
workspace = true
optional = true
