[project]
name = "fdanyone-rerun"
version = "0.1.0"
description = "4DAnyone (one casual video of a person -> synced novel-view videos) streamed into Rerun: CLI, layouts and a Gradio app"
authors = [{name = "Pablo Vela", email = "pablovela5620@gmail.com"}]
requires-python = ">=3.12"
# Static metadata only. Upstream 4DAnyone (`fdanyone`) comes from the `recipes/4danyone-src` conda package, GVHMR from
# `recipes/gvhmr-src`, SageAttention from `recipes/sageattention-src`; torch from the `cuda` feature (pixi.toml).
dependencies = ["simplecv"]

[tool.uv.sources]
simplecv = { path = "../simplecv", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdanyone_rerun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e fdanyone-rerun-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e fdanyone-rerun-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
filterwarnings = ["ignore::beartype.roar.BeartypeDecorHintPep613DeprecationWarning"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501", "F722", "F821", "UP037", "UP040"]

[tool.vulture]
paths = ["src", "tools", "tests"]
exclude = ["*/.pixi/*", "*/__pycache__/*"]
min_confidence = 80
ignore_names = ["pytestmark"]
