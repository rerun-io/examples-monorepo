[project]
authors = [{ name = "pablo vela", email = "pablovela5620@gmail.com" }]
dependencies = [
    # common: numpy, scipy, jaxtyping, rerun-sdk, huggingface_hub, hf-transfer,
    #         tqdm, pyserde, av, opencv
    # cuda: pytorch-gpu, torchvision
    # feature.mamma: torchcodec, einops, tyro (conda) + sam2 path dep
    "smplx>=0.1.28",
    "ultralytics>=8.3",
    "open-clip-torch>=2.24",
    "safetensors>=0.4",
]
name = "mamma"
requires-python = ">= 3.12"
version = "0.1.0"
description = "Streaming multiview body capture: causal MAMMA pipeline (decode -> track -> dense 2D landmarks -> triangulate -> SMPL-X fit -> Rerun)"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "UP037", # Remove quotes from type, false positive when using jaxtyping
    "UP040",  # PEP 695 `type` does not parse on our Python 3.10/3.11 envs, and beartype errors name only the alias, not the shape
]

[tool.pytest.ini_options]
markers = [
    "integration: needs a GPU, a downloaded asset/model, the catalog server, a device, or network (run: pixi run -e mamma-dev tests-integration)",
    "golden: reference comparison against stored ground truth (run: pixi run -e mamma-dev tests-golden)",
]
addopts = "-m 'not integration and not golden'"
# A flaky CUDA/decoder deadlock was observed under pytest (rerun tokio + libav
# threads + torchcodec); dump all thread stacks after 5 minutes instead of
# hanging silently so the next occurrence is diagnosable.
faulthandler_timeout = 300

[tool.vulture]
paths = ["src/mamma", "tests", "tools"]
exclude = ["*/.pixi/*", "*/__pycache__/*", "*/build/*", "*/dist/*", "*/node_modules/*"]
sort_by_size = true
# mamma exposes pipeline/preset/dataset/TRT public APIs and Tyro config fields
# that Vulture reports at 60% despite being runtime/CLI/public surfaces.
min_confidence = 80
