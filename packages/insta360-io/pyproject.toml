[build-system]
# >= 1.9.4: sets PYO3_BUILD_EXTENSION_MODULE, which replaces PyO3's extension-module feature.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "insta360-io"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jaxtyping", "numpy", "pyarrow", "rerun-sdk"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/insta360-io-py/Cargo.toml"
# Mixed package: the compiled half is insta360_io._insta360_io (stubs: python/insta360_io/_insta360_io.pyi), the Python
# half (python/insta360_io: InsvReader, the Rerun chunk layer) ships beside it with py.typed.
module-name = "insta360_io._insta360_io"
python-source = "python"
